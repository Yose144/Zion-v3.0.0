# Docker daemon — memory limits + OOM deprioritization
# Drop-in: /etc/systemd/system/docker.service.d/ram-limits.conf
# dockerd currently uses ~1 GB for just 1 container (Next.js web, 131 MB).
# That's excessive. Cap at 1.5 GB. If it exceeds, systemd restarts it
# (Docker recovers gracefully — containers keep running).
# Also deprioritize in OOM: Docker is less critical than ZION nodes.
[Service]
MemoryMax=1536M
MemoryHigh=1G
# OOM: Docker is expendable compared to nodes — higher score = killed first
ExecStartPre=/bin/sh -c 'echo 500 > /proc/self/cgroup/../../docker.service/oom_score_adj 2>/dev/null || true'
