# ZION Edge — journald persistent storage limit
# Drop-in: /etc/systemd/journald.conf.d/zion-limits.conf
# Keeps journal bounded so it doesn't grow unbounded (was 1 GB+ before).
[Journal]
# Persistent storage cap
SystemMaxUse=200M
SystemMaxFileSize=20M
SystemMaxFileCount=10
# Also cap per-user
RuntimeMaxUse=50M
# Compress old journal files
Compress=yes
# Forward to syslog still (for legacy tooling)
ForwardToSyslog=yes
