# ZION Edge Dashboard — override for maintenance sudo support
# Drop-in: /etc/systemd/system/zion-edge-python-dashboard.service.d/maintenance.conf
# The base service has NoNewPrivileges=true + ProtectSystem=strict, which
# block sudo (needed for edge-maintenance.sh actions). This override relaxes
# those so the dashboard can run maintenance via sudo (NOPASSWD in sudoers.d).
[Service]
# sudo needs to escalate privileges — NoNewPrivileges blocks that
NoNewPrivileges=false
# maintenance writes to /var/log, /tmp, /opt — strict makes / read-only
ProtectSystem=full
# Allow writing to maintenance targets
ReadWritePaths=/var/log /tmp /opt/zion /proc/sys/vm /var/cache/apt
# Slower restart to avoid port-in-use races (socket TIME_WAIT)
RestartSec=5
# Kill all processes in the cgroup on stop (frees port reliably)
KillMode=control-group
