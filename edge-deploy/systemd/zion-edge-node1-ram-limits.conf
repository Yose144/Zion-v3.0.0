# ZION Edge Node 1 (Primary) — memory limits + OOM protection
# Drop-in: /etc/systemd/system/zion-edge-node1.service.d/ram-limits.conf
# The primary node is the most critical service. It currently uses ~1.3 GB
# but can spike during sync. Cap at 2 GB to prevent memory leaks from
# starving other services. Mark as OOM-protected (never killed by OOM killer).
[Service]
# Hard cap: if node1 exceeds 2 GB, systemd kills it (and watchdog restarts it)
MemoryMax=2G
# Soft cap: kernel starts reclaiming from node1 above 1.5 GB
MemoryHigh=1536M
# OOM protection: OOM killer will never target this service
OOMPolicy=continue
# Lower oom_score_adj = less likely to be killed by OOM
# (set via ExecStartPre because systemd doesn't have a direct directive)
ExecStartPre=/bin/sh -c 'echo -1000 > /proc/self/cgroup/../../zion-edge-node1.service/oom_score_adj 2>/dev/null || true'
