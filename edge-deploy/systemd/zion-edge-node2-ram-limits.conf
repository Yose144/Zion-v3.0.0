# ZION Edge Node 2 (Follower) — memory limits + OOM protection
# Drop-in: /etc/systemd/system/zion-edge-node2.service.d/ram-limits.conf
# The follower is less critical (it re-syncs from primary on restart).
# Cap at 1 GB — it currently uses ~340 MB, so plenty of headroom.
[Service]
MemoryMax=1G
MemoryHigh=768M
OOMPolicy=continue
ExecStartPre=/bin/sh -c 'echo -500 > /proc/self/cgroup/../../zion-edge-node2.service/oom_score_adj 2>/dev/null || true'
