# ZION Edge — logrotate for zion-pool.log
# Drop-in: /etc/logrotate.d/zion-pool
# The pool service writes to /var/log/zion-pool.log via stdout redirect.
/var/log/zion-pool.log {
    daily
    rotate 7
    size 50M
    minsize 1M
    compress
    compresscmd /bin/gzip
    compressoptions -9
    delaycompress
    missingok
    notifempty
    copytruncate
    # No postrotate restart needed — copytruncate keeps the file handle open
    su root root
    create 0640 root adm
}
