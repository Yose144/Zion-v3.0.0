# ──────────────────────────────────────────────────────────────────────────────
# ZION Edge Server — journald limits
# Drop-in: /etc/systemd/journald.conf.d/zion-edge.conf
#
# Limits journal disk usage to prevent unbounded growth.
# Applied via systemd-journald restart (no reboot needed).
# ──────────────────────────────────────────────────────────────────────────────

[Journal]
# Maximum total disk space for persistent journal
SystemMaxUse=1G
# Always keep at least 2G free on the disk
SystemKeepFree=2G
# Individual journal file max size
SystemMaxFileSize=100M
# Maximum number of journal files
SystemMaxFiles=100
# Retain logs for 14 days max
MaxRetentionSec=14day
# Compress old journal entries
Compress=yes
# Forward to syslog (we keep this ON so rsyslog can filter, but
# rsyslog config now drops zion-node RPC spam — see rsyslog-zion-edge.conf)
ForwardToSyslog=yes
# Rate limit: max 5000 messages per 30s per service
RateLimitIntervalSec=30s
RateLimitBurst=5000
