# ──────────────────────────────────────────────────────────────────────────────
# ZION Edge Server — rsyslog filter for zion-node RPC spam
# Drop-in: /etc/rsyslog.d/10-zion-edge.conf
#
# The zion-node process logs every RPC request and response at INFO/DEBUG
# level to journald, which forwards to rsyslog → /var/log/syslog. This
# causes syslog to grow by GBs per day (76GB observed on 2026-06-23).
#
# We filter out ONLY the noisy RPC lines while keeping all important logs
# (BLOCK_FOUND, errors, warnings, startup, peer events, etc.).
#
# Applied via: systemctl restart rsyslog
# ──────────────────────────────────────────────────────────────────────────────

# Drop zion-node RPC request/response/connection lines only.
# Uses rsyslog v8+ IF/THEN syntax. 'stop' replaces deprecated '~'.
if $programname == 'zion-node' and (
    $msg contains 'rpc_in=' or
    $msg contains 'rpc_out=' or
    $msg contains 'jsonrpc_out=' or
    $msg contains 'rpc_client_addr=' or
    $msg contains 'rpc_audit'
) then {
    stop
}

# Drop high-volume zion-pool per-share/per-job logs while keeping errors,
# BLOCK_FOUND, session start/end, routing snapshots and vardiff retargets.
if $programname == 'zion-pool-server' and (
    $msg contains 'iteration=' or
    $msg contains 'issued_job_id=' or
    $msg contains 'wire_job=' or
    $msg contains 'wire_submit=' or
    $msg contains 'iteration_elapsed_ms=' or
    $msg contains 'wire_result=' or
    $msg contains 'share_status=' or
    $msg contains 'valid_share miner=' or
    $msg contains 'share_relayed miner=' or
    $msg contains 'wire_stale=' or
    $msg contains 'wire_cancel='
) then {
    stop
}

# All other zion-node / zion-pool-server messages (BLOCK_FOUND, errors,
# warnings, startup, shutdown, routing snapshots) continue to flow through
# to /var/log/syslog normally.
