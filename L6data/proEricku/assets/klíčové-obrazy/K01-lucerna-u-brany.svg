<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="sky" cx="46%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#1e3d36"/>
      <stop offset="45%" stop-color="#132730"/>
      <stop offset="100%" stop-color="#070d12"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#f2a86b" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#c97a5a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0b141a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lanternCore" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="60%" stop-color="#f7b56e"/>
      <stop offset="100%" stop-color="#b45f3f"/>
    </radialGradient>
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8a0b0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8a0b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6b72"/>
      <stop offset="55%" stop-color="#3e4c52"/>
      <stop offset="100%" stop-color="#222e34"/>
    </linearGradient>
    <linearGradient id="stoneDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b4a50"/>
      <stop offset="100%" stop-color="#1d262b"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16241f"/>
      <stop offset="100%" stop-color="#0a1210"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c49a5e"/>
      <stop offset="100%" stop-color="#7d5c34"/>
    </linearGradient>
    <linearGradient id="radhaRobe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a05f6e"/>
      <stop offset="100%" stop-color="#4c2c3a"/>
    </linearGradient>
    <filter id="soft2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="soft6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft14"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft30"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <!-- ===== SKY ===== -->
  <rect width="1280" height="720" fill="url(#sky)"/>
  <g fill="#cfe8dd" opacity="0.5">
    <circle cx="140" cy="90" r="1.2"/><circle cx="260" cy="160" r="0.9"/>
    <circle cx="420" cy="70" r="1.1"/><circle cx="560" cy="130" r="0.8"/>
    <circle cx="700" cy="60" r="1.3"/><circle cx="980" cy="90" r="1.0"/>
    <circle cx="1120" cy="150" r="1.2"/><circle cx="1200" cy="60" r="0.8"/>
    <circle cx="880" cy="140" r="0.7"/><circle cx="60" cy="200" r="0.9"/>
    <circle cx="340" cy="110" r="0.7"/><circle cx="1240" cy="220" r="0.9"/>
  </g>

  <!-- distant forest — low organic masses, not rings -->
  <g fill="#0e1c18" opacity="0.95">
    <path d="M-40 560 Q 60 380 190 420 Q 300 370 330 470 Q 340 520 300 560 Z" filter="url(#soft14)"/>
    <path d="M1320 560 Q 1230 370 1100 420 Q 1010 380 990 480 Q 985 530 1030 560 Z" filter="url(#soft14)"/>
    <path d="M520 560 Q 540 430 640 445 Q 720 430 730 500 Q 720 545 690 560 Z" filter="url(#soft14)"/>
  </g>
  <g stroke="#16291f" stroke-width="11" stroke-linecap="round" opacity="0.75" fill="none">
    <path d="M110 565 C 120 450, 100 360, 130 250"/>
    <path d="M205 570 C 195 465, 225 375, 200 265"/>
    <path d="M1150 570 C 1160 455, 1140 365, 1170 255"/>
  </g>

  <!-- ===== GROUND ===== -->
  <path d="M0 525 Q 320 505 640 518 T 1280 528 L1280 720 L0 720 Z" fill="url(#ground)"/>
  <ellipse cx="500" cy="602" rx="150" ry="24" fill="#c98a5a" opacity="0.16" filter="url(#soft14)"/>

  <!-- ===== THE GATE — fully in frame, right-center ===== -->
  <g>
    <!-- arch inner opening -->
    <path d="M770 565 L772 330 Q 826 302 880 328 L882 565 Z" fill="#081110" opacity="0.9"/>
    <!-- left pillar -->
    <path d="M688 565 L692 305 Q 693 282 708 276 L 758 272 Q 772 276 774 294 L778 565 Z" fill="url(#stone)"/>
    <!-- right pillar -->
    <path d="M878 565 L874 294 Q 878 274 896 272 L 946 276 Q 960 282 958 305 L952 565 Z" fill="url(#stone)"/>
    <!-- lintel -->
    <path d="M676 272 Q 812 238 970 266 L 966 300 Q 812 272 682 304 Z" fill="url(#stoneDark)"/>
    <!-- the LINE ornament on lintel — faint rose glow -->
    <path d="M700 280 Q 780 254 872 260 Q 916 263 950 272" fill="none"
          stroke="#e8a0b0" stroke-width="2.6" stroke-linecap="round"
          opacity="0.8" filter="url(#soft2)"/>
    <ellipse cx="825" cy="268" rx="120" ry="18" fill="url(#roseGlow)"/>
    <!-- moss seams -->
    <path d="M694 348 q 32 8 66 4 M 878 390 q 36 -6 72 2 M 700 478 q 34 6 66 0"
          stroke="#3d5442" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- roots wrapping pillars -->
    <g stroke="#241b12" fill="none" stroke-linecap="round">
      <path d="M688 565 C 678 505 704 475 694 425 C 686 385 708 345 700 300" stroke-width="14"/>
      <path d="M952 565 C 966 515 938 475 952 425 C 962 385 942 345 954 300" stroke-width="13"/>
      <path d="M682 304 C 712 314 750 304 790 316" stroke-width="9"/>
      <path d="M966 300 C 936 310 906 304 874 316" stroke-width="8"/>
    </g>
    <g stroke="#3a2c1c" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M688 565 C 680 510 702 477 695 430 C 688 390 706 350 701 308" stroke-width="6"/>
      <path d="M952 565 C 963 517 941 477 950 430 C 959 387 944 350 951 304" stroke-width="5"/>
    </g>
  </g>

  <!-- travelers: two soft silhouettes inside the arch, warm rim from lantern -->
  <g fill="#1c2b26" opacity="0.95">
    <path d="M788 565 l 4 -72 q 2 -13 11 -13 q 10 0 12 13 l 4 72 Z"/>
    <circle cx="803" cy="474" r="9"/>
    <path d="M826 565 l 3 -60 q 2 -11 10 -11 q 8 0 10 11 l 3 60 Z"/>
    <circle cx="839" cy="488" r="8"/>
  </g>
  <g stroke="#f2a86b" stroke-width="1.6" fill="none" opacity="0.4">
    <path d="M792 492 q 2 -12 10 -12"/>
    <path d="M829 506 q 2 -10 9 -10"/>
  </g>
  <!-- faint light beyond the gate -->
  <ellipse cx="826" cy="560" rx="40" ry="10" fill="#f2a86b" opacity="0.08" filter="url(#soft14)"/>

  <!-- ===== RADHA beside right pillar ===== -->
  <g>
    <ellipse cx="1002" cy="520" rx="42" ry="64" fill="url(#roseGlow)" opacity="0.5"/>
    <path d="M988 590 l -9 -88 q -3 -15 11 -17 l 15 0 q 14 2 11 17 l -7 88 Z" fill="url(#radhaRobe)"/>
    <circle cx="997" cy="466" r="14" fill="#d9b28e"/>
    <path d="M984 462 q 13 -15 27 0 q 2 9 -2 13 l -23 0 q -4 -5 -2 -13 Z" fill="#3a2430"/>
    <ellipse cx="994" cy="518" rx="13" ry="6.5" fill="#caa66a"/>
    <path d="M981 518 q 13 9 26 0" fill="none" stroke="#8a6a3a" stroke-width="2"/>
  </g>

  <!-- ===== LUMI — left of gate, facing it ===== -->
  <g>
    <circle cx="512" cy="515" r="235" fill="url(#lanternGlow)"/>
    <!-- dress -->
    <path d="M448 592 l 6 -68 q 2 -12 12 -14 l 14 -2 q 12 1 14 14 l 8 70 Z" fill="url(#dress)"/>
    <!-- rose sash -->
    <path d="M450 536 q 20 8 42 -4 l 3 12 q -22 12 -43 4 Z" fill="#c98a9b"/>
    <!-- head -->
    <circle cx="474" cy="492" r="16" fill="#e8c9a8"/>
    <!-- blonde wispy hair — soft cap + strands falling beside the face -->
    <path d="M459 495 q -3 -20 15 -21 q 18 1 16 19 q -1 7 -4 10 l -3 -9 q -9 -6 -18 0 l -2 9 q -3 -3 -4 -8 Z" fill="#e8d489"/>
    <g stroke="#ecd98f" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M460 494 q -4 10 -2 17"/>
      <path d="M489 493 q 4 10 2 16"/>
    </g>
    <circle cx="479" cy="495" r="1.6" fill="#7a5a40"/>
    <!-- arm reaching out toward gate with lantern -->
    <path d="M490 518 q 16 2 24 8" stroke="#e8c9a8" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- bare feet -->
    <ellipse cx="458" cy="597" rx="7" ry="3.4" fill="#d9b28e"/>
    <ellipse cx="480" cy="597" rx="7" ry="3.4" fill="#d9b28e"/>

    <!-- LANTERN -->
    <g transform="translate(522 506)">
      <path d="M-6 -10 q 6 -10 12 0" stroke="#5a4632" stroke-width="3" fill="none"/>
      <rect x="-11" y="-8" width="22" height="30" rx="3" fill="#4a3826"/>
      <rect x="-8" y="-5" width="16" height="24" rx="2" fill="url(#lanternCore)"/>
      <rect x="-11" y="-9" width="22" height="3" fill="#7a5a3a"/>
      <rect x="-11" y="20" width="22" height="3" fill="#7a5a3a"/>
      <!-- the unfinished LINE inside -->
      <path d="M-5 14 Q -1 4 4 6 T 6 -2" fill="none" stroke="#ffe9c4"
            stroke-width="1.8" stroke-linecap="round" opacity="0.95" filter="url(#soft2)"/>
    </g>
  </g>

  <!-- light spores -->
  <g fill="#ffd9a0">
    <circle cx="580" cy="470" r="2" opacity="0.8"/>
    <circle cx="468" cy="435" r="1.6" opacity="0.6"/>
    <circle cx="600" cy="545" r="1.4" opacity="0.5"/>
    <circle cx="418" cy="545" r="1.8" opacity="0.6"/>
    <circle cx="640" cy="495" r="1.2" opacity="0.5"/>
    <circle cx="700" cy="420" r="1.5" opacity="0.45"/>
    <circle cx="545" cy="435" r="1.1" opacity="0.5"/>
  </g>

  <!-- ground mist -->
  <g fill="#9fb8ad" opacity="0.10" filter="url(#soft30)">
    <ellipse cx="320" cy="625" rx="260" ry="28"/>
    <ellipse cx="920" cy="645" rx="320" ry="32"/>
  </g>

  <!-- foreground roots -->
  <g stroke="#17110b" stroke-linecap="round" fill="none">
    <path d="M-10 705 C 60 665 90 695 160 672 C 210 656 240 672 300 660" stroke-width="16"/>
    <path d="M1290 695 C 1220 660 1180 690 1120 665" stroke-width="14"/>
  </g>

  <!-- vignette -->
  <rect width="1280" height="720" fill="none" stroke="#000" stroke-width="60" opacity="0.28" filter="url(#soft30)"/>
</svg>
