[package]
name = "trae-labs"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[lib]
name = "trae_labs"
path = "src/lib.rs"

[[bin]]
name = "bench_all"
path = "src/bin/bench_all.rs"

[[bin]]
name = "test_variants"
path = "src/bin/test_variants.rs"

[[bin]]
name = "miner"
path = "src/bin/miner.rs"

[dependencies]
blake3 = "1.5"
sha3 = "0.10"
rand = "0.8"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
