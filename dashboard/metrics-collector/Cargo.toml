[package]
name = "zion-dashboard-metrics"
version = "3.0.0"
edition = "2021"

[workspace]
members = ["."]
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[[bin]]
name = "zion-dashboard-metrics"
path = "src/main.rs"
