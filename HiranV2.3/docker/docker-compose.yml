version: "3.8"

services:
  hiran-v2-3:
    build:
      context: ../..
      dockerfile: HiranV2.3/docker/Dockerfile
    image: hiran-v2.3:latest
    container_name: hiran-v2-3-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../../HiranV2.3/models:/models:ro
      - ../../HiranV2.3/rag:/app/rag
      - hiran_logs:/app/logs
    environment:
      # NOTE: Model must be trained first. This path is a placeholder.
      # Train: python scripts/train_v2.3_fullft.py --stage all
      # Quantize: python scripts/quantize.py --checkpoint checkpoints/stage1_factual/final
      - HIRAN_MODEL_PATH=/models/hiran-v2.3-q5_k_m.gguf
      - HIRAN_BACKEND=llama.cpp
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hiran_net

  # Optional: ChromaDB for persistent RAG
  chromadb:
    image: chromadb/chroma:latest
    container_name: hiran-chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - hiran_net

  # Optional: Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: hiran-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - hiran_net
    profiles:
      - monitoring

volumes:
  hiran_logs:
  chroma_data:
  prometheus_data:

networks:
  hiran_net:
    driver: bridge
