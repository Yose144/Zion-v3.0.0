[workspace]
members = ["miner", "dashboard", "agent"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Yose144"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
num_cpus = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }

# V3 algorithm crates (path references to canonical source)
zion-core          = { path = "../V3/L1/core" }
zion-pool          = { path = "../V3/L1/pool" }
zion-cosmic-harmony = { path = "../V3/L1/cosmic-harmony" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev.package.zion-cosmic-harmony]
opt-level = 2

[profile.dev.package.zion-core]
opt-level = 1
