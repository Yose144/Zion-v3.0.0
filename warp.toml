# V31 WARP minimal local config — only zion-l1 enabled for dev/backup node.
# Other chains are explicitly disabled with reasons.
node_id = "local-warp-node-1"
listen_addr = "127.0.0.1"
listen_port = 8453
database_path = "/home/zionserver/2.9.6-main/V31/data/warp.db"

quorum = 3
daily_limit_zion = 10000000
timelock_threshold_zion = 1000000

l1_rpc_url = "http://127.0.0.1:9445"
l1_vault_address = "zion1warp_vault_address"

poll_interval_secs = 15

[[chains]]
name = "zion-l1"
family = "zion-l1"
enabled = true
rpc_url = "http://127.0.0.1:9445"
contract_address = "zion1warp_vault_address"
finality_blocks = 60

[[chains]]
name = "base"
family = "evm"
enabled = false
disabled_reason = "Local dev node: Base bridge contract not configured"
rpc_url = "https://mainnet.base.org"
