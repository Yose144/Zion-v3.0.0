# ZION EDGE2 — journald persistent storage limit
# Drop-in: /etc/systemd/journald.conf.d/zion-edge2-limits.conf
#
# Why (2026-11-01): EDGE2 is the primary box (chain + app stack) and its journal
# had no size cap — it sat at 3.7 GB of /var/log (5.6 GB total) on an 11 GB RAM
# / 193 GB disk host, while `auth.log.1` alone was 512 MB from the sshd storm
# (fixed the same day: dashboard SSH fan-out). 1 GB keeps ~2 weeks of history
# at the current log volume without letting the journal eat the disk.
[Journal]
SystemMaxUse=1G
SystemMaxFileSize=64M
SystemMaxFileCount=20
RuntimeMaxUse=128M
Compress=yes
# Keep forwarding to syslog: rsyslog still owns /var/log/{auth,syslog,kern}.log
ForwardToSyslog=yes
