# ZION Edge — RAM optimization sysctl tuning
# Drop-in: /etc/sysctl.d/99-zion-ram.conf
# Applies on boot + via `sysctl --system`. Safe for 7.8 GB Hetzner VPS.
#
# Philosophy: this server runs 13+ services on 7.8 GB RAM. RAM is chronically
# near-full. We tune the kernel to (a) swap more aggressively to avoid OOM,
# (b) keep dentry/inode cache smaller, (c) allow overcommit so fork() in
# Rust/Python doesn't fail, (d) disable THP to reduce fragmentation.

# ── Swap behavior ───────────────────────────────────────────────────────
# swappiness=60 is default. For chronically-full RAM, keep at 60 — the kernel
# will swap cold pages proactively, keeping hot pages in RAM. Higher (100)
# would swap too aggressively; lower (10) would risk OOM.
vm.swappiness = 60

# vfs_cache_pressure: default 100. Lower = kernel keeps dentry/inode cache
# longer. For our case (many small files, limited RAM), 50 frees cache sooner.
vm.vfs_cache_pressure = 50

# ── Overcommit ──────────────────────────────────────────────────────────
# overcommit_memory=1: always allow allocation (never fail fork/malloc).
# Rust nodes fork occasionally and need headroom. Safe because we have 12GB
# swap as backstop + MemoryMax on heavy services.
vm.overcommit_memory = 1
# overcommit_ratio: how much of RAM+swap can be allocated. With 1 above,
# this is mostly advisory. Keep at 50 (conservative).
vm.overcommit_ratio = 50

# ── OOM killer ──────────────────────────────────────────────────────────
# panic_on_oom=0: don't panic on OOM, let the OOM killer do its job.
# We protect critical services via systemd oom_score_adj (see drop-ins).
vm.panic_on_oom = 0

# ── Memory fragmentation ───────────────────────────────────────────────
# min_free_kbytes: minimum free RAM before kernel starts reclaiming.
# Default ~64MB. Bump to 256MB so the kernel reclaims sooner, avoiding
# sudden OOM spikes. On 7.8GB this is ~3% — safe.
vm.min_free_kbytes = 262144

# ── Transparent Huge Pages ──────────────────────────────────────────────
# THP can cause latency spikes + fragmentation on memory-pressured servers.
# Rust workloads (node) don't benefit from THP. Disable globally.
# (Also set via kernel cmdline, but this is the runtime knob.)
# Note: this is a kernel mm setting, not a sysctl — handled in the
# zion-thp.service that runs `echo never > .../enabled` at boot.
