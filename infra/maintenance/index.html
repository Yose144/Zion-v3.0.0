<title>ZION Terra Nova — údržba · maintenance</title>
<style>
  :root {
    --gold: #fcd116;
    --red: #e41e2b;
    --green: #2ea84a;
    --fg: #f5f2e8;
    --muted: rgba(245, 242, 232, 0.55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--fg);
    /* Reálná all-sky fotografie (ESO/Serge Brunier, CC BY 4.0) — viditelná i bez WebGL */
    background:
      linear-gradient(180deg, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.72) 100%),
      url('/maint-assets/milkyway-eso-4k.jpg') center 30% / cover no-repeat,
      #000;
    overflow: hidden;
    height: 100dvh;
  }
  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .veil {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(70rem 40rem at 50% -10rem, rgba(252, 209, 22, 0.05), transparent 62%),
      linear-gradient(180deg, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
  }
  .wrap {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 0.6rem;
    padding: 1rem 1.25rem max(1.15rem, env(safe-area-inset-bottom));
    pointer-events: none;
  }
  .kicker {
    font-size: 0.72rem;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: rgba(252, 209, 22, 0.75);
    font-weight: 600;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8);
  }
  h1 {
    font-size: clamp(1.45rem, 5vw, 2.1rem);
    font-weight: 800;
    letter-spacing: 0.02em;
    line-height: 1.12;
    text-align: center;
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.85);
  }
  h1 .en {
    display: block;
    font-size: 0.55em;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 0.35rem;
  }
  .card {
    position: relative;
    width: min(34rem, 100%);
    text-align: center;
    background: rgba(10, 9, 6, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(252, 209, 22, 0.28);
    border-radius: 1.45rem;
    padding: 1.15rem 1.3rem 1.05rem;
    box-shadow: 0 24px 90px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    pointer-events: auto;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    background: linear-gradient(90deg, var(--red) 0%, var(--gold) 50%, var(--green) 100%);
    opacity: 0.85;
  }
  .card p { line-height: 1.65; }
  .cs { font-size: 0.98rem; }
  .en { font-size: 0.82rem; color: var(--muted); margin-top: 0.55rem; }
  .eta {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.85rem;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(252, 209, 22, 0.7);
  }
  .eta::before {
    content: '';
    width: 0.45rem;
    height: 0.45rem;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 10px var(--gold);
    animation: blink 1.8s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .foot {
    font-size: 0.72rem;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(245, 242, 232, 0.35);
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.8);
  }
  .foot b { color: rgba(252, 209, 22, 0.6); font-weight: 600; }
  #fallback {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #fallback svg { width: clamp(9rem, 30vw, 13rem); height: auto; opacity: 0.95; }
  @media (max-height: 560px) {
    .card { padding: 1.1rem 1.2rem; }
    h1 { font-size: 1.3rem; }
  }
</style>
<script type="importmap">
  { "imports": { "three": "/maint-assets/three.module.js" } }
</script>
<!--
  Śrí jantra je přesná — devět protínajících se trojúhelníků splňujících
  všechny podmínky konkurrence (i)–(iii) z Chiodo, "On the construction of
  the Śrī Yantra" (C. R. Math. 359, 2021). Parametry bazálních přímek t3/t6/t7
  dle Hueta (YQ 0.668, YP 0.463, YJ 0.398), devátá (t9) řešená tak, aby byl
  centrální trojúhelník rovnostranný. Soustava 13×13, Newton residuum ~1e-15.
-->
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="veil"></div>

  <div id="fallback" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <defs>
        <radialGradient id="orbBody" cx="36%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#fffbeb"/><stop offset="6%" stop-color="#fde68a"/>
          <stop offset="18%" stop-color="#fbbf24"/><stop offset="38%" stop-color="#f59e0b"/>
          <stop offset="58%" stop-color="#d97706"/><stop offset="82%" stop-color="#78350f"/>
          <stop offset="100%" stop-color="#1c0a02"/>
        </radialGradient>
        <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
          <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.2"/>
          <stop offset="70%" stop-color="#f59e0b" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="256" cy="256" r="140" fill="url(#orbGlow)"/>
      <circle cx="256" cy="256" r="110" fill="url(#orbBody)"/>
      <text x="256" y="470" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" letter-spacing="6" fill="#fbbf24" opacity="0.9">ZION</text>
    </svg>
  </div>

  <main class="wrap">
    <p class="kicker">Zion Terra Nova</p>
    <h1>
      Probíhá údržba
      <span class="en">Under maintenance</span>
    </h1>

    <div class="card">
      <p class="cs">Pracujeme na vylepšení ekosystému.<br>Brzy jsme zpět — děkujeme za trpělivost.</p>
      <p class="en">We&rsquo;re upgrading the ecosystem.<br>Back soon — thank you for your patience.</p>
      <span class="eta">Brzy zpět · back soon</span>
    </div>

    <p class="foot"><b>ZION</b> &nbsp;·&nbsp; One Love</p>
  </main>

<script type="module">
const canvas = document.getElementById('scene');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let THREE = null;
let Post = null;
try {
  THREE = await import('three');
  Post = {
    EffectComposer: (await import('/maint-assets/addons/postprocessing/EffectComposer.js')).EffectComposer,
    RenderPass: (await import('/maint-assets/addons/postprocessing/RenderPass.js')).RenderPass,
    UnrealBloomPass: (await import('/maint-assets/addons/postprocessing/UnrealBloomPass.js')).UnrealBloomPass,
    OutputPass: (await import('/maint-assets/addons/postprocessing/OutputPass.js')).OutputPass,
  };
} catch (e) {
  console.warn('three.js / postprocessing unavailable:', e);
}

function glowTexture(inner = 'rgba(255,214,107,1)', mid = 'rgba(251,191,36,0.35)') {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, inner);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(251,191,36,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function dotTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,240,200,1)');
  g.addColorStop(0.4, 'rgba(252,209,22,0.6)');
  g.addColorStop(1, 'rgba(252,209,22,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* Śrí jantra — PŘESNÁ konstrukce (všechny troj-průsečíky konkurenční).
   9 trojúhelníků jako [apex_y, base_y, halfWidth], jednotková kružnice r=1.
   Odvozeno z podmínek (i)–(iii) (Chiodo 2021) + Huetovy parametry;
   t9 řešená pro rovnostranný centrální trojúhelník. Residuum ~1e-15. */
const YANTRA = [
  [-0.074,      0.72996863, 0.46417150],  // t1 ↓
  [-0.63144373, 0.55404752, 0.66158250],  // t2 ↓
  [-1,          0.336,      0.94186199],  // t3 ↓ (vepsaný)
  [-0.48534540, 0.21601242, 0.30880740],  // t4 ↓
  [-0.204,      0.10372162, 0.22305970],  // t5 ↓
  [ 0.55404752,-0.074,      0.31109046],  // t6 ↑
  [ 1,         -0.204,      0.97897089],  // t7 ↑ (vepsaný)
  [ 0.72996863,-0.48534540, 0.73021391],  // t8 ↑
  [ 0.336,     -0.63144373, 0.42736264],  // t9 ↑
];

/* Pečeť vykreslená do textury — ostrá při každém přiblížení, hezky žádá bloom. */
function yantraTexture(size = 1024) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const S = size / 2.56;          // jantra r=1 → obsazuje ~78% plátna
  const X = (x) => size / 2 + x * S;
  const Y = (y) => size / 2 - y * S;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // jemná dvojitá stopa: vnější měkká + jádro
  for (const [wpx, col] of [[size * 0.011, 'rgba(255,190,60,0.30)'], [size * 0.0052, 'rgba(255,236,185,1)']]) {
    ctx.strokeStyle = col;
    ctx.lineWidth = wpx;
    ctx.beginPath();
    ctx.arc(size / 2, size / 2, S, 0, Math.PI * 2);
    for (const [a, b, w] of YANTRA) {
      ctx.moveTo(X(-w), Y(b)); ctx.lineTo(X(w), Y(b));
      ctx.lineTo(X(0), Y(a)); ctx.closePath();
    }
    ctx.stroke();
  }
  // bindu
  const bg = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size * 0.03);
  bg.addColorStop(0, 'rgba(255,250,230,1)');
  bg.addColorStop(0.45, 'rgba(255,220,120,0.9)');
  bg.addColorStop(1, 'rgba(255,200,80,0)');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(size / 2, size / 2, size * 0.03, 0, Math.PI * 2);
  ctx.fill();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/* Měkký světelný paprsek — gradient mizí ke špičce i do stran. */
function rayTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 256, 0, 0);
  g.addColorStop(0, 'rgba(255,220,130,0.55)');
  g.addColorStop(0.45, 'rgba(255,210,110,0.22)');
  g.addColorStop(1, 'rgba(255,200,100,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 256);
  // horizontální útlum okrajů
  const gx = ctx.createLinearGradient(0, 0, 64, 0);
  gx.addColorStop(0, 'rgba(0,0,0,1)');
  gx.addColorStop(0.5, 'rgba(0,0,0,0)');
  gx.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = gx;
  ctx.fillRect(0, 0, 64, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* Okvětní lístek — port z apps/shared/scenes/Hiran.tsx (XZ, kořen v 0, špička +X) */
function petalGeometry(length, width) {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(width, length * 0.28, width * 0.76, length * 0.78, 0, length);
  shape.bezierCurveTo(-width * 0.76, length * 0.78, -width, length * 0.28, 0, 0);
  const g = new THREE.ShapeGeometry(shape, 12);
  g.rotateX(-Math.PI / 2);
  g.rotateY(-Math.PI / 2);
  return g;
}

try {
  if (!THREE) throw new Error('three.js not loaded');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x040308);
  /* Reálné pozadí — ESO all-sky panorama (Serge Brunier, CC BY 4.0), stejná
     textura jako nirvana/public/textures. Přehodí se až po načtení. */
  new THREE.TextureLoader().load('/maint-assets/milkyway-eso-4k.jpg', (t) => {
    t.mapping = THREE.EquirectangularReflectionMapping;
    t.colorSpace = THREE.SRGBColorSpace;
    scene.background = t;
    scene.backgroundIntensity = 0.62;
    /* galaktické centrum (u≈0.5 textury) natočeno za orb — kamera míří -Z */
    scene.backgroundRotation.set(0.78, -1.52, 0);
  });
  scene.fog = new THREE.FogExp2(0x040308, 0.02);

  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
  const camBase = new THREE.Vector3(0, 2.1, 8.4);
  camera.position.copy(camBase);

  /* ── světla ── */
  scene.add(new THREE.AmbientLight(0x2e2517, 1.6));
  const orbLight = new THREE.PointLight(0xffc14d, 34, 0, 2);
  orbLight.position.set(0, 1.72, 0);
  scene.add(orbLight);
  const rim = new THREE.DirectionalLight(0x8fb8ff, 0.5);
  rim.position.set(-6, 5, -4);
  scene.add(rim);

  /* ── hvězdy — dvouvrstvé třpytivé pole (shader, per-hvězda fáze) ── */
  const starUniforms = { uTime: { value: 0 } };
  function starField(n, rMin, rMax, sizeMul) {
    const pos = new Float32Array(n * 3);
    const phase = new Float32Array(n);
    const size = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const r = rMin + Math.random() * (rMax - rMin);
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
      pos[i*3+1] = Math.abs(r * Math.cos(ph)) * 0.85 - 4;
      pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
      phase[i] = Math.random() * Math.PI * 2;
      size[i] = (0.5 + Math.random()) * sizeMul;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
    g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    const m = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: starUniforms,
      vertexShader: `
        attribute float aPhase; attribute float aSize;
        uniform float uTime;
        varying float vTw;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          float tw = 0.82 + 0.18 * sin(uTime * (0.5 + fract(aPhase) * 0.9) + aPhase * 7.0);
          vTw = tw;
          /* body za kamerou: záporné gl_PointSize = undefined behavior → flickr */
          float dist = -mv.z;
          gl_PointSize = dist > 0.5 ? aSize * (0.9 + 0.1 * tw) * 150.0 / dist : 0.0;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        varying float vTw;
        void main() {
          vec2 uv = gl_PointCoord - 0.5;
          float d = length(uv) * 2.0;
          float a = smoothstep(1.0, 0.3, d) * vTw * 0.85;
          vec3 col = mix(vec3(1.0, 0.93, 0.78), vec3(1.0, 0.82, 0.45), d);
          gl_FragColor = vec4(col, a);
        }`,
    });
    return new THREE.Points(g, m);
  }
  const stars = starField(700, 42, 80, 4.2);
  const starsFar = starField(500, 70, 110, 3.2);
  scene.add(stars, starsFar);

  /* ── mlhovina — jemný nádech nad reálným nebem (podbarví galaktický pás) ── */
  const nebulaTex = glowTexture('rgba(99,52,237,0.5)', 'rgba(99,52,237,0.12)');
  for (const [x, y, z, s, o] of [[-14, 7, -30, 34, 0.08], [12, 9, -34, 30, 0.06]]) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: nebulaTex, transparent: true, opacity: o, depthWrite: false, blending: THREE.AdditiveBlending }));
    sp.position.set(x, y, z); sp.scale.setScalar(s); scene.add(sp);
  }

  /* ── LOTOS — 12/10/8 lístků, perleť se zlatým okrajem (vznáší se ve vesmíru) ── */
  const lotus = new THREE.Group();
  lotus.position.y = -0.55;
  scene.add(lotus);

  const petalMat = new THREE.MeshStandardMaterial({
    color: 0xfff1d8, roughness: 0.5, metalness: 0.08,
    emissive: 0x241804, side: THREE.DoubleSide,
  });
  const petalEdge = new THREE.MeshStandardMaterial({
    color: 0xc99a43, roughness: 0.45, metalness: 0.35, side: THREE.DoubleSide,
  });

  function petalRing(count, radius, tilt, len, wid, mat, y = 0) {
    const geo = petalGeometry(len, wid);
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      const p = new THREE.Mesh(geo, mat);
      p.position.set(Math.cos(a) * radius, y, Math.sin(a) * radius);
      p.rotation.set(0, -a, tilt);
      lotus.add(p);
    }
  }
  petalRing(12, 1.12, 0.84, 2.05, 0.78, petalMat);
  petalRing(10, 0.86, 0.55, 1.55, 0.6, petalMat, 0.07);
  petalRing(8, 0.56, 0.32, 1.05, 0.44, petalEdge, 0.14);

  /* středový poupě */
  const bud = new THREE.Mesh(new THREE.SphereGeometry(0.34, 24, 18), petalMat);
  bud.position.y = 0.12;
  bud.scale.y = 1.25;
  lotus.add(bud);

  /* ── ORB — Hiranyagarbha ── */
  const orbGroup = new THREE.Group();
  const ORB_Y = 1.72;
  orbGroup.position.y = ORB_Y;
  scene.add(orbGroup);

  const ORB_R = 0.95;
  /* jádro — vertikální gradient světlý vršek → jantar → hluboké dno */
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(ORB_R * 0.86, 48, 32),
    new THREE.ShaderMaterial({
      uniforms: { uTop: { value: new THREE.Color(0xffedb0) }, uMid: { value: new THREE.Color(0xf0991a) }, uBot: { value: new THREE.Color(0x6e2f02) } },
      vertexShader: `
        varying float vY; varying vec3 vN;
        void main() {
          vY = normalize(position).y;
          vN = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uBot;
        varying float vY; varying vec3 vN;
        void main() {
          vec3 c = vY > 0.0 ? mix(uMid, uTop, pow(max(vY, 0.0), 0.8)) : mix(uMid, uBot, pow(max(-vY, 0.0), 0.7));
          float light = 0.85 + 0.15 * vN.z;
          gl_FragColor = vec4(c * light, 1.0);
        }`,
    })
  );
  orbGroup.add(core);

  /* fresnel plášť — zlatá skleněná blanka */
  const shell = new THREE.Mesh(
    new THREE.SphereGeometry(ORB_R, 48, 32),
    new THREE.ShaderMaterial({
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
      uniforms: { uColor: { value: new THREE.Color(0xffc95e) } },
      vertexShader: `
        varying vec3 vN; varying vec3 vV;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vN = normalize(normalMatrix * normal);
          vV = normalize(-mv.xyz);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        uniform vec3 uColor; varying vec3 vN; varying vec3 vV;
        void main() {
          float f = pow(max(0.0, 1.0 - abs(dot(vN, vV))), 2.6);
          gl_FragColor = vec4(uColor, f * 0.9);
        }`,
    })
  );
  orbGroup.add(shell);

  /* velká záře za orbem */
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture(), transparent: true, opacity: 0.34,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  halo.scale.setScalar(4.2);
  orbGroup.add(halo);

  /* Śrí jantra — přesná pečeť před diskem (fotosféra je neprůhledná) */
  const yantraGroup = new THREE.Group();
  const yantraMat = new THREE.MeshBasicMaterial({
    map: yantraTexture(), transparent: true, opacity: 0.95,
    depthWrite: false, side: THREE.DoubleSide,
  });
  const yantra = new THREE.Mesh(new THREE.PlaneGeometry(ORB_R * 1.42, ORB_R * 1.42), yantraMat);
  yantraGroup.add(yantra);
  orbGroup.add(yantraGroup);

  /* světelné paprsky — vějíř za orbem, měkké gradientní paprsky */
  const rayMat = new THREE.MeshBasicMaterial({
    map: rayTexture(), transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  });
  const rays = new THREE.Group();
  for (let i = 0; i < 12; i++) {
    const w = 0.10 + (i % 3) * 0.05;
    const ray = new THREE.Mesh(new THREE.PlaneGeometry(w, 2.3), rayMat);
    ray.position.y = ORB_R + 0.72;
    const arm = new THREE.Group();
    arm.add(ray);
    arm.rotation.z = (i / 12) * Math.PI * 2 + 0.13;
    rays.add(arm);
  }
  rays.rotation.x = -0.55;
  rays.position.z = -0.15;
  orbGroup.add(rays);

  /* prstence Ø 2.35–2.7 */
  const ringGroup = new THREE.Group();
  ringGroup.position.y = 1.72;
  scene.add(ringGroup);
  for (const [r, tilt] of [[1.42, 1.12], [1.62, 1.9]]) {
    const t = new THREE.Mesh(
      new THREE.TorusGeometry(r, 0.006, 8, 160),
      new THREE.MeshBasicMaterial({ color: 0xffc94d, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    t.rotation.x = tilt;
    ringGroup.add(t);
  }

  /* ── zlatý prach ── */
  const DUST_N = 260;
  const dustPos = new Float32Array(DUST_N * 3);
  const dustSpd = new Float32Array(DUST_N);
  for (let i = 0; i < DUST_N; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 0.6 + Math.random() * 2.4;
    dustPos[i*3] = Math.cos(a) * r;
    dustPos[i*3+1] = -0.6 + Math.random() * 4;
    dustPos[i*3+2] = Math.sin(a) * r;
    dustSpd[i] = 0.06 + Math.random() * 0.14;
  }
  const dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  scene.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({
    color: 0xffca5e, size: 0.05, map: dotTexture(), transparent: true,
    opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  })));

  /* ── animace ── */
  const pointer = { x: 0, y: 0 };
  addEventListener('pointermove', (e) => {
    pointer.x = (e.clientX / innerWidth - 0.5) * 2;
    pointer.y = (e.clientY / innerHeight - 0.5) * 2;
  }, { passive: true });

  /* ── post-processing: bloom + tonemap (MSAA render target, když je k dispozici) ── */
  let composer = null;
  if (Post) {
    try {
      const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, {
        type: THREE.HalfFloatType,
      });
      composer = new Post.EffectComposer(renderer, rt);
      composer.addPass(new Post.RenderPass(scene, camera));
      const bloom = new Post.UnrealBloomPass(
        new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.4, 0.85
      );
      composer.addPass(bloom);
      composer.addPass(new Post.OutputPass());
      composer.setPixelRatio(Math.min(devicePixelRatio, 2));
    } catch (e) {
      composer = null;
      console.warn('postprocessing disabled:', e);
    }
  }

  function render() {
    if (composer) composer.render();
    else renderer.render(scene, camera);
  }

  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    if (composer) composer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camBase.z = innerWidth < 640 ? 11.2 : 8.4;
    camBase.y = innerWidth < 640 ? 2.4 : 2.1;
    camera.updateProjectionMatrix();
  }
  let rsz;
  addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(resize, 140); });
  resize();

  const t0 = performance.now();
  const camTarget = new THREE.Vector3(0, 0.92, 0);

  function frame() {
    const t = (performance.now() - t0) / 1000;

    /* nádech orb — 5 s */
    const breath = 1 + Math.sin(t * (Math.PI * 2 / 5)) * 0.014;
    orbGroup.scale.setScalar(breath);
    orbGroup.position.y = ORB_Y + Math.sin(t * 0.55) * 0.05;
    orbLight.position.y = orbGroup.position.y;

    /* jantra čelí kameře, pomalu se točí kolem vlastní osy, jemně pulzuje */
    yantraGroup.position.set(0, 0, 0);
    yantraGroup.lookAt(camera.position);
    yantraGroup.translateZ(ORB_R * 1.05);
    yantra.rotation.z = t * 0.05;
    yantraMat.opacity = 0.92 + 0.08 * Math.sin(t * 1.1);

    /* hvězdy třpytí */
    starUniforms.uTime.value = t;
    stars.rotation.y = t * 0.004;
    starsFar.rotation.y = -t * 0.0025;

    /* paprsky a prstence */
    rays.rotation.z = -t * 0.045;
    ringGroup.rotation.y = t * 0.12;
    ringGroup.children[1].rotation.x = 1.9 + Math.sin(t * 0.3) * 0.1;

    /* lotos jemně dýchá s orbem */
    lotus.scale.setScalar(1 + Math.sin(t * (Math.PI * 2 / 5) - 0.6) * 0.008);

    /* prach stoupá */
    const pos = dustGeo.attributes.position;
    for (let i = 0; i < DUST_N; i++) {
      let y = pos.getY(i) + dustSpd[i] * 0.016;
      if (y > 3.6) {
        y = -0.6;
        const a = Math.random() * Math.PI * 2, r = 0.6 + Math.random() * 2.4;
        pos.setX(i, Math.cos(a) * r); pos.setZ(i, Math.sin(a) * r);
      }
      pos.setY(i, y);
    }
    pos.needsUpdate = true;

    /* kamera — parallax + plavání */
    camera.position.x = camBase.x + pointer.x * 0.55 + Math.sin(t * 0.12) * 0.3;
    camera.position.y = camBase.y - pointer.y * 0.3 + Math.sin(t * 0.17) * 0.12;
    camera.position.z = camBase.z + Math.sin(t * 0.09) * 0.2;
    camera.lookAt(camTarget);

    render();
    if (!reduced) requestAnimationFrame(frame);
  }
  frame();
} catch (err) {
  document.getElementById('fallback').style.display = 'flex';
  canvas.style.display = 'none';
  console.warn('3D scene unavailable:', err);
}
</script>
</body>
</html>
