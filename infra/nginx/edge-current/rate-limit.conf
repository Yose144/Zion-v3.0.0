# Rate limiting zones for public JSON API endpoints (explorer, pool, RPC-adjacent).
# See V31/AGENTS.md 2026-08-14 entry for rationale — public /api/* routes had
# no request throttling at all.
#
# zion_api: general API traffic, keyed by client IP, 10 MB shared state.
limit_req_zone $binary_remote_addr zone=zion_api:10m rate=20r/s;
# zion_api_burst: stricter zone for expensive/search-like endpoints.
limit_req_zone $binary_remote_addr zone=zion_api_burst:10m rate=5r/s;

limit_req_status 429;

# 2026-09-28: /api/ai-chat is answered by the L3 LLM on the operator PC GPU (reverse tunnel).
# Per-IP and global caps so public traffic cannot saturate that GPU.
limit_req_zone $binary_remote_addr zone=zion_ai_chat:10m rate=6r/m;
limit_req_zone $server_name zone=zion_ai_chat_global:1m rate=20r/m;
