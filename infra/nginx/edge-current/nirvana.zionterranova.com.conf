# ZION Nirvana — Kingdom of Hearts 3D portal (Next.js standalone, port 3010)
# Service: zion-nirvana.service, WorkingDirectory /opt/zion/APP&WEB/nirvana
#
# Realtime (multiplayer + chat) běží jako samostatný proces — Next ve standalone
# režimu neumí WebSocket. `zion-nirvana-net.service` na 127.0.0.1:3011, cesta /net.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_conn_zone $binary_remote_addr zone=nirvana_net:10m;

server {
    server_name nirvana.zionterranova.com;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # WebSocket hry + chat. Dlouhý read timeout: spojení drží heartbeat služby
    # (20 s), ale nesmí ho shodit nečinnost.
    location /net {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        limit_conn nirvana_net 8;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nirvana.zionterranova.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nirvana.zionterranova.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = nirvana.zionterranova.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name nirvana.zionterranova.com;
    return 404; # managed by Certbot


}
