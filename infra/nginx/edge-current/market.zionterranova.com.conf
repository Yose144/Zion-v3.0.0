server {
    server_name market.zionterranova.com www.market.zionterranova.com;

    # Kanonický host je apex — www přesměrujeme, ať není duplicitní obsah
    if ($host = www.market.zionterranova.com) {
        return 301 https://market.zionterranova.com$request_uri;
    }

    # Digitální stahování (ZIP Království srdce) leží mimo strom aplikace —
    # /opt/zion/data/downloads — aby ho rsync --delete při deployi MarketPlace
    # nesmazal. Soubor už NENÍ veřejný statický alias.
    # Veřejné /shop/downloads/ jde do aplikace, která ověří podepsaný odkaz
    # (zaplacená objednávka nebo krátkodobý archive grant) a soubor vydá
    # přes interní X-Accel-Redirect. Bez podpisu je 401.
    # Zdroj ZIP: scripts/ops/build-kralovstvi-bundle.py --upload
    location /internal-downloads/ {
        internal;
        alias /opt/zion/data/downloads/;
        autoindex off;
        add_header Cache-Control "private, no-store";
        add_header X-Content-Type-Options "nosniff";
    }

    location /shop/downloads/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }


    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/market.zionterranova.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/market.zionterranova.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    listen 80;
    listen [::]:80;
    server_name market.zionterranova.com www.market.zionterranova.com;
    # Kanonický host je apex — www i http jdou na https://market.zionterranova.com
    return 301 https://market.zionterranova.com$request_uri;
}