server {
    server_name market.zionterranova.com;

    # Digitální stahování (ZIP s ediční sadou Království srdce) leží MIMO strom
    # aplikace — /opt/zion/data/downloads — aby ho `rsync --delete` při deployi
    # MarketPlace nemohl smazat a nerozbil odkazy v už odeslaných e-mailech.
    # Zdroj: scripts/ops/build-kralovstvi-bundle.py --upload
    location /shop/downloads/ {
        alias /opt/zion/data/downloads/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/market.zionterranova.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/market.zionterranova.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = market.zionterranova.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name market.zionterranova.com;
    return 404; # managed by Certbot


}