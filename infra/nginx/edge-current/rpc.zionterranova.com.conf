# ZION RPC — HTTPS JSON-RPC endpoint
# Proxies HTTP POST requests to V31 node RPC (127.0.0.1:9445)
# The V31 node supports both raw TCP and HTTP JSON-RPC.

server {
    listen 80;
    listen [::]:80;
    server_name rpc.zionterranova.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rpc.zionterranova.com;

    ssl_certificate /etc/letsencrypt/live/rpc.zionterranova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc.zionterranova.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # JSON-RPC endpoint (all paths)
    location / {
        # CORS headers for browser wallet SDK
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age 86400;
            return 204;
        }

        # Hide CORS headers from the upstream node so nginx sets exactly one set
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        proxy_pass http://127.0.0.1:9445;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

        # Quantus QTC mainnet node — Safe RPC methods only (see --rpc-methods)
        location = /qtc {
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:9944/;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
}

