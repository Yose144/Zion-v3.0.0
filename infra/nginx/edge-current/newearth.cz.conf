# newearth.cz / www.newearth.cz — všechno rovnou na https://zionterranova.com/
# ACME challenge zůstává, ať certbot může obnovit certifikát.

server {
    listen 80;
    listen [::]:80;
    server_name newearth.cz www.newearth.cz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://zionterranova.com/;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name newearth.cz www.newearth.cz;

    ssl_certificate     /etc/letsencrypt/live/newearth.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newearth.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://zionterranova.com/;
    }
}
