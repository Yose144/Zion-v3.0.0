# dex.zionterranova.com — ZionDex public read API
#
# STOPGAP on EDGE (2026-11-05): DNS A dex.zionterranova.com still points to
# 62.171.141.136 (EDGE). The canonical vhost lives on EDGE2
# (infra/nginx/edge2/dex.zionterranova.com.conf -> warpd 127.0.0.1:8454)
# but is port-80-only and certless until DNS flips to 207.180.217.100.
# This file terminates TLS on EDGE and proxies to the EDGE2 :80 vhost —
# the narrow public surface (/prices/, /v1/swap/pools, /health, else 404)
# is enforced there, not duplicated here. After the DNS flip this file
# goes dormant.
#
# Upstream chain: client -> EDGE :443 -> http://207.180.217.100:80
#                 -> EDGE2 dex vhost -> 127.0.0.1:8454 (warpd swap/DEX router)

server {
    listen 80;
    listen [::]:80;
    server_name dex.zionterranova.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://207.180.217.100;
        proxy_http_version 1.1;
        proxy_set_header Host dex.zionterranova.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dex.zionterranova.com;

    ssl_certificate     /etc/letsencrypt/live/zion-ops-20261105/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zion-ops-20261105/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://207.180.217.100;
        proxy_http_version 1.1;
        proxy_set_header Host dex.zionterranova.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_buffering off;
    }
}
