# grafana.zionterranova.com — ops Grafana (:3001 localhost)
# TLS added 2026-11-05 (cert zion-ops-20261105, SAN: api+dex+grafana).
# Previously :80-only -> HTTPS served the default auth.* cert (name mismatch).

server {
    listen 80;
    listen [::]:80;
    server_name grafana.zionterranova.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grafana.zionterranova.com;

    ssl_certificate     /etc/letsencrypt/live/zion-ops-20261105/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zion-ops-20261105/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
