# oasis.zionterranova.com — OASIS game portal (EDGE2)
# Static export /var/www/oasis (synced from Edge).
# Backends LOCAL on edge2: zion-oasis :8094, free-world :8095, ZIS :8096
# (on Edge these were SSH-tunnel legs + an HTTPS hairpin back to auth.).
# /downloads/ TRANSITIONAL proxy → Edge until files move (F6).

server {
    server_name oasis.zionterranova.com;

    root /var/www/oasis;
    index index.html;

    # OASIS backend health + REST API proxy (zion-oasis on :8094)
    location = /health {
        proxy_pass http://127.0.0.1:8094/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ZIS proxy — same-origin so the SSO cookie works (LOCAL :8096)
    location /api/auth/ {
        proxy_pass http://127.0.0.1:8096/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/session/ {
        proxy_pass http://127.0.0.1:8096/api/session/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/keys/ {
        proxy_pass http://127.0.0.1:8096/api/keys/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # L5 Free World registry (zion-v31-free-world on :8095)
    # Prefix rewrite: /api/free-world/<path> → :8095/api/v1/<path>
    location /api/free-world/ {
        proxy_pass http://127.0.0.1:8095/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public desktop miner downloads — local mirror /var/www/downloads
    location /downloads/ {
        alias /var/www/downloads/;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
    }

    # Next.js static export — try .html files, then directories
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/oasis.zionterranova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oasis.zionterranova.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = oasis.zionterranova.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name oasis.zionterranova.com;
    return 404;
}
