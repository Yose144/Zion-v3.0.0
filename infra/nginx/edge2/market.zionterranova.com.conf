server {
    server_name market.zionterranova.com www.market.zionterranova.com;

    # Kanonický host je apex — www přesměrujeme, ať není duplicitní obsah
    if ($host = www.market.zionterranova.com) {
        return 301 https://market.zionterranova.com$request_uri;
    }

    # Hiran API gateway (B2B-3) — OpenAI-compatible /v1/*
    # Interim public path while api.zionterranova.com DNS stays on EDGE/ZIS.
    location /v1/ {
        proxy_pass http://127.0.0.1:8007;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Digitální stahování (ZIP Království srdce) leží mimo strom aplikace —
    # /opt/zion/data/downloads — aby ho rsync --delete při deployi MarketPlace
    # nesmazal. Soubor už NENÍ veřejný statický alias.
    # Veřejné /shop/downloads/ jde do aplikace, která ověří podepsaný odkaz
    # (zaplacená objednávka nebo krátkodobý archive grant) a soubor vydá
    # přes interní X-Accel-Redirect. Bez podpisu je 401.
    # Zdroj ZIP: scripts/ops/build-kralovstvi-bundle.py --upload
    location /internal-downloads/ {
        internal;
        alias /opt/zion/data/downloads/;
        autoindex off;
        add_header Cache-Control "private, no-store";
        add_header X-Content-Type-Options "nosniff";
    }

    location /shop/downloads/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ZION asset cache — obrázky/fonty se nemění, ale Next posílá no-cache.
    # 7 dní (ne immutable): sezónní edice přepisují stejná jména souborů.
    # (Synchronizováno ze živého confu EDGE2 — tam byl od 2026-11-04.)
    location ~* \.(webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|otf|mp4|webm)$ {
        proxy_pass http://127.0.0.1:3100;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/market.zionterranova.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/market.zionterranova.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    listen 80;
    listen [::]:80;
    server_name market.zionterranova.com www.market.zionterranova.com;
    # Kanonický host je apex — www i http jdou na https://market.zionterranova.com
    return 301 https://market.zionterranova.com$request_uri;
}