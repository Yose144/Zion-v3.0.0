# catch-all pro subdomény bez dedikovaného vhostu (explorer., mining., api., …)
# Po flipu wildcard DNS → edge2 musí neznámé hosty skončit na kanonickém webu,
# ne na nginx default page.

# HTTP catch-all → app
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME http-01 pro budoucí certbot renew musí projít
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://app.zionterranova.com$request_uri;
    }
}

# HTTPS catch-all — použije apex cert (SNI nesedí, ale redirect je lepší než
# cert error pro staré subdomény; explorer/mining dostanou vlastní cert později)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/zionterranova.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zionterranova.com-0001/privkey.pem;

    location / {
        return 301 https://app.zionterranova.com$request_uri;
    }
}
