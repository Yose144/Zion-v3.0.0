# app.zionterranova.com — main Next.js site (EDGE2 local :3000)
# Adapted from edge zion-edge-download.conf — backends are LOCAL on edge2
# (no SSH tunnel in the request path). Rate zones: conf.d/rate-limit.conf.
#
# TRANSITIONAL: /zion-miner/ + /rig-output/ still proxy to Edge (miner
# binaries + rig log output live there until F6).

server {
    server_name app.zionterranova.com; # managed by Certbot

    # Miner binaries — local mirror /var/www/zion-miner (synced from Edge)
    location /zion-miner/ {
        alias /var/www/zion-miner/;
        autoindex on;
        keepalive_timeout 300s;
        sendfile on;
        tcp_nopush on;
    }
    # Rig logs — TRANSITIONAL proxy to Edge (live :9999 python service there)
    location /rig-output/ {
        proxy_pass http://62.171.141.136/rig-output/;
        proxy_set_header Host 62.171.141.136;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Rate limiting for public JSON API (explorer/pool endpoints proxy to
    # node RPC / pool HTTP API under the hood — protect against scraping
    # storms and basic DoS). burst=10 allows short legitimate bursts
    # (e.g. a page loading several /api/* calls at once) before throttling.
    # 2026-10-05 internal-audit hotfix: unauthenticated config write.
    location = /api/v2.9/revenue/config {
        limit_except GET {
            deny all;
        }
        limit_req zone=zion_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 2026-10-05 internal-audit hotfix: read-only / user-scoped POSTs that stay public.
    location ~ ^/api/(multichain|swap)/(swap/quote(/multi)?|swap/amm/pair|quote(/multi)?|amm/pair|balance|wallet/(address|derive|balance|withdraw)|nodes/(register|heartbeat)|btc/(quote|offer|list)|htlc/(lock|claim|refund|pending))$ {
        limit_req zone=zion_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 2026-10-05 internal-audit hotfix: operator-level multichain/bridge/WARP
    # mutations are GET-only at the edge until per-route admin authz lands.
    location ~ ^/api/(multichain|swap|bridge|warp)/ {
        limit_except GET {
            deny all;
        }
        limit_req zone=zion_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
        limit_req zone=zion_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $host;
    }

    # L3 chat -> local ai-native RAG (:8001): strict per-IP + global limits, long read timeout.
    location = /api/ai-chat {
        limit_req zone=zion_ai_chat burst=3 nodelay;
        limit_req zone=zion_ai_chat_global burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 150s;
    }

    location = /api/blockchain/search {
        limit_req zone=zion_api_burst burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # G8 30-day continuous run status page (public, proxied via Next app)
    location = /api/g8 {
        limit_req zone=zion_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /g8 {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.zionterranova.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.zionterranova.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = app.zionterranova.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name app.zionterranova.com;
    return 404; # managed by Certbot
}
