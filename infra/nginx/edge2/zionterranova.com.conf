# zionterranova.com — apex intro hub (EDGE2)
# Static export in /var/www/zion-maintenance (synced from Edge).
# API proxies: all backends are LOCAL on edge2 (was SSH tunnel on Edge).
# /zion-miner/ TRANSITIONAL proxy → Edge until binaries move (F6).

server {
    listen 80;
    listen [::]:80;
    server_name zionterranova.com www.zionterranova.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zionterranova.com www.zionterranova.com;

    ssl_certificate /etc/letsencrypt/live/zionterranova.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zionterranova.com-0001/privkey.pem;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31518000; includeSubDomains" always;

    root /var/www/zion-maintenance;
    index index.html;

    # Intro page — serve index.html for all routes (Next.js static export)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Miner binary downloads — local mirror /var/www/zion-miner
    location /zion-miner/ {
        alias /var/www/zion-miner/;
        autoindex on;
        keepalive_timeout 300s;
    }

    # API proxy → node RPC (9445) — LOCAL on edge2
    location /api/rpc {
        # Operator-only
        allow 127.0.0.1;
        allow 109.81.24.189;
        allow 109.81.31.210;
        allow 109.81.27.87;
        allow 109.81.89.176;
        allow 109.81.83.205;
        allow 109.81.81.86;
        allow 109.81.83.81;
        allow 46.135.81.225;
        allow 2a02:c207:2368:4458::/64;
        allow 2a00:11b1:10e2:af49:b90b:20ed:4eee:b48b/128;
        allow 185.63.97.49;
        allow 46.135.7.68; # operator 2026-10-01
        allow 46.135.0.0/16; # operator CGNAT range 2026-10-01
        allow 109.81.0.0/16; # operator CGNAT range 2026-10-01
        allow 109.164.0.0/16; # operator CGNAT range 2026-10-01
        allow 185.63.0.0/16; # operator CGNAT range 2026-10-01
        deny all;

        proxy_pass http://127.0.0.1:9445;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # DAO API proxy — LOCAL (:8456)
    location /api/dao {
        # Operator-only
        allow 127.0.0.1;
        allow 109.81.24.189;
        allow 109.81.31.210;
        allow 109.81.27.87;
        allow 109.81.89.176;
        allow 109.81.83.205;
        allow 109.81.81.86;
        allow 109.81.83.81;
        allow 46.135.81.225;
        allow 2a02:c207:2368:4458::/64;
        allow 2a00:11b1:10e2:af49:b90b:20ed:4eee:b48b/128;
        allow 185.63.97.49;
        allow 46.135.7.68; # operator 2026-10-01
        allow 46.135.0.0/16; # operator CGNAT range 2026-10-01
        allow 109.81.0.0/16; # operator CGNAT range 2026-10-01
        allow 109.164.0.0/16; # operator CGNAT range 2026-10-01
        allow 185.63.0.0/16; # operator CGNAT range 2026-10-01
        deny all;

        proxy_pass http://127.0.0.1:8456;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # L5 Free World API proxy — LOCAL (:8095), operator-only
    location /api/free-world/ {
        allow 127.0.0.1;
        allow 109.81.24.189;
        allow 109.81.31.210;
        allow 109.81.27.87;
        allow 109.81.89.176;
        allow 109.81.83.205;
        allow 109.81.81.86;
        allow 109.81.83.81;
        allow 46.135.81.225;
        allow 2a02:c207:2368:4458::/64;
        allow 2a00:11b1:10e2:af49:b90b:20ed:4eee:b48b/128;
        allow 185.63.97.49;
        allow 46.135.7.68; # operator 2026-10-01
        allow 46.135.0.0/16; # operator CGNAT range 2026-10-01
        allow 109.81.0.0/16; # operator CGNAT range 2026-10-01
        allow 109.164.0.0/16; # operator CGNAT range 2026-10-01
        allow 185.63.0.0/16; # operator CGNAT range 2026-10-01
        deny all;
        proxy_pass http://127.0.0.1:8095/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # L6 Issobella API proxy — LOCAL (:8097), operator-only
    location /api/issobella/ {
        allow 127.0.0.1;
        allow 109.81.24.189;
