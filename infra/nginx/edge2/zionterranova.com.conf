    # WARP / multi-chain API proxy — LOCAL warpd :8453
    location = /api/warp {
        return 301 /api/warp/;
    }

    location /api/warp/ {
        proxy_pass http://127.0.0.1:8453/;
        proxy_set_header Host $host;
