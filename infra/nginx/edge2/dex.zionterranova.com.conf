# ZionDex public read API — dex.zionterranova.com
# Server: 207.180.217.100 — EDGE2
#
# Upstream: `warpd` (zion-v31-multichain.service) DEX API on 127.0.0.1:8454
#   = config.listen_port (8453) + 1 — see V31/L2/multichain/src/bin/warpd.rs.
#   Port 8453 is the WARP endpoint (never proxied here); 8454 is the swap/DEX
#   router. Both are served by the SAME axum router, so this vhost is the only
#   thing separating public read traffic from authenticated/admin routes.
#
# Deliberately NARROW surface:
#   * `/prices/:token/history` — the price series the market page chart reads
#     (apps/website-v2.9/src/components/dex/PriceChart.tsx). Derived from real
#     settled `dex_orders` + live AMM reserves; returns `prices: []` when there
#     is nothing to show — never placeholder data.
#   * `/v1/swap/pools` — read-only pool list (reserves / fee / amm pair).
#   * `/health` — liveness for monitoring probes.
#   Everything else returns 404. Swap execution, liquidity and order routes are
#   reached through the website's own server-side proxy
#   (app.zionterranova.com/api/swap/*), so they never need to be public.
#
# Deploy: certbot --nginx -d dex.zionterranova.com

server {
    server_name dex.zionterranova.com;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CORS is emitted by the upstream (ZION_MULTICHAIN_CORS_ORIGINS in
    # server.rs) — do not add a second header set here or browsers reject the
    # response for having two Access-Control-Allow-Origin values.

    # Price series. Cheap (one indexed scan + in-memory pool list) but still
    # rate limited: it is the only data-heavy public route.
    location /prices/ {
        limit_req zone=zion_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8454;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        # Price history is point-in-time derived data — keep it uncached at the
        # edge so a pool reserve change is visible immediately.
        proxy_buffering off;
    }

    # Read-only pool list.
    location = /v1/swap/pools {
        limit_req zone=zion_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8454;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8454;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    # Default: nothing else is public. This is what keeps /v1/admin/*,
    # /v1/multichain/swaps/htlc/*, /v1/swap/order/* and friends off the
    # internet even though the upstream serves them from the same port.
    location / {
        return 404;
    }

    listen 443 ssl http2; # managed by Certbot
    listen [::]:443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dex.zionterranova.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dex.zionterranova.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = dex.zionterranova.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name dex.zionterranova.com;
    return 404; # managed by Certbot
}
