# 3.3.zionterranova.com — náhled nového webu 3.3 (apps/onboard na EDGE2 :3030)
# DNS: A 3.3 -> 207.180.217.100, AAAA 3.3 -> 2a02:c207:2368:4458::1
# Cert: certbot certonly --webroot -w /var/www/letsencrypt -d 3.3.zionterranova.com
# Není to produkční apex — drží se mimo index (X-Robots-Tag: noindex).

server {
    listen 80;
    listen [::]:80;
    server_name 3.3.zionterranova.com;

    # ACME http-01
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 3.3.zionterranova.com;

    ssl_certificate /etc/letsencrypt/live/3.3.zionterranova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3.3.zionterranova.com/privkey.pem;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31518000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Preview is noindex — explicit robots.txt (the app route is not built
    # in the current release and would 404).
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ── Onboard (Next.js 16 standalone) ──────────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Miner binary downloads — stejný mirror jako apex
    location /zion-miner/ {
        alias /var/www/zion-miner/;
        autoindex on;
        keepalive_timeout 300s;
    }

    # ── API proxies (stejné jako apex, bez ops surface) ──────────────
    location /api/rpc {
        allow 127.0.0.1;
        allow 109.81.24.189;
        allow 109.81.31.210;
        allow 109.81.27.87;
