# updates.zionterranova.com — ZION Update / License Server (VIP desktop autoupdate)
# Backend: zion-update-server on 127.0.0.1:3001 (EDGE2)
# Staged 2026-11-01 — DNS flip + certbot still required (👤).

server {
    listen 80;
    listen [::]:80;
    server_name updates.zionterranova.com;

    # certbot HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name updates.zionterranova.com;

    ssl_certificate     /etc/letsencrypt/live/updates.zionterranova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updates.zionterranova.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Release binaries can be large (DMG/AppImage/EXE).
    client_max_body_size 512m;

    # Health
    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_set_header Host $host;
    }

    # License validation + release feed + binary download.
    # The server enforces X-License-Key / JWT tokens itself.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
