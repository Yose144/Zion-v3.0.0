# ZION Atomic Swap Daemon — testnet configuration
# Copy to /etc/zion/atomic-swap.toml for production.
# Set ZION_SWAP_ESCROW_KEY=<64-char hex> in environment (never in TOML for prod).

[swap]
name            = "ZION Atomic Swap Service (testnet)"
network         = "testnet"
min_lock_atomic = 1_000_000        # 1 ZION minimum
max_lock_atomic = 10_000_000_000   # 10 000 ZION maximum
release_fee_atomic = 2_000         # 0.000002 ZION (covers L1 TX fee)

[l1]
rpc_url         = "http://77.42.31.72:8444"
# rpc_token     = ""               # Override with ZION_RPC_TOKEN env var
# escrow_key_hex = ""              # Set via ZION_SWAP_ESCROW_KEY env var (required!)
scan_batch_size = 10               # Blocks per watcher poll
poll_interval_secs = 5             # Watcher poll interval

[database]
path = "/data/atomic-swap.db"      # Use ./atomic-swap.db for local dev

[api]
bind         = "0.0.0.0:8888"
# bearer_token = ""                # Set to protect /swap/claim and /swap/refund

[refund]
auto_refund        = true
check_interval_secs = 30
grace_period_secs   = 120          # 2-min grace after timelock before auto-refund
