[package]
name = "zion-auxpow"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Yose144"]
description = "AuxPow merge-mining module — stratum proxy + external hashers for ZION pool"
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
num-bigint = "0.4"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1.0"

[features]
default = []
# Compile C native hashers (blake3, kheavyhash, autolykos, kawpow, etchash)
native-hashers = []
# OpenCL GPU acceleration (requires OpenCL runtime)
gpu-opencl = []
