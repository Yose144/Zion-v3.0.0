[package]
name = "zion-auxpow"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Yose144"]
description = "AuxPow merge-mining module — stratum proxy + external hashers for ZION pool"
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake2 = "0.10"
blake2b_simd = "1"
blake3 = "1"
hex = "0.4"
base64 = "0.22"
bincode = "1"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
# TLS support for EPIC stratum (de.epicmine.io:3334 requires TLS)
# Use "ring" crypto provider (NOT aws-lc-rs) — aws-lc-sys assembly uses AVX2/BMI2
# instructions that crash on CPUs without AVX2 (e.g. Intel Pentium G4560 on SMOS rig).
# default-features = false disables the aws-lc-rs default provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rustls-pki-types = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
num-bigint = "0.5"
# Ethash reference implementation (cache + hashimoto)
ethash = "0.4"
ethereum-types = "0.8"
ocl = { version = "0.19", optional = true }
# NVIDIA CUDA GPU acceleration (requires CUDA toolkit)
cudarc = { version = "0.12", optional = true, features = ["cuda-12040", "driver", "nvrtc"] }
# Apple Metal GPU acceleration (macOS only)
metal = { version = "0.33", optional = true }
objc = { version = "0.2", optional = true }
block = { version = "0.1", optional = true }
# Real VerusHash v2.2 C++ (Haraka+CLHash from VerusCoin upstream)
zion-native-ffi = { path = "../V3/L1/native-ffi", optional = true }

[dev-dependencies]
tempfile = "3"

# Debug/test binaries that require GPU features — excluded from default workspace build
[[bin]]
name = "rtm_gpu_test"
path = "src/bin/rtm_gpu_test.rs"
required-features = ["gpu-opencl"]

[[bin]]
name = "rtm_hash_cmp"
path = "src/bin/rtm_hash_cmp.rs"
required-features = ["gpu-opencl"]

[[bin]]
name = "simd_cmp"
path = "src/bin/simd_cmp.rs"
required-features = ["gpu-opencl"]

[build-dependencies]
cc = "1.0"

[features]
default = []
# Compile C native hashers (blake3, kheavyhash, autolykos, kawpow, etchash)
native-hashers = []
# Real VerusHash v2.2 via zion-native-ffi C++ (Haraka+CLHash pipeline)
native-verushash = ["dep:zion-native-ffi", "zion-native-ffi/native-verushash"]
# Real RandomX via zion-native-ffi C++ (tevador/RandomX for XMR/ZEPH)
native-randomx = ["dep:zion-native-ffi", "zion-native-ffi/native-randomx"]
# Real GhostRider via zion-native-ffi C++ (sphlib + CryptoNight for RTM)
native-ghostrider = ["dep:zion-native-ffi", "zion-native-ffi/native-ghostrider"]
# OpenCL GPU acceleration (AMD + NVIDIA via OpenCL runtime)
gpu-opencl = ["dep:ocl"]
# NVIDIA CUDA GPU acceleration (native CUDA, best perf on RTX/Ampere)
gpu-cuda = ["dep:cudarc"]
# Apple Metal GPU acceleration (macOS Apple Silicon)
gpu-metal = ["dep:metal", "dep:objc", "dep:block"]
# All GPU backends
gpu-all = ["gpu-opencl", "gpu-cuda", "gpu-metal"]
