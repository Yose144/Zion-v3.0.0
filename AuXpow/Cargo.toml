[package]
name = "zion-auxpow"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Yose144"]
description = "AuxPow merge-mining module — stratum proxy + external hashers for ZION pool"
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake2 = "0.10"
blake2b_simd = "1"
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
num-bigint = "0.4"
ocl = { version = "0.19", optional = true }
# NVIDIA CUDA GPU acceleration (requires CUDA toolkit)
cudarc = { version = "0.12", optional = true, features = ["cuda-12040", "driver", "nvrtc"] }
# Apple Metal GPU acceleration (macOS only)
metal = { version = "0.33", optional = true }
objc = { version = "0.2", optional = true }
block = { version = "0.1", optional = true }
# Real VerusHash v2.2 C++ (Haraka+CLHash from VerusCoin upstream)
zion-native-ffi = { path = "../V3/L1/native-ffi", optional = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1.0"

[features]
default = []
# Compile C native hashers (blake3, kheavyhash, autolykos, kawpow, etchash)
native-hashers = []
# Real VerusHash v2.2 via zion-native-ffi C++ (Haraka+CLHash pipeline)
native-verushash = ["dep:zion-native-ffi", "zion-native-ffi/native-verushash"]
# OpenCL GPU acceleration (AMD + NVIDIA via OpenCL runtime)
gpu-opencl = ["dep:ocl"]
# NVIDIA CUDA GPU acceleration (native CUDA, best perf on RTX/Ampere)
gpu-cuda = ["dep:cudarc"]
# Apple Metal GPU acceleration (macOS Apple Silicon)
gpu-metal = ["dep:metal", "dep:objc", "dep:block"]
# All GPU backends
gpu-all = ["gpu-opencl", "gpu-cuda", "gpu-metal"]
