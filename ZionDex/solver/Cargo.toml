[package]
name = "ziondex-solver"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZionDex Solver Daemon — off-chain service that listens for SwapIntents, computes optimal paths, submits bids to the auction, and executes winning swaps"

# Keep this crate independent (standalone service, separate from the Router)
[workspace]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework (solver's own REST API on port 8455)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (talks to the Router REST API)
reqwest = { version = "0.12", features = ["json"] }

# EVM (solver key handling, U256 amounts)
ethers = { version = "2", features = ["rustls"] }

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "ziondex_solver"
path = "src/lib.rs"

[[bin]]
name = "ziondex-solver"
path = "src/main.rs"
