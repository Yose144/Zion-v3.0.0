[package]
name = "ziondex-router"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZionDex cross-chain DEX router — path finding, quoting, and execution"

# Keep this crate independent from the V3 workspace
[workspace]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"

# Web framework
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Utils
uuid = { version = "1", features = ["v4"] }
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"

# EVM (ethers-rs for quote/execution)
ethers = { version = "2", features = ["rustls", "ws"] }

# Config
toml = "0.8"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[[bin]]
name = "ziondex-router"
path = "src/main.rs"
