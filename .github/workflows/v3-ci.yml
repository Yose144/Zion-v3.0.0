name: V3 CI

on:
  push:
    branches: [main, develop]
    paths:
      - "V3/**"
      - ".github/workflows/v3-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "V3/**"
      - ".github/workflows/v3-ci.yml"

defaults:
  run:
    working-directory: V3

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # ───────────────────────────────────────────────
  # Test Matrix (Rust stable + beta)
  # ───────────────────────────────────────────────
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-22.04  # More stable for billing-constrained repos
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: V3
          key: ${{ matrix.rust }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace -- --test-threads=1

  # ───────────────────────────────────────────────
  # Clippy + Format (on stable only)
  # ───────────────────────────────────────────────
  lint:
    name: Lint (clippy + fmt)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: V3

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential cmake pkg-config libssl-dev

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all --check

  # ───────────────────────────────────────────────
  # Security (cargo-audit + Trivy)
  # ───────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: V3

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential cmake pkg-config libssl-dev

      - name: Run cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Scan Dockerfiles with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'V3/docker'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # ───────────────────────────────────────────────
  # Docker Build Test
  # ───────────────────────────────────────────────
  docker:
    name: Docker Build Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Node image (cache only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./V3/docker/Dockerfile.node
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PROFILE=release

      - name: Build Pool image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./V3/docker/Dockerfile.pool
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
