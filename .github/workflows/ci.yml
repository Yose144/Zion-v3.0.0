# Legacy root L1-L6 workspace CI.
# AGENTS.md classifies the root tree as migration/reference only — active
# mainnet development happens in V3/. To avoid this CI being a tax on
# unrelated PRs, only run when the legacy root tree (or this workflow file)
# is actually touched.
name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "L1/**"
      - "L2/**"
      - "L3/**"
      - "L4/**"
      - "L5/**"
      - "L6/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "L1/**"
      - "L2/**"
      - "L3/**"
      - "L4/**"
      - "L5/**"
      - "L6/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────
  # L2-L4: Pure Rust crates — compile & test cleanly
  # ─────────────────────────────────────────────────
  test-l2-l4:
    name: Test L2-L4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check L2-L4
        run: cargo check -p zion-bridge -p zion-dao -p zion-warp -p zion-ncl -p zion-ai-native -p zion-oasis
      - name: Test L2-L4
        run: cargo test -p zion-bridge -p zion-dao -p zion-warp -p zion-ncl -p zion-ai-native -p zion-oasis

  # ─────────────────────────────────────────────────
  # L1: Needs native C sources for verushash-native
  # ─────────────────────────────────────────────────
  test-l1:
    name: Test L1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install C/C++ build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libssl-dev

      - name: Download VerusHash C sources
        run: |
          cd L1/native-libs/verushash-native
          bash download_sources.sh

      - name: Check L1
        run: cargo check -p zion-core -p zion-pool -p zion-miner -p zion-cosmic-harmony-v3 -p verushash-native
      - name: Test L1
        run: cargo test -p zion-core -p zion-pool -p zion-miner -p zion-cosmic-harmony-v3 -p verushash-native

  # ─────────────────────────────────────────────────
  # Formatting
  # ─────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ─────────────────────────────────────────────────
  # Clippy (L2-L4 — L1 needs native deps)
  # ─────────────────────────────────────────────────
  clippy:
    name: Clippy L2-L4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p zion-bridge -p zion-dao -p zion-warp -p zion-ncl -p zion-ai-native -p zion-oasis -- -D warnings
