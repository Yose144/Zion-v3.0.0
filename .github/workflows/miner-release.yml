name: ZION Boost Miner — Multi-Platform Release

# Builds the public ZION Boost Miner binary for Linux x86_64, Linux ARM64,
# Windows x86_64, macOS Apple Silicon and macOS Intel, then uploads the
# artifacts to the public repository:
#   https://github.com/Zion-TerraNova/v3-Mainnet
#
# Required repository secret:
#   PUBLIC_RELEASE_TOKEN  -- GitHub PAT with 'repo' or 'public_repo' scope
#
# Usage:
#   1. Run the workflow manually and choose the release tag.
#   2. If a release with the same tag already exists, assets are uploaded
#      with --clobber and release notes are updated.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v3.1.0'
        required: true
        type: string
      draft:
        description: 'Create as draft release (only for new releases)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v3.1.0'
      - 'v3.1.0-*'
      - 'miner-v*'

env:
  PUBLIC_REPO: Zion-TerraNova/v3-Mainnet
  VERSION: "3.1.0"

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ocl-icd-opencl-dev libssl-dev pkg-config

      - name: Build miner
        working-directory: MinerP3.0.6/miner
        env:
          ZION_CPU_TARGET: x86-64
          ZION_DISABLE_OPENMP: "1"
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p MinerP3.0.6/dist
          cp MinerP3.0.6/miner/target/release/zion-miner MinerP3.0.6/dist/
          cd MinerP3.0.6/dist
          tar czf zion-miner-v${{ env.VERSION }}-linux-x86_64.tar.gz zion-miner
          sha256sum zion-miner-v${{ env.VERSION }}-linux-x86_64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miner-linux-x86_64
          path: MinerP3.0.6/dist/zion-miner-v${{ env.VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-linker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu build-essential cmake ocl-icd-opencl-dev libssl-dev pkg-config

      - name: Build miner
        working-directory: MinerP3.0.6/miner
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          ZION_CPU_TARGET: x86-64
          ZION_DISABLE_OPENMP: "1"
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Package
        run: |
          mkdir -p MinerP3.0.6/dist
          cp MinerP3.0.6/miner/target/aarch64-unknown-linux-gnu/release/zion-miner MinerP3.0.6/dist/
          cd MinerP3.0.6/dist
          tar czf zion-miner-v${{ env.VERSION }}-linux-arm64.tar.gz zion-miner
          sha256sum zion-miner-v${{ env.VERSION }}-linux-arm64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miner-linux-arm64
          path: MinerP3.0.6/dist/zion-miner-v${{ env.VERSION }}-linux-arm64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install OpenCL via vcpkg
        shell: pwsh
        run: |
          vcpkg install opencl:x64-windows
          $openclLib = "${env:VCPKG_ROOT}\installed\x64-windows\lib"
          $openclInc = "${env:VCPKG_ROOT}\installed\x64-windows\include"
          echo "LIB=$openclLib;${env:LIB}" >> ${env:GITHUB_ENV}
          echo "INCLUDE=$openclInc;${env:INCLUDE}" >> ${env:GITHUB_ENV}

      - name: Build miner
        working-directory: MinerP3.0.6/miner
        shell: bash
        env:
          LIB: ${{ env.LIB }}
          INCLUDE: ${{ env.INCLUDE }}
          ZION_DISABLE_OPENMP: "1"
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          mkdir -p MinerP3.0.6/dist
          cp MinerP3.0.6/miner/target/release/zion-miner.exe MinerP3.0.6/dist/
          cd MinerP3.0.6/dist
          7z a -tzip zion-miner-v${{ env.VERSION }}-windows-x86_64.zip zion-miner.exe
          sha256sum zion-miner-v${{ env.VERSION }}-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miner-windows-x86_64
          path: MinerP3.0.6/dist/zion-miner-v${{ env.VERSION }}-windows-x86_64.zip
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build miner
        working-directory: MinerP3.0.6/miner
        env:
          ZION_DISABLE_OPENMP: "1"
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p MinerP3.0.6/dist
          cp MinerP3.0.6/miner/target/release/zion-miner MinerP3.0.6/dist/
          cd MinerP3.0.6/dist
          tar czf zion-miner-v${{ env.VERSION }}-macos-arm64.tar.gz zion-miner
          shasum -a 256 zion-miner-v${{ env.VERSION }}-macos-arm64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miner-macos-arm64
          path: MinerP3.0.6/dist/zion-miner-v${{ env.VERSION }}-macos-arm64.tar.gz
          if-no-files-found: error

  build-macos-x86_64:
    name: Build macOS Intel
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build miner
        working-directory: MinerP3.0.6/miner
        env:
          ZION_DISABLE_OPENMP: "1"
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p MinerP3.0.6/dist
          cp MinerP3.0.6/miner/target/release/zion-miner MinerP3.0.6/dist/
          cd MinerP3.0.6/dist
          tar czf zion-miner-v${{ env.VERSION }}-macos-x86_64.tar.gz zion-miner
          shasum -a 256 zion-miner-v${{ env.VERSION }}-macos-x86_64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miner-macos-x86_64
          path: MinerP3.0.6/dist/zion-miner-v${{ env.VERSION }}-macos-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Upload to public release
    needs: [build-linux-x86_64, build-linux-arm64, build-windows, build-macos-arm64, build-macos-x86_64]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: miner-*

      - name: Prepare release assets
        working-directory: artifacts
        run: |
          mkdir -p release
          find . -name '*.tar.gz' -o -name '*.zip' | xargs -I{} cp {} release/
          cd release
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%P\n' | sort)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          ls -lh

      - name: Check release token
        shell: bash
        run: |
          if [ -z "${PUBLIC_RELEASE_TOKEN}" ]; then
            echo "::error::PUBLIC_RELEASE_TOKEN secret is missing."
            exit 1
          fi
        env:
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}

      - name: Upload to public release
        working-directory: artifacts/release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DRAFT_FLAG: ${{ inputs.draft == true && '--draft' || '' }}
        run: |
          set -e
          mapfile -t assets < <(find . -maxdepth 1 -type f -printf '%P\n' | sort)
          if gh release view "${RELEASE_TAG}" --repo "${PUBLIC_REPO}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} exists. Uploading with --clobber."
            gh release upload --repo "${PUBLIC_REPO}" "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            echo "Creating new release ${RELEASE_TAG}."
            gh release create "${RELEASE_TAG}" \
              --repo "${PUBLIC_REPO}" \
              --title "ZION v3.1.0 — Boost Miner" \
              --notes "## ZION v3.1.0 — Boost Miner

          Multi-platform release of the ZION Boost Miner.

          ### Downloads
          | File | Platform |
          |------|----------|
          | zion-miner-v3.1.0-linux-x86_64.tar.gz | Linux x86_64 |
          | zion-miner-v3.1.0-linux-arm64.tar.gz | Linux ARM64 |
          | zion-miner-v3.1.0-windows-x86_64.zip | Windows x86_64 |
          | zion-miner-v3.1.0-macos-arm64.tar.gz | macOS Apple Silicon |
          | zion-miner-v3.1.0-macos-x86_64.tar.gz | macOS Intel |

          See SHA256SUMS.txt for checksums." \
              ${DRAFT_FLAG} \
              "${assets[@]}"
          fi
