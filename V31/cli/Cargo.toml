[package]
name = "zion-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Unified ZION operator CLI for V31 Mainnet Alpha."

[[bin]]
name = "zion"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
colored = "2"
dialoguer = "0.11"
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

zion-core = { path = "../L1/core" }
zion-l1-types = { path = "../L1/types" }
zion-miner = { path = "../L1/miner", features = ["auxpow"] }
zion-multichain = { path = "../L2/multichain" }
