[package]
name = "zion-multichain"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Unified Multi-Chain L2 for ZION Mainnet Alpha: bridge, swap, DEX, wallet, credits."

[dependencies]
zion-core = { workspace = true }
zion-l1-types = { workspace = true }
