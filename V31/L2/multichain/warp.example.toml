# Example WARP bridge node configuration.
# Copy this file to `warp.toml` and fill in real RPC endpoints, contract
# addresses, and validator keys before running `cargo run -p zion-multichain --bin warpd`.
#
# Environment overrides (set in the service EnvironmentFile, NOT here, for real
# relay keys and deployed contract addresses):
#   WARP_L1_RPC_URL, WARP_L1_VAULT_ADDRESS
#   WARP_SOLANA_ZION_MINT, WARP_SOLANA_RELAY_KEY
#   WARP_TRON_CONTRACT, WARP_TRON_RELAY_KEY
#   WARP_TON_BRIDGE_ACCOUNT, WARP_TON_RELAY_KEY
#   WARP_NEAR_BRIDGE_CONTRACT, WARP_NEAR_RELAY_KEY
#   WARP_CARDANO_ZION_ASSET, WARP_CARDANO_PAYMENT_KEY
#   WARP_BITCOIN_HTLC_ADDRESS, WARP_BTC_RELAY_KEY
#   WARP_LN_NODE_URL, WARP_LN_MACAROON
#   WARP_EVM_RELAY_KEY, WARP_VALIDATOR_KEYS
# See V31/L2/multichain/src/warp/adapter/*.rs for the complete env-var surface.

node_id = "warp-node-1"
listen_addr = "0.0.0.0"
listen_port = 9333
database_path = "data/warp.db"

quorum = 3
daily_limit_zion = 10000000      # 10 000 000 ZION per 24h
timelock_threshold_zion = 1000000 # ZION timelock above 1M

l1_rpc_url = "http://127.0.0.1:9443"
l1_vault_address = "zion1warp_vault_address"

poll_interval_secs = 15

[[chains]]
name = "base"
family = "evm"
enabled = true
rpc_url = "https://mainnet.base.org"
contract_address = "0x0c493763d107ab0ABb0aee1Ca3999292d8202bb6"
finality_blocks = 12

