# ── Solver network (optional) ───────────────────────────────────────────────
# Configure this warpd instance as an off-chain intent solver, and/or list
# trusted independent solvers that the local buyer node can broadcast intents to.

[solver]
enabled = false
name = "zion-solver"
fee_bps = 10
# api_key = "set-a-strong-shared-secret-here"   # protects /v1/swap/solve
# advertised_url = "https://solver.example.com" # public URL other buyers can use

# Pre-configured independent solvers known to this buyer node.
# The buyer will broadcast open intents to each entry concurrently.
