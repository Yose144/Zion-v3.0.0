# Example configuration for `zion-multichain` (V31 Mainnet Alpha).
# This is a `MultichainConfig` example used by the in-crate `MultichainService`
# and its integration tests (`cargo test -p zion-multichain`).
#
# The production Edge `zion-v31-multichain.service` runs the `warpd` binary,
# which expects a `WarpConfig` in /etc/zion/warp.toml. Use
# `V31/L2/multichain/warp.example.toml` as the canonical WARP bridge config
# template and do NOT point `warpd` at this file.

[server]
bind = "127.0.0.1"
port = 8453

[database]
path = "multichain.db"

[[adapters]]
chain = "base"
# Base mainnet public RPC; use a private endpoint for production.
rpc_url = "https://mainnet.base.org"
enabled = true

[[adapters]]
chain = "bitcoin"
# mempool.space API for mainnet. Use a custom electrum/esplora URL if desired.
rpc_url = "https://mempool.space/api"
enabled = true

[[adapters]]
chain = "zion-l1"
# Local ZION node RPC. The public endpoint is rpc.zionterranova.com:8443.
rpc_url = "http://127.0.0.1:9445"
enabled = true
