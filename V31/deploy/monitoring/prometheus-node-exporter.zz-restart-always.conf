[Service]
# 2026-11-07: the packaged ExecReload sends SIGHUP, and node_exporter does not
# handle SIGHUP — it exits. Someone ran `systemctl reload` on 2026-10-31 10:49
# CET and EDGE1 host metrics stayed dead for a week; Restart=on-failure did not
# bring it back because the unit was left in a reload-failed state.
#
# Clearing ExecReload makes `systemctl reload` fail loudly instead of silently
# killing the exporter. Restart=always is the second belt: any signal death or
# crash comes back without an operator.
ExecReload=
Restart=always
RestartSec=5s
