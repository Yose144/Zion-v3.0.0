# EDGE2-only drop-in — pool stratum lives on EDGE (public :8444), not on
# EDGE2 loopback. Without this, pool_stratum permanently probes 127.0.0.1:8444
# → false fail while pool_http (tunneled :8080) stays green.
#
# Install:
#   scp … zion-edge2:/etc/systemd/system/zion-g8-probe.service.d/10-edge2-stratum.conf
#   systemctl daemon-reload && systemctl restart zion-g8-probe
#
# Do NOT install on EDGE (stratum is local there).
[Service]
Environment=G8_STRATUM_HOST=62.171.141.136
Environment=G8_STRATUM_PORT=8444
