# Drop-in: `zion-v31-pool.service` — PPLNS persist cadence + glibc arena cap
#
# Deploy:  /etc/systemd/system/zion-v31-pool.service.d/zzz-pplns-arena.conf
#          (na EDGE1), pak `systemctl daemon-reload && systemctl restart zion-v31-pool`
# Rollback: smazat soubor, daemon-reload, restart.
#
# ── proč 180 s ─────────────────────────────────────────────────────────────
# `pool-pplns.json` je celé PPLNS okno (`--pplns-window-size 500000000`) jako
# jeden JSON — na EDGE1 měřeno 122,6 MB, přepis každých 30 s. Pool ho
# serializuje pod vláknem, které jinak obsluhuje shares, a EDGE1 je nejvytíženější
# box (4 vCPU, load ~4,5, k tomu vlastní těžba ~250 % CPU). Delší kadence snižuje
# I/O i CPU špičky; okno samo se nemění, takže **payout semantika zůstává stejná**
# — mění se jen to, jak často se stav ukládá na disk (restart tak ztratí max 3 min
# neuložených shares místo 30 s; shares se do okna počítají dál v paměti).
#
# ── proč MALLOC_ARENA_MAX=2 ────────────────────────────────────────────────
# Pool má 64 vláken; glibc dá každému vláknu vlastní arenu (až 8×CPU), takže RSS
# roste i bez leaku. Měřeno 16. 11.: 551 MB → 3,81 GB za 9 h, plateau ~4,4 GB na
# boxu s 7,9 GB RAM. Tenhle knob je **experiment**: když plateau spadne pod
# ~1,5 GB, byl to problém arén, ne leak, a přejde se na jemalloc. Když ne,
# následuje heap profil. Zpět = smazat tenhle řádek.
[Service]
Environment="ZION_POOL_PPLNS_PERSIST_INTERVAL_S=180"
Environment="MALLOC_ARENA_MAX=2"
