# EDGE1 <-> EDGE2 tunnel link (2026-11-16)
#
# Measured on EDGE1 -> 207.180.217.100: 300 pings, 0 % loss, p50 1.4 ms but
# p90 18.8 ms / p99 94.6 ms with "pipe 3" (responses out of order) and
# 135 871 out-of-order packets on the tunnel socket. That is reordering with a
# latency spread, not packet loss, so tolerate more reordering instead of
# retransmitting, and use BBR + fq which cope better with the spread.
net.ipv4.tcp_reordering = 10
net.ipv4.tcp_max_reordering = 600
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_notsent_lowat = 131072
