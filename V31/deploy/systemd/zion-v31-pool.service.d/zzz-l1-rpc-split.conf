[Service]
# The pool is the heaviest consumer of the EDGE2 node RPC: ~0.7 MB/s of
# getTemplate plus 27 MB getUtxos sets. On the shared chain tunnel those bulk
# flows head-of-line-block the small health probes (2026-11-15: a saturated
# tunnel was recorded as a 1 140 s outage of multichain/DAO/ZIS while all
# three kept answering). Route the pool over its own dedicated tunnel
# (127.0.0.1:9455 -> EDGE2:9445, unit zion-chain-tunnel-pool.service) and keep
# the local EDGE1 followers as failover.
#
# File name starts with `zzz-` on purpose: drop-ins are read alphabetically
# and `zz-l1-primary-only.conf` also sets ExecStart. The last assignment wins.
ExecStart=
ExecStart=/opt/zion/V31/target/release/zion-pool \
    --bind 0.0.0.0:8444 \
    --l1-rpc-url http://127.0.0.1:9455,http://127.0.0.1:9446,http://127.0.0.1:9447 \
    --miner-address ${ZION_POOL_WALLET} \
    --state-path /opt/zion/data/v31/pool-pplns.json \
    --pool-fee-bps 100 \
    --pplns-window-size 500000000 \
    --store-db-path /opt/zion/data/v31/pool-store.db
