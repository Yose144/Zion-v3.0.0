# ZION V31 Edge — fail2ban jail for SSH
# Drop-in: /etc/fail2ban/jail.d/zion-sshd.conf
#
# Prevents operator IPs from being banned during rapid SSH audits/deploys.
# See V31/AGENTS.md §3 for the canonical OPERATOR_IPS list.

[sshd]
enabled = true
backend = systemd
maxretry = 3
findtime = 10m
bantime = 24h
ignoreip = 127.0.0.1/8 ::1 109.81.31.210 109.81.27.87 109.81.89.176 109.81.83.205 109.81.81.86 109.81.83.81 109.81.24.189 46.135.81.225 2a00:11b1:10e2:af49:b90b:20ed:4eee:b48b/128 2a00:102b:5005:3217:ce28:aaff:fe46:f739/128 109.81.31.156 109.81.31.171 2a00:102b:5005:5db3:7cca:8777:6e6c:4adf/128 2a00:102b:5005:5db3::/64 2a02:c207:2342:5821::1/64
