# ZION V31 Edge — fail2ban filter for P2P connection failures
# Drop-in: /etc/fail2ban/filter.d/zion-p2p.conf
#
# Matches P2P connection errors, peer disconnect floods, and port-scan-like
# behavior in ZION node logs (journald).

[Definition]
failregex = ^.*P2P.*(?:connection refused|connect error|handshake failed|peer rejected|disconnect flood).*$
            ^.*(?:ERROR|WARN).*peer.*(?:disconnect|refused|timeout|failed).*$
            ^.*(?:ERROR|WARN).*inbound.*(?:rejected|dropped|failed).*$
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S
