# ZION V31 Edge — fail2ban jail for P2P ports
# Drop-in: /etc/fail2ban/jail.d/zion-p2p.conf
#
# Protects P2P ports 8333 (node1), 8334 (node2), and 8335 (V31 primary)
# from connection flooding.
# Uses journald as the log source (ZION services log to journald).
#
# NOTE: Local backup nodes that do rapid P2P connect/disconnect can trigger
# this jail. Add their IPs to ignoreip to prevent self-lockout.
# See AGENTS.md incident 2026-07-19 for details.

[zion-p2p]
enabled = true
filter = zion-p2p
backend = systemd
journalmatch = _SYSTEMD_UNIT=zion-v31-node.service + _SYSTEMD_UNIT=zion-edge-node2.service
maxretry = 50
bantime = 24h
findtime = 10m
ignoreip = 127.0.0.1/8 ::1 109.81.31.210 109.81.27.87 109.81.89.176 109.81.83.205 109.81.81.86 109.81.83.81 109.81.24.189 46.135.81.225 2a00:11b1:10e2:af49:b90b:20ed:4eee:b48b/128 2a00:102b:5005:3217:ce28:aaff:fe46:f739/128 109.81.31.156 109.81.31.171 2a00:102b:5005:5db3:7cca:8777:6e6c:4adf/128 2a00:102b:5005:5db3::/64 2a02:c207:2342:5821::1/64
action = iptables-allports[name=zion-p2p, protocol=all]
