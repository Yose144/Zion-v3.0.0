# ZION L5 Free World portal — freeworld.zionterranova.com
# Server: 62.171.141.136 (Contabo VPS)
# Deploy to /etc/nginx/sites-available/freeworld.zionterranova.com.conf and
# enable as /etc/nginx/sites-enabled/freeworld.zionterranova.com.conf.
#
# The domain proxies the Next.js app on 127.0.0.1:3000; the root path is
# mapped onto the /l5-free-world page. `/api/` reaches the same app (the
# /api/free-world/* proxy and ZIS auth endpoints live there) with rate-limit
# parity to the app.* vhost. The operator API key never leaves the server —
# public ballots go through the same-origin proxy which binds voter_id to
# the ZIS session.
# TLS is managed by Certbot — on first deploy create an HTTP-only block, run
#   certbot --nginx -d freeworld.zionterranova.com
# and it writes the ssl_* directives shown below.

server {
    server_name freeworld.zionterranova.com;

    # Security headers (parity with the apex site)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Public JSON API — proxied to the Next.js app which owns the Free World
    # proxy and ZIS auth; rate-limit parity with the app.* vhost.
    location /api/ {
        limit_req zone=zion_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Landing — the domain root serves the L5 Free World portal page.
    location = / {
        proxy_pass http://127.0.0.1:3000/l5-free-world;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Everything else (Next.js assets, linked pages like /terranova/*) —
    # same app, passthrough.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/freeworld.zionterranova.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/freeworld.zionterranova.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = freeworld.zionterranova.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name freeworld.zionterranova.com;
    return 404; # managed by Certbot
}
