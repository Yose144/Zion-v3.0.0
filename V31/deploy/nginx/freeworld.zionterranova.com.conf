# ZION L5 Free World portal — freeworld.zionterranova.com
# Server: 62.171.141.136 (Contabo VPS)
# Deploy to /etc/nginx/sites-available/freeworld.zionterranova.com.conf and
# enable as /etc/nginx/sites-enabled/freeworld.zionterranova.com.conf.
#
# The dedicated domain serves the standalone static Free World site built in
# APP&WEB/FreeWorld (deploy script: deploy/deploy-freeworld.sh → /var/www/freeworld).
# `/api/` still proxies the Next.js app on 127.0.0.1:3000 so the static pages can
# reach the public Free World API (/api/free-world/*) and ZIS auth endpoints
# (/api/auth/*) without exposing the operator API key.
# TLS is managed by Certbot — on first deploy create an HTTP-only block, run
#   certbot --nginx -d freeworld.zionterranova.com
# and it writes the ssl_* directives shown below.

server {
    server_name freeworld.zionterranova.com;
    root /var/www/freeworld;
    index index.html;

    # Security headers (parity with the apex site)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Immutable-ish static assets — hashed images, css, js.
    location ~* \.(?:webp|png|jpe?g|gif|ico|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Public JSON API — proxied to the Next.js app which owns the Free World
    # proxy and ZIS auth; rate-limit parity with the app.* vhost.
    location /api/ {
        limit_req zone=zion_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Static site — /p/<slug>/ directories resolve via their index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/freeworld.zionterranova.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/freeworld.zionterranova.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = freeworld.zionterranova.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name freeworld.zionterranova.com;
    return 404; # managed by Certbot
}
