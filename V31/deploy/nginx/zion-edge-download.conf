server {
    listen 80 default_server;
    server_name _;

    location /zion-miner/ {
        alias /var/www/zion-miner/;
        autoindex on;
        keepalive_timeout 300s;
        sendfile on;
        tcp_nopush on;
    }

    location /rig-output/ {
        proxy_pass http://127.0.0.1:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
server {
    server_name app.zionterranova.com; # managed by Certbot


    location /zion-miner/ {
        alias /var/www/zion-miner/;
        autoindex on;
        keepalive_timeout 300s;
        sendfile on;
        tcp_nopush on;
    }

    location /rig-output/ {
        proxy_pass http://127.0.0.1:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }


    # TEMPORARY: /onboard hidden while under review
    location /onboard {
        return 301 /;
    }
    location /docs/onboard/ {
        return 301 /;
    }

    # Rate limiting for public JSON API (explorer/pool endpoints proxy to
    # node RPC / pool HTTP API under the hood — protect against scraping
    # storms and basic DoS). burst=10 allows short legitimate bursts
    # (e.g. a page loading several /api/* calls at once) before throttling.
    location /api/ {
        limit_req zone=zion_api burst=15 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Search-like/expensive lookups get the stricter zone.
    location = /api/blockchain/search {
        limit_req zone=zion_api_burst burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

        location / {
        limit_req zone=zion_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.zionterranova.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.zionterranova.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}server {
    if ($host = app.zionterranova.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 ;
    server_name app.zionterranova.com;
    return 404; # managed by Certbot


}
