# ZION V31 Edge — nginx configuration
# Server: 62.171.141.136 (Contabo VPS)
# Adapted from V3/deploy/new-server/nginx-zionterranova.conf for V31

# ── Main site: zionterranova.com ──────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name zionterranova.com www.zionterranova.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zionterranova.com www.zionterranova.com;

    ssl_certificate /etc/letsencrypt/live/zionterranova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zionterranova.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/zion-maintenance;
    index index.html;

    # Maintenance page — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy → node RPC (9445) — V31 node RPC on localhost
    location /api/rpc {
        proxy_pass http://127.0.0.1:9445;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # DAO API proxy — keep accessible
    location /api/dao {
        proxy_pass http://127.0.0.1:8450;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WARP / multi-chain API proxy — V31 warpd on localhost:8453
    location = /api/warp {
        return 301 /api/warp/;
    }

    location /api/warp/ {
        proxy_pass http://127.0.0.1:8453/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Multi-chain DEX API proxy — V31 warpd DEX listener on localhost:8454
    location /v1/ {
        proxy_pass http://127.0.0.1:8454;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}

# ── Dashboard: dashboard.zionterranova.com ────────────────────
server {
    if ($host = dashboard.zionterranova.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name dashboard.zionterranova.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.zionterranova.com;
    ssl_certificate /etc/letsencrypt/live/dashboard.zionterranova.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dashboard.zionterranova.com/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

# ── TCP stream proxy: public RPC (rpc.zionterranova.com:8443) ──
# Forwards public port 8443 → 127.0.0.1:9445 (V31 node direct RPC)
# V31 node binary: /opt/zion/V31/target/release/zion-node
stream {
    server {
        listen 8443;
        listen [::]:8443;
        proxy_pass 127.0.0.1:9445;
        proxy_timeout 300s;
    }
}
