# ZION V31 Edge — main nginx site config for zionterranova.com
# Server: 62.171.141.136 (Contabo VPS)
# Deploy to /etc/nginx/sites-available/zion-nginx.conf and enable as
# /etc/nginx/sites-enabled/zion-nginx.conf.
# The TCP stream proxy for RPC now lives in /etc/nginx/nginx.conf.

# ── Main site: zionterranova.com ──────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name zionterranova.com www.zionterranova.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zionterranova.com www.zionterranova.com;

    ssl_certificate /etc/letsencrypt/live/zionterranova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zionterranova.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/zion-maintenance;
    index index.html;

    # Intro page — serve index.html for all routes (Next.js static export)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Miner binary downloads still available
    location /zion-miner/ {
        alias /var/www/zion-miner/;
        autoindex on;
    }

    # API proxy → node RPC (9445) — V31 node RPC on localhost
    location /api/rpc {
        proxy_pass http://127.0.0.1:9445;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # DAO API proxy — keep accessible
    location /api/dao {
        proxy_pass http://127.0.0.1:8456;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # L5 Free World API proxy — operator-only (localhost / SSH tunnel)
    location /api/free-world/ {
        allow 127.0.0.1;
        # Add OPERATOR_IPS here on the Edge server if remote access is needed.
        deny all;
        proxy_pass http://127.0.0.1:8095/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # L6 Issobella API proxy — operator-only (localhost / SSH tunnel)
    location /api/issobella/ {
        allow 127.0.0.1;
        # Add OPERATOR_IPS here on the Edge server if remote access is needed.
        deny all;
        proxy_pass http://127.0.0.1:8097/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # WARP / multi-chain API proxy — V31 warpd on localhost:8453
    location = /api/warp {
        return 301 /api/warp/;
    }

    location /api/warp/ {
        proxy_pass http://127.0.0.1:8453/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Multi-chain DEX API proxy — V31 warpd DEX listener on localhost:8454
    location /v1/ {
        proxy_pass http://127.0.0.1:8454;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}

# ── Dashboard: dashboard.zionterranova.com ────────────────────
server {
    if ($host = dashboard.zionterranova.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name dashboard.zionterranova.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.zionterranova.com;
    ssl_certificate /etc/letsencrypt/live/dashboard.zionterranova.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dashboard.zionterranova.com/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

# ── Miner download endpoint ───────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name 62.171.141.136;

    location /zion-miner/ {
        alias /var/www/zion-miner/;
        autoindex on;
    }
}
