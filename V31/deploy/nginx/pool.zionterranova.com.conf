# ZION Pool NG — pool.zionterranova.com
# Server: 62.171.141.136 (Contabo VPS)
# Deploy to /etc/nginx/sites-available/pool.zionterranova.com.conf and
# enable as /etc/nginx/sites-enabled/pool.zionterranova.com.conf.
#
# Serves the static pool UI built in APP&WEB/pool-ui (deploy script:
# APP&WEB/pool-ui/deploy/deploy-pool.sh -> /var/www/pool) plus the
# unauthenticated public read tier /public/v1/* of zion-pool's API
# (127.0.0.1:8080, ZION_POOL_API_BIND).  ONLY /public/v1 is proxied —
# /api/* and /admin/* stay internal and must never match a location here.
#
# TLS is managed by Certbot — on first deploy keep the HTTP-only block,
# run
#   certbot --nginx -d pool.zionterranova.com
# and it writes the ssl_* directives shown below.

server {
    server_name pool.zionterranova.com;
    root /var/www/pool;
    index index.html;

    # Security headers (parity with the apex site)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Immutable hashed Next.js assets.
    location /_next/static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static assets (icons, images).
    location ~* \.(?:webp|png|jpe?g|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Public read API — the ONLY proxied prefix.  The pool-side handler
    # applies its own per-IP limit (120 req/min); this adds an edge-side
    # cap as defense in depth.
    location = /public/v1 {
        return 404;
    }
    location /public/v1/ {
        limit_req zone=zion_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
    }

    # Belt-and-suspenders: never expose internal API or admin surface,
    # even if the upstream listener is misconfigured.
    location /api/ {
        return 404;
    }
    location /admin {
        return 404;
    }

    # Static export — Next emits one directory + index.html per route.
    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pool.zionterranova.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pool.zionterranova.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = pool.zionterranova.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name pool.zionterranova.com;
    return 404; # managed by Certbot
}
