[package]
name = "zion-pool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ZION L1 stratum pool with PPLNS share accounting."

[[bin]]
name = "zion-pool"
path = "src/main.rs"

[dependencies]
zion-l1-types = { workspace = true }
zion-core = { workspace = true }
zion-cosmic-harmony = { workspace = true }
zion-miner = { workspace = true, features = ["auxpow"] }

anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha3 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
