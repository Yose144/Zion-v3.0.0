[package]
name = "zion-miner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ZION L1 miner runtime with merged AuxPoW and Ekam Deeksha PoW."

[features]
default = []
# Enable external AuxPoW (Stream 2 GPU + Stream 3 CPU) merged mining.
# Disable for ZION-only mining or when external stratum pools are unavailable.
auxpow = []
# Native algorithm acceleration (optional, requires C toolchain).
native-hashers = []

[dependencies]
zion-l1-types = { workspace = true }
zion-core = { workspace = true }
zion-cosmic-harmony = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha3 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
