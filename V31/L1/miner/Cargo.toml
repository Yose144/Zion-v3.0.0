[package]
name = "zion-miner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ZION L1 miner runtime with merged AuxPoW and Ekam Deeksha PoW."

[features]
# Enable external AuxPoW (Stream 2 GPU + Stream 3 CPU) merged mining.
# Disable for ZION-only mining or when external stratum pools are unavailable.
default = ["auxpow"]
auxpow = []

# Public build: hides Trinity / AuxPow details in the TUI.
# The miner still runs Trinity internally, but the UI shows only
# "ZION / Deeksha Lite v1" — no ZANO, VRSC, or external coin names.
# Used for public release binaries (v3.0.6-beta+).
public_build = []

# Native algorithm acceleration (optional, requires C toolchain).
# Enables RandomX, Ghostrider, VerusHash, etc. via zion-native-ffi.
native-hashers = ["dep:zion-native-ffi"]
# Individual native algorithm shims used by the CPU fallback and CUDA/Metal paths.
native-etchash = ["native-hashers", "zion-native-ffi/native-etchash"]
native-kawpow = ["native-hashers", "zion-native-ffi/native-kawpow"]
native-autolykos = ["native-hashers", "zion-native-ffi/native-autolykos"]
native-kheavyhash = ["native-hashers", "zion-native-ffi/native-kheavyhash"]
native-blake3-algo = ["native-hashers", "zion-native-ffi/native-blake3-algo"]
native-cosmic-harmony = ["native-hashers", "zion-native-ffi/native-cosmic-harmony"]
# Native VerusHash — uses zion-native-ffi's C++ implementation instead of stub.
native-verushash = ["native-hashers", "auxpow", "zion-native-ffi/native-verushash"]
# Native RandomX — uses zion-native-ffi's C++ implementation (tevador/RandomX).
native-randomx = ["native-hashers", "auxpow", "zion-native-ffi/native-randomx"]
# Native GhostRider — uses zion-native-ffi's C++ implementation (sphlib + CN).
native-ghostrider = ["native-hashers", "auxpow", "zion-native-ffi/native-ghostrider"]
# Convenience: all native algorithms
native-all = [
    "native-etchash", "native-kawpow", "native-autolykos", "native-kheavyhash",
    "native-blake3-algo", "native-cosmic-harmony", "native-verushash", "native-randomx",
    "native-ghostrider",
]

# GPU backends (feature-gated, require GPU toolchain)
gpu-opencl = ["dep:ocl", "auxpow"]
gpu-cuda = ["dep:cudarc", "auxpow"]
gpu-metal = ["dep:metal", "dep:block", "dep:objc", "auxpow"]
# Convenience: all GPU backends
gpu = ["gpu-opencl", "gpu-cuda", "gpu-metal"]
gpu-all = ["gpu-opencl", "gpu-cuda", "gpu-metal"]

# Full build: every GPU backend + every native algorithm.
# Produces a single unified miner binary that can mine any coin by just
# changing --algorithm / --pool / --wallet parameters.
full = [
    "gpu-opencl", "gpu-cuda", "gpu-metal",
    "native-all",
]

# TUI — interactive terminal UI (ratatui-based keyboard control, sticky header).
# Requires `ratatui` and `crossterm` dependencies.
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
zion-l1-types = { workspace = true }
zion-core = { workspace = true }
zion-cosmic-harmony = { workspace = true }
zion-native-ffi = { path = "../native-ffi", optional = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
# GPU backends
cudarc = { version = "0.12", optional = true, features = ["cuda-12040"] }
metal = { version = "0.30", optional = true }
block = { version = "0.1", optional = true }
objc = { version = "0.2", optional = true }
ocl = { version = "0.19", optional = true }
base64 = { workspace = true }
blake2 = { workspace = true }
blake2b_simd = "1"
blake3 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
num-bigint = { workspace = true }
num_cpus = "1"
rayon = "1"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# TUI (optional)
crossterm = { version = "0.28", optional = true }
ratatui = { version = "0.29", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "zion-miner"
path = "src/bin/zion-miner.rs"

[[bin]]
name = "zion-universal-miner"
path = "src/bin/zion-universal-miner.rs"
required-features = ["auxpow"]

[build-dependencies]
cc = "1.0"
