# lumi2.eu — vlastní cert, obě jména jen přesměrují na kanonický obchod.
# Certifikát: certbot certonly --webroot -w /var/www/html -d lumi2.eu -d www.lumi2.eu

server {
    listen 80;
    listen [::]:80;
    server_name lumi2.eu www.lumi2.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://lumi.zionterranova.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lumi2.eu www.lumi2.eu;

    ssl_certificate     /etc/letsencrypt/live/lumi2.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumi2.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://lumi.zionterranova.com$request_uri;
}
