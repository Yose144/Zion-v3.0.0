# Lumi — lumi.zionterranova.com
# Next.js běží na 127.0.0.1:3200 (systemd zion-lumi.service).
# TLS řeší certbot: `certbot --nginx -d lumi.zionterranova.com`.

server {
    listen 80;
    listen [::]:80;
    server_name lumi.zionterranova.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lumi.zionterranova.com;

    ssl_certificate     /etc/letsencrypt/live/lumi.zionterranova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumi.zionterranova.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Statické assety Nextu mají hash v názvu — mohou se cachovat navěky.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3D model a fotky — dlouhá cache, ale ne immutable (jména se nemění).
    location /models/ {
        proxy_pass http://127.0.0.1:3200;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        proxy_pass http://127.0.0.1:3200;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
