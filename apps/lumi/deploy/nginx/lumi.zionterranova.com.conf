# Lumi — lumi.zionterranova.com
# Next.js běží na 127.0.0.1:3200 (systemd zion-lumi.service).
# Statické assety servíruje nginx přímo ze standalone stromu (rychlejší,
# bez proxy temp souborů); když soubor chybí, padá zpět na Next.
# TLS řeší certbot: `certbot certonly --webroot ...`.

server {
    listen 80;
    listen [::]:80;
    server_name lumi.zionterranova.com www.lumi.zionterranova.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Kanonická doména je apex — www i http skočí rovnou na https://lumi...
    location / {
        return 301 https://lumi.zionterranova.com$request_uri;
    }
}

# www.lumi — TLS musí projít (cert pokrývá oba names), pak redirect na apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lumi.zionterranova.com;

    ssl_certificate     /etc/letsencrypt/live/lumi.zionterranova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumi.zionterranova.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://lumi.zionterranova.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lumi.zionterranova.com;

    ssl_certificate     /etc/letsencrypt/live/lumi.zionterranova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumi.zionterranova.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Next static — hash v názvu, může se cachovat navěky.
    location /_next/static/ {
        # URL /_next/static/... odpovídá souboru .next/static/... — rewrite
        # srovná segment `_next` na `.next` a soubor se servíruje přímo.
        root /opt/zion/APP&WEB/Lumi/.next/standalone/.next;
        rewrite ^/_next/static/(.*)$ /static/$1 break;
        try_files $uri @lumi_next;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Obrázky, 3D model a PDF návod — přímo z public/ standalone stromu.
    location /images/ {
        root /opt/zion/APP&WEB/Lumi/.next/standalone/public;
        try_files $uri @lumi_next;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location /models/ {
        root /opt/zion/APP&WEB/Lumi/.next/standalone/public;
        try_files $uri @lumi_next;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /downloads/ {
        root /opt/zion/APP&WEB/Lumi/.next/standalone/public;
        try_files $uri @lumi_next;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location @lumi_next {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
