<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEST - Navigation</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    body { background: #111; color: #fff; }
    .test-info {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      padding: 10px;
      font-size: 12px;
      z-index: 9999;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <header id="header">
    <div class="container">
      <div class="subcontainer">
        <nav class="navbar-container">
          <div class="navbar-left">
            <a href="#" class="nav-branding-1">TEST<span> Navigation</span></a>
            <div class="nav-menu">
              <a href="#" class="nav-link">Link 1</a>
              <a href="#" class="nav-link">Link 2</a>
              <a href="#" class="nav-link">Link 3</a>
            </div>
          </div>
          <div class="navbar-right">
            <div class="hamburger">
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
            </div>
          </div>
        </nav>
      </div>
    </div>
  </header>

  <main style="padding: 200px 20px;">
    <h1>Test Navigation</h1>
    <p>Zmenšete okno pod 868px a hamburger by se měl zobrazit.</p>
    <p>Klikněte na hamburger a menu by se mělo vysunout zleva.</p>
  </main>

  <div class="test-info" id="testInfo">Loading...</div>

  <script src="./script.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var info = document.getElementById('testInfo');
      var h = document.querySelector('.hamburger');
      var m = document.querySelector('.nav-menu');
      
      function updateInfo() {
        var w = window.innerWidth;
        info.innerHTML = 
          '<b>Window:</b> ' + w + 'px<br>' +
          '<b>Hamburger:</b> ' + (h ? 'found' : 'NOT FOUND') + '<br>' +
          '<b>Hamburger display:</b> ' + (h ? getComputedStyle(h).display : 'N/A') + '<br>' +
          '<b>NavMenu:</b> ' + (m ? 'found' : 'NOT FOUND') + '<br>' +
          '<b>NavMenu left:</b> ' + (m ? getComputedStyle(m).left : 'N/A') + '<br>' +
          '<b>NavMenu.active:</b> ' + (m ? m.classList.contains('active') : 'N/A');
      }
      
      updateInfo();
      window.addEventListener('resize', updateInfo);
      
      if (h) {
        h.addEventListener('click', function() {
          setTimeout(updateInfo, 100);
        });
      }
    });
  </script>
</body>
</html>
