<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZION eShop - Email Debug</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .result pre {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .info-box h3 {
            color: #1976D2;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .info-box ul {
            margin-left: 20px;
            color: #555;
            font-size: 14px;
        }
        .info-box li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 ZION eShop - Email Debugger</h1>
        <p class="subtitle">Test SMTP email odesílání (Webglobe)</p>

        <div class="info-box">
            <h3>ℹ️ SMTP konfigurace:</h3>
            <ul>
                <li><strong>Server:</strong> mail.webglobe.cz</li>
                <li><strong>Port:</strong> 587 (STARTTLS)</li>
                <li><strong>From:</strong> shop@newearth.cz</li>
                <li><strong>Auth:</strong> shop@newearth.cz / x3nityOne144</li>
            </ul>
        </div>

        <form id="emailForm">
            <div class="form-group">
                <label for="to">Příjemce (email):</label>
                <input type="email" id="to" name="to" value="yosef.hubalek@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="subject">Předmět:</label>
                <input type="text" id="subject" name="subject" value="ZION eShop - Test Email" required>
            </div>

            <div class="form-group">
                <label for="message">Zpráva:</label>
                <textarea id="message" name="message" required>Ahoj,

Toto je testovací email z ZION eShop systému.

✅ Pokud jsi tento email obdržel, SMTP funguje správně!

Timestamp: ${new Date().toLocaleString('cs-CZ')}

---
ZION Terra Nova
https://newearth.cz</textarea>
            </div>

            <div class="form-group">
                <label for="method">Metoda odeslání:</label>
                <select id="method" name="method">
                    <option value="smtp">PHPMailer SMTP (doporučeno)</option>
                    <option value="mail">PHP mail() funkce</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">📨 Odeslat testovací email</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        const form = document.getElementById('emailForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultDiv = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Odesílám...';
            resultDiv.style.display = 'none';

            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch('api/test-email-debug.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                resultDiv.style.display = 'block';
                if (result.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✅ Email odeslán úspěšně!</strong>
                        <p>Zkontroluj inbox (a spam) na adrese: ${data.to}</p>
                        ${result.details ? `<pre>${JSON.stringify(result.details, null, 2)}</pre>` : ''}
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>❌ Chyba při odesílání</strong>
                        <p>${result.error || 'Neznámá chyba'}</p>
                        ${result.details ? `<pre>${JSON.stringify(result.details, null, 2)}</pre>` : ''}
                    `;
                }
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <strong>❌ Síťová chyba</strong>
                    <p>${error.message}</p>
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '📨 Odeslat testovací email';
            }
        });
    </script>
</body>
</html>
