[package]
name = "zion-ncl"
version = "0.1.0"
edition = "2021"
authors = ["ZION Core Team"]
license = "MIT"
description = "NCL — Neural Compute Layer: Decentralized AI task marketplace (V3 Mainnet)"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
axum = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
