[package]
name = "zion-warp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "WARP — Wormhole Architecture for Rainbow Protocol: Universal cross-chain bridge"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
axum = "0.7"
toml = "0.8"
async-trait = "0.1"
rand = "0.8"
anyhow = "1"

# EVM transaction signing (secp256k1 + keccak256 + RLP)
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
rlp = "0.5"

# Bitcoin transaction signing (P2WPKH, BIP143 sighash, WIF key loading)
bitcoin = { version = "0.32", default-features = false, features = ["std"] }

# Stellar transaction signing (StrKey parsing, XDR encoding, ed25519)
stellar-strkey = "0.0.8"
base64 = "0.22"

# Cardano transaction signing (Blake2b-256 for TX body hash, CBOR encoding)
blake2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.4", features = ["util"] }

[[bin]]
name = "zion-warp-server"
path = "src/main.rs"
