# =============================================================================
# LND Configuration — ZION WARP Lightning Adapter
# =============================================================================
# Bitcoin TESTNET. For mainnet, change bitcoin.testnet=false and
# bitcoin.mainnet=true, and update bitcoind RPC port to 8332.
# =============================================================================

[Application Options]
# REST API — WARP adapter connects here (WARP_LN_NODE_URL=https://lnd:8080)
restlisten=0.0.0.0:8080
# gRPC API
rpclisten=0.0.0.0:10009
# Lightning P2P port
listen=0.0.0.0:9735

# Allow keysend (spontaneous payments without invoice)
accept-keysend=true

# TLS — add Docker hostname so WARP can connect via https://lnd:8080
tlsextradomain=lnd
tlsextradomain=localhost
tlsextradomain=127.0.0.1
# Also add the Edge server external IP for remote access
tlsextraip=62.171.141.136

# Don't prompt for password on first launch — use these defaults
# (Change in production! Generate with: openssl rand -hex 32)
debuglevel=info
maxlogfiles=5
maxlogfilesize=50

# Auto-unlock wallet on startup (for headless Docker deployment)
# Requires wallet password set via `lncli create` first.
# For production, use --noseedbackup=false and manage seed separately.

[Bitcoin]
# Testnet configuration
bitcoin.testnet=true
bitcoin.mainnet=false
bitcoin.regtest=false

# LND backend connects to bitcoind via ZMQ + RPC
bitcoin.node=bitcoind

[Bitcoind]
# bitcoind RPC connection (testnet)
bitcoind.rpchost=bitcoind:18332
bitcoind.rpcuser=zion
bitcoind.rpcpass=ziontestnetpass
bitcoind.zmqpubrawtx=tcp://bitcoind:28332
bitcoind.zmqpubrawblock=tcp://bitcoind:28333

[protocol]
# Enable optional protocol features for keysend support
protocol.optionalsupport=true

# Wumbo channels (large channels > 0.16 BTC)
protocol.wumbo-channels=true

[autopilot]
# Enable autopilot for automatic channel management (optional)
autopilot.active=false
# autopilot.maxchannels=5
# autopilot.allocation=0.6

[fee]
# Fee estimation
fee.url=https://mempool.space/testnet/api/v1/fees/recommended

[routing]
# Routing configuration
routing.strictgraphpruning=true

# =============================================================================
# Macaroon location after first launch:
#   /root/.lnd/data/chain/bitcoin/testnet/admin.macaroon
#
# To get hex-encoded macaroon for WARP_LN_MACAROON env var:
#   xxd -p -c 1000 /root/.lnd/data/chain/bitcoin/testnet/admin.macaroon
# =============================================================================
