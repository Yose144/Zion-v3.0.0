# =============================================================================
# bitcoind Configuration — ZION WARP Lightning Backend
# =============================================================================
# Bitcoin TESTNET. For mainnet, remove testnet=1 and [test] section.
# =============================================================================

# Network — must be in global section for Bitcoin Core v25+
testnet=1

# RPC server — LND connects here
server=1
rpcuser=zion
rpcpassword=ziontestnetpass
rpcallowip=0.0.0.0/0

# Pruning — keep disk usage low for development (2 GB)
# For mainnet production, set prune=0 (full node) or use a higher value.
prune=2000

# ZMQ — LND subscribes to these for real-time block/tx notifications
zmqpubrawtx=tcp://0.0.0.0:28332
zmqpubrawblock=tcp://0.0.0.0:28333

# Mempool
maxmempool=300

# Connection limits
maxconnections=40

# Logging
debug=net
logips=1

# Disable wallet (LND manages its own wallet; bitcoind only serves as chain backend)
disablewallet=1

# Allow LND to connect via Docker network
listen=1
listenonion=0

# =============================================================================
# Testnet-specific settings (Bitcoin Core v25+ requires [test] section)
# =============================================================================
[test]
rpcport=18332
port=18333
rpcbind=0.0.0.0
