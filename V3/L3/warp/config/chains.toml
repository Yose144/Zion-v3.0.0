# WARP Chain Registry Configuration
# Loaded at runtime by ChainRegistry::from_config()
# Each chain defines: RPC URLs, chain_id (EVM), finality_blocks, enabled status

[ethereum]
family = "evm"
chain_id = 1
finality_blocks = 12
decimals = 18
rpc_urls = [
    "https://eth.llamarpc.com",
    "https://rpc.ankr.com/eth",
]
enabled = true

