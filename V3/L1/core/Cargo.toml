[package]
name = "zion-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "node"
path = "src/bin/node.rs"

[[bin]]
name = "canonical-mainnet-operator-env"
path = "src/bin/canonical-mainnet-operator-env.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
heed.workspace = true
rand.workspace = true
ripemd.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
k256.workspace = true
hex.workspace = true
zeroize.workspace = true
zion-cosmic-harmony = { path = "../cosmic-harmony" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
chrono = "0.4"

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
testnet = []
testnet_fork_rehearsal = ["zion-cosmic-harmony/testnet_fork_rehearsal"]
