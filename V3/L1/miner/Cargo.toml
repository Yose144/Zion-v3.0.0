[package]
name = "zion-miner"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "zion-miner"
path = "src/main.rs"

[features]
default = []
gpu = ["dep:ocl"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
ocl = { version = "0.19", optional = true }
serde_json.workspace = true
zion-core = { path = "../core" }
zion-pool = { path = "../pool" }
