# ──────────────────────────────────────────────────────────────
#  ZION Bridge Relay Configuration — V3 Mainnet (Base)
# ──────────────────────────────────────────────────────────────
#
#  WARNING: Mainnet contracts are NOT deployed yet.
#  This template is configured for 5-of-5 validator multisig.
#  Canonical config: also mirrored in V3/config/bridge-mainnet.toml.
#  Set `enabled = true` only after:
#    - wZION, ZIONBridge, and BridgeValidator are deployed and verified
#    - 5 mainnet validator addresses are provisioned
#    - L1 bridge vault is funded and derivation verified
#
#  Usage: ZION_BRIDGE_CONFIG=V3/L2/bridge/config/bridge-mainnet.toml cargo run -p zion-bridge

[bridge]
name    = "ZION Bridge Relay V3"
version = "3.0.2"
network = "mainnet"

# ── ZION L1 Connection ──────────────────────────────────────
[l1]
rpc_url        = "http://77.42.71.94:8443"
rpc_url_backup = "http://100.76.16.108:8443"
bridge_address = "zion1w0r0a560l3j2y6f3v2f457n2u4d0n5v2g79w0t0"
finality_blocks     = 60
poll_interval_secs  = 15

# ── EVM Chains ──────────────────────────────────────────────

# -- Base Mainnet — NOT DEPLOYED. Replace placeholder addresses after deploy. --
[[evm_chains]]
chain_id                = "base"
name                    = "Base (Mainnet)"
evm_chain_id            = 8453
rpc_url                 = "https://base-rpc.publicnode.com"
rpc_url_backup          = "https://mainnet.base.org"
wzion_address           = "0x0000000000000000000000000000000000000000"  # TODO: replace after deploy
bridge_contract_address = "0x0000000000000000000000000000000000000000"  # TODO: replace after deploy
finality_blocks         = 64
enabled                 = false
gas_strategy            = "eip1559"
max_gas_gwei            = 50
start_block             = 0  # TODO: set to deployment block height

# -- Arbitrum One (Mainnet) — NOT DEPLOYED --
[[evm_chains]]
chain_id                = "arbitrum"
name                    = "Arbitrum One (Mainnet)"
evm_chain_id            = 42161
rpc_url                 = "wss://arb-mainnet.g.alchemy.com/v2/YOUR_KEY"
wzion_address           = "0x0000000000000000000000000000000000000000"
bridge_contract_address = "0x0000000000000000000000000000000000000000"
finality_blocks         = 10
enabled                 = false
gas_strategy            = "eip1559"
max_gas_gwei            = 20

# ── Validator Config ────────────────────────────────────────
[validator]
# 5/5 Guardian multisig — see V3/docs/BRIDGE_MULTISIG.md
# After BridgeValidator.sol deploy, replace the five placeholder addresses
# with real operator addresses and distribute one key per host.
private_key_file = "keys/validator.key"
validator_id     = "validator-1"
threshold        = 5
total_validators = 5
validator_addresses = [
    "0x0000000000000000000000000000000000000001",  # validator-1 (deployer) — REPLACE
    "0x0000000000000000000000000000000000000002",  # validator-2 — REPLACE
    "0x0000000000000000000000000000000000000003",  # validator-3 — REPLACE
    "0x0000000000000000000000000000000000000004",  # validator-4 — REPLACE
    "0x0000000000000000000000000000000000000005",  # validator-5 — REPLACE
]

# ── Security ──────────────────────────────────────────────
[security]
max_single_amount   = "5000000000000000000000000"
daily_limit         = "10000000000000000000000000"
min_bridge_amount   = "100000000000000000000"
timelock_threshold  = "1000000000000000000000000"
max_ops_per_hour    = 100
l1_block_timeout_secs = 300
auto_pause_on_anomaly = true

# ── Database ──────────────────────────────────────────────
[database]
path = "data/bridge-mainnet.db"
backup_interval_secs = 1800

# ── Metrics ───────────────────────────────────────────────
[metrics]
enabled   = true
port      = 9101
log_level = "info"
