# ──────────────────────────────────────────────────────────────────────────────
# ZION Bridge Relay — MAINNET Configuration TEMPLATE
# Target: Base Mainnet (EVM chain ID 8453) ↔ ZION L1 mainnet
# ──────────────────────────────────────────────────────────────────────────────
#
# ⚠️  STATUS: NOT YET DEPLOYED  ⚠️
# This file is a TEMPLATE. Mainnet contracts have NOT been deployed yet.
# All contract addresses below are PLACEHOLDERS.
#
# To activate mainnet:
#   1. Deploy wZION + ZIONBridge + BridgeValidator on Base Mainnet
#   2. Fill in real contract addresses below
#   3. Provision 5 validator keys on separate hosts
#   4. Replace validator_addresses with real addresses
#   5. Set enabled = true
#   6. See: V3/docs/BRIDGE_MAINNET_LAUNCH_CHECKLIST.md
#
# For current testnet operations, use: bridge-testnet.toml

[bridge]
name    = "ZION Bridge Relay"
version = "0.1.0"
network = "mainnet"

# ── ZION L1 ──────────────────────────────────────────────────────────────────

[l1]
rpc_url            = "77.42.71.94:8443"        # Primary L1 JSON-RPC — Edge (Hetzner VPS)
rpc_url_backup     = "100.76.16.108:8443"       # Tailscale VPN fallback
bridge_address     = "zion1w0r0a560l3j2y6f3v2f457n2u4d0n5v2g79w0t0"
finality_blocks    = 60
poll_interval_secs = 15

# ── Ankr Multi-Chain RPC ─────────────────────────────────────────────────────

[ankr]
enabled = true
# api_key = ""   # REQUIRED for mainnet — set ANKR_API_KEY env var (premium tier recommended)

# ── EVM Chains ───────────────────────────────────────────────────────────────

[[evm_chains]]
chain_id                = "base"
name                    = "Base Mainnet"
evm_chain_id            = 8453
rpc_url                 = "https://base-rpc.publicnode.com"
rpc_url_backup          = "https://mainnet.base.org"
# TODO: Replace with real mainnet addresses after deployment
wzion_address           = "0x0000000000000000000000000000000000000000"
bridge_contract_address = "0x0000000000000000000000000000000000000000"
finality_blocks         = 64         # higher finality for mainnet safety
enabled                 = false      # DO NOT enable until real contracts are deployed
gas_strategy            = "eip1559"
max_gas_gwei            = 5          # tight gas cap for mainnet
start_block           = 1

# ── Validator / Multisig ─────────────────────────────────────────────────────
#
# Production: 3-of-5 multisig for all mint/unlock operations.
# Replace placeholder addresses with real secp256k1 operator addresses before
# mainnet launch. Each operator keeps their private key in a separate HSM.
#
# Checklist:
#   1. Provision five validator key files on five separate hosts.
#   2. Replace the five addresses below with real operator addresses.
#   3. Each operator sets their own `validator_id` (validator-1 … validator-5).
#   4. ≥1 week testnet green on metrics.bridge_relayer_missing_signers == 0.
#   5. See `V3/docs/operational/AUDIT_CLOSEOUT_1_THROUGH_6.md` §3.

[validator]
private_key_file    = "/etc/zion/bridge-validator.key"
validator_id        = "validator-1"
# 5-of-5 requires ALL validators to sign. Change to 3 for 3-of-5.
threshold           = 5
total_validators    = 5
validator_addresses = [
    "0x0000000000000000000000000000000000000001",  # validator-1 (deployer)
    "0x0000000000000000000000000000000000000002",  # validator-2
    "0x0000000000000000000000000000000000000003",  # validator-3
    "0x0000000000000000000000000000000000000004",  # validator-4
    "0x0000000000000000000000000000000000000005",  # validator-5
]   # TODO: replace with real operator addresses before mainnet launch

# ── Security ─────────────────────────────────────────────────────────────────

[security]
max_single_amount     = "5000000000000000000000000"    # 5 M wZION
daily_limit           = "10000000000000000000000000"   # 10 M wZION
min_bridge_amount     = "100000000000000000000"        # 100 wZION
timelock_threshold    = "1000000000000000000000000"    # 1 M wZION
max_ops_per_hour      = 100
l1_block_timeout_secs = 300
auto_pause_on_anomaly = true

# ── Database ─────────────────────────────────────────────────────────────────

[database]
path                = "/data/bridge/bridge.db"
backup_interval_secs = 1800     # more frequent backups for mainnet

# ── Metrics ──────────────────────────────────────────────────────────────────

[metrics]
enabled   = true
port      = 9101
log_level = "info"
