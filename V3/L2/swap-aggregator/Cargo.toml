[package]
name = "zion-swap-aggregator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ZION Swap Aggregator — orchestrates bridge lock + Uni V3 swap for one-click ZION↔ETH/USDC swaps"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (for EVM RPC + bridge API)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Crypto
hex = "0.4"
sha3 = "0.10"

# Database (swap state persistence)
rusqlite = { version = "0.31", features = ["bundled"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP server
axum = { version = "0.8", features = ["macros"] }
tower = "0.4"

# Shared types
zion-bridge = { path = "../bridge" }

# Unique IDs
ulid = "1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
