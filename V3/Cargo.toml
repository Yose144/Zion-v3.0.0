[workspace]
members = [
    "L1/cosmic-harmony",
    "L1/core",
    "L1/pool",
    "L1/miner",
    "L1/native-ffi",
]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "MIT"
authors = ["Yose144"]

[workspace.dependencies]
anyhow = "1"
cc = "1.0"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
heed = "0.22"
rand = "0.8"
ripemd = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ctrlc = { version = "3", features = ["termination"] }
thiserror = "2"
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }
