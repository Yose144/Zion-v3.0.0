[workspace]
members = [
    "L1/cosmic-harmony",
    "L1/core",
    "L1/pool",
    "L1/miner",
    "L1/native-ffi",
    "L2/bridge",
    "L2/dao",
    "L2/atomic-swap",
    "L3/ncl",
    "L3/warp",
    "L3/ai-native",
    "cli",
]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "MIT"
authors = ["Yose144"]

[workspace.dependencies]
anyhow = "1"
cc = "1.0"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
heed = "0.22"
rand = "0.8"
ripemd = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
hex = "0.4"
tempfile = "3"
ctrlc = { version = "3", features = ["termination"] }
thiserror = "2"
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }

# ── Release profile: maximum performance ──
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

# Optimize PoW-heavy crates in dev/test builds so mining tests finish
# in reasonable time (Ekam Deeksha v2 scratchpad ops are painfully slow at opt0).
# Bumped 2026-05-02: zion-cosmic-harmony to opt=3 so `find_valid_nonce` and
# `mine_one_block` run at near-release speed in `cargo test --lib` — without
# this many `tests::*` and `tests::e2e_*` cases hang for >5 min in debug,
# forcing them under `#[ignore]`.
[profile.dev.package.zion-cosmic-harmony]
opt-level = 3

[profile.dev.package.zion-core]
opt-level = 1

[profile.test.package.zion-cosmic-harmony]
opt-level = 3

[profile.test.package.zion-core]
opt-level = 1
