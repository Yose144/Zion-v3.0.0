[workspace]
members = [
    "L1/cosmic-harmony",
    "L1/core",
    "L1/pool",
    "L1/miner",
]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "MIT"
authors = ["Yose144"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
