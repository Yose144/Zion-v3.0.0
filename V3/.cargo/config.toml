[build]
# Pouzij vsechna 12 jader, ale nech 2 pro system
jobs = 10
# sccache = cache kompilovanych .rlib souboru (rychlejsi rebuildy)
#rustc-wrapper = "sccache"

[profile.dev]
# Incremental compilation pro rychlejsi rebuildy pri vyvoji
incremental = true
# Odstranit debug info pro rychlejsi linkovani (volitelne)
# debug = 1

[profile.release]
# Thin LTO je rychlejsi nez full LTO, stale dobre optimalizovane
lto = "thin"
# Codegen units = paralelni kompilace release modulu
codegen-units = 8

# Portable x86-64 baseline so the miner runs on every CPU (no SIGILL on older chips).
[target.x86_64-pc-windows-msvc]
# Pokud je nainstalovan lld-link, pouzij ho (mnohem rychlejsi nez link.exe)
# linker = "lld-link.exe"
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]
rustflags = ["-C", "target-cpu=x86-64"]

# Same portable baseline for all x86-64 targets.
[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-cpu=x86-64"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=x86-64"]

# Apple Silicon baseline: arm64-v8 + FP/NEON/CRC/Crypto. Runs on every M* chip.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-a10"]

# Generic ARM64 server baseline (works on Ampere Altra / Jetson / Graviton).
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=generic"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=generic"]
