# New server 62.171.141.136 (post-hard-reset 3.0.4)
# MAINTENANCE MODE — serving static maintenance.html

# ── Main site: zionterranova.com ──────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name zionterranova.com www.zionterranova.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zionterranova.com www.zionterranova.com;

    ssl_certificate /etc/letsencrypt/live/zionterranova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zionterranova.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/zion-maintenance;
    index index.html;

    # Maintenance page — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy → node RPC (8443) — keep RPC accessible
    location /api/rpc {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # DAO API proxy — keep accessible
    location /api/dao {
        proxy_pass http://127.0.0.1:8450;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ── Dashboard: dashboard.zionterranova.com ────────────────────
server {
    if ($host = dashboard.zionterranova.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name dashboard.zionterranova.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.zionterranova.com;
    ssl_certificate /etc/letsencrypt/live/dashboard.zionterranova.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dashboard.zionterranova.com/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
