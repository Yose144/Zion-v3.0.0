# ──────────────────────────────────────────────────────────────
#  ZION Bridge Relay Configuration — V3 Mainnet (Base)
# ──────────────────────────────────────────────────────────────
#
#  WARNING: Mainnet contracts are NOT deployed yet.
#  This template is configured for 5-of-5 validator multisig.
#  Set `enabled = true` only after:
#    - wZION, ZIONBridge, and BridgeValidator are deployed and verified
#    - 5 mainnet validator addresses are provisioned
#    - L1 bridge vault is funded and derivation verified
#
#  Usage: ZION_BRIDGE_CONFIG=V3/config/bridge-mainnet.toml cargo run -p zion-bridge

[bridge]
name    = "ZION Bridge Relay V3"
version = "3.0.2"
network = "mainnet"

# ── ZION L1 Connection ──────────────────────────────────────
[l1]
rpc_url        = "http://127.0.0.1:8443"
rpc_url_backup = "http://100.76.16.108:8443"
bridge_address = "zion1w0r0a560l3j2y6f3v2f457n2u4d0n5v2g79w0t0"
finality_blocks     = 60
poll_interval_secs  = 15

# ── EVM Chains ──────────────────────────────────────────────

# -- Base Mainnet — 5/5 ZIONBridge deployed and wZION BRIDGE_ROLE migrated.
[[evm_chains]]
chain_id                = "base"
name                    = "Base (Mainnet)"
evm_chain_id            = 8453
rpc_url                 = "https://mainnet.base.org"
rpc_url_backup          = "wss://base-mainnet.g.alchemy.com/v2/YOUR_KEY"
wzion_address           = "0x0c493763d107ab0ABb0aee1Ca3999292d8202bb6"
bridge_contract_address = "0x89504D6eD6993d726438E1A9C18aaC79e8d0eF88"
finality_blocks         = 64
enabled                 = true
gas_strategy            = "eip1559"
max_gas_gwei            = 100
start_block             = 47687000  # Set to ~current block at new 5/5 bridge deployment

# -- Arbitrum One (Mainnet) — NOT DEPLOYED --
[[evm_chains]]
chain_id                = "arbitrum"
name                    = "Arbitrum One (Mainnet)"
evm_chain_id            = 42161
rpc_url                 = "wss://arb-mainnet.g.alchemy.com/v2/YOUR_KEY"
wzion_address           = "0x0000000000000000000000000000000000000000"
bridge_contract_address = "0x0000000000000000000000000000000000000000"
finality_blocks         = 10
enabled                 = false
gas_strategy            = "eip1559"
max_gas_gwei            = 20

# ── Validator Config ────────────────────────────────────────
[validator]
# 5/5 Guardian multisig — see V3/docs/BRIDGE_MULTISIG.md
# After BridgeValidator.sol deploy, replace the five placeholder addresses
# with real operator addresses and distribute one key per host.
private_key_file = "keys/validator.key"
validator_id     = "validator-1"
threshold        = 5
total_validators = 5
validator_addresses = [
    "0xdde17506BC2D2dCE1d594bD1D85B0BAbb389D186",  # validator-1 (deployer)
    "0x24d986841E56e5571489B25951eE8C1Ae761FA82",  # validator-2
    "0x665c55eDCF25c2c5A1dfF1B20eE950cBDC58d3d0",  # validator-3
    "0x8E644b3E9FaBf52eE321DC5B3D5AA06d6e3E66C6",  # validator-4
    "0x7e0D2eD71d78B9CFB5034A83333e82e304bc4CB2",  # validator-5
]

# ── Security ──────────────────────────────────────────────
[security]
max_single_amount   = "5000000000000000000000000"
daily_limit         = "10000000000000000000000000"
min_bridge_amount   = "100000000000000000000"
timelock_threshold  = "1000000000000000000000000"
max_ops_per_hour    = 100
l1_block_timeout_secs = 300
auto_pause_on_anomaly = true

# ── Database ──────────────────────────────────────────────
[database]
path = "data/bridge-mainnet.db"
backup_interval_secs = 3600

# ── Metrics ───────────────────────────────────────────────
[metrics]
enabled   = true
port      = 9102
log_level = "info"
