# ZION V3 Mainnet Stack
#
# Runs the full V3 mainnet node + pool + miner on one host.
#
# Bootstrap note: on the **first** host of a fresh chain, set `ZION_SEED_PEERS` empty
# (or unset) so the node does not pull an old network. Additional hosts should list
# the primary P2P (`204.168.245.175:8333` or your coordinator).
#
# Usage:
#   cd V3/docker && cp .env.example .env   # edit .env (miner, tithe, pool payout keys)
#   docker compose -f docker-compose.v3-mainnet.yml up -d
#   docker compose -f docker-compose.v3-mainnet.yml logs -f
#   docker compose -f docker-compose.v3-mainnet.yml down
#
# 89/5/5/0 (burn model) subsidy split: set ZION_HUMANITARIAN_WALLET and
# ZION_ISSOBELLA_WALLET on the node. The 1% pool fee is burned (no wallet).
# The canonical mainnet humanitarian recipient is the premine Children Future Fund.
# For burn-model defaults (repo-pinned canonical `zion1` addresses + payout key), see
# `zion_core::genesis` constants and: `cargo run -p zion-core --release --bin canonical-mainnet-operator-env`

services:
  node:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    image: zion-v3-node:latest
    container_name: zion-v3-node
    restart: unless-stopped
    ports:
      - "8335:8333"   # P2P (changed to avoid conflict with zion-seed-1)
      - "127.0.0.1:8447:8443"   # RPC is host-local only; pool reaches node over the Docker network
      - "8448:8445"   # WebSocket subscriptions
    volumes:
      - zion-node-data:/data/zion
    environment:
      ZION_NODE_ID: "${ZION_NODE_ID:-v3-mainnet-primary}"
      ZION_NODE_STATE_PATH: /data/zion/state
      ZION_P2P_BIND: "0.0.0.0:8333"
      ZION_RPC_BIND: "0.0.0.0:8443"
      ZION_WEBSOCKET_BIND: "0.0.0.0:8445"
      ZION_SEED_PEERS: "${ZION_SEED_PEERS:-}"
      ZION_MINER_ADDRESS: "${ZION_MINER_ADDRESS:-zion1w523a76830x2t5m7f3j023w265e8g5c400a4790}"
      ZION_HUMANITARIAN_WALLET: "${ZION_HUMANITARIAN_WALLET:-zion1s29403j538w6p6n0p783l6w5v6t254c0380c2d4}"
      ZION_ISSOBELLA_WALLET: "${ZION_ISSOBELLA_WALLET:-zion140n8a8t6f3083232r0g6c498r6c0d423f4h9702}"
    networks:
      - zion-v3

volumes:
  zion-node-data:
    driver: local

networks:
  zion-v3:
    name: zion-v3
    driver: bridge
