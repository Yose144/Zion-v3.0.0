# ZION V3 — Unified Docker Compose
#
# Moderní stack s profily:
#   - dev:       development mode (hot reload, debug, verbose logging)
#   - mainnet:   production mainnet stack (node + pool + miner)
#   - monitoring: Prometheus + Grafana + alert manager
#
# Usage:
#   docker compose -f V3/docker/docker-compose.yml --profile mainnet up -d
#   docker compose -f V3/docker/docker-compose.yml --profile dev up -d
#   docker compose -f V3/docker/docker-compose.yml logs -f node
#
# Environment files:
#   cp V3/docker/.env.example V3/docker/.env
#   cp V3/docker/.env.mainnet.example V3/docker/.env.mainnet

services:

  node:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
      args:
        - PROFILE=${BUILD_PROFILE:-release}
    image: zion-v3-node:${TAG:-latest}
    container_name: zion-v3-node
    restart: unless-stopped
    profiles: ["mainnet", "dev"]
    ports:
      - "${P2P_PORT:-8333}:8333"
      - "${RPC_PORT:-8443}:8443"
    volumes:
      - zion-node-data:/data/zion
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - ZION_NODE_ID=${ZION_NODE_ID:-v3-mainnet-local}
      - ZION_NODE_STATE_PATH=/data/zion/state
      - ZION_P2P_BIND=0.0.0.0:8333
      - ZION_RPC_BIND=0.0.0.0:8443
      - ZION_SEED_PEERS=${ZION_SEED_PEERS:-}
      - ZION_MINER_ADDRESS=${ZION_MINER_ADDRESS:-zion1w523a76830x2t5m7f3j023w265e8g5c400a4790}
      - ZION_HUMANITARIAN_WALLET=${ZION_HUMANITARIAN_WALLET:-zion1s29403j538w6p6n0p783l6w5v6t254c0380c2d4}
      - ZION_ISSOBELLA_WALLET=${ZION_ISSOBELLA_WALLET:-zion140n8a8t6f3083232r0g6c498r6c0d423f4h9702}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - zion-v3

  pool:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pool
    image: zion-v3-pool:${TAG:-latest}
    container_name: zion-v3-pool
    restart: unless-stopped
    profiles: ["mainnet", "dev"]
    ports:
      - "${POOL_PORT:-8444}:8444"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - ZION_POOL_BIND=0.0.0.0:8444
      - ZION_NODE_RPC_ADDR=node:8443
      - ZION_POOL_LOOP_COUNT=${POOL_LOOP_COUNT:-1000000}
      - ZION_NONCE_COUNT=${ZION_NONCE_COUNT:-4096}
      - ZION_MAX_SESSIONS_PER_IP=${ZION_MAX_SESSIONS_PER_IP:-10}
      - ZION_HUMANITARIAN_WALLET=${ZION_HUMANITARIAN_WALLET:-zion1s29403j538w6p6n0p783l6w5v6t254c0380c2d4}
      - ZION_ISSOBELLA_WALLET=${ZION_ISSOBELLA_WALLET:-zion140n8a8t6f3083232r0g6c498r6c0d423f4h9702}
      - ZION_POOL_WALLET=${ZION_POOL_WALLET:-zion1l56685k280p364g686j88644g3j4r375755e8p7}
      - ZION_POOL_PAYOUT_SK_HEX=${ZION_POOL_PAYOUT_SK_HEX:?ZION_POOL_PAYOUT_SK_HEX must be set in .env}
    depends_on:
      node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8444/health"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - zion-v3

  miner:
    build:
      context: ..
      dockerfile: docker/${MINER_DOCKERFILE:-Dockerfile.miner}
    image: zion-v3-miner:${TAG:-latest}
    container_name: zion-v3-miner
    restart: unless-stopped
    profiles: ["mainnet", "dev"]
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - ZION_POOL_ADDR=pool:8444
      - ZION_MINER_THREADS=${MINER_THREADS:-2}
      - ZION_LOOP_COUNT=${MINER_LOOP_COUNT:-1000000}
      - ZION_GPU_BACKEND=${ZION_GPU_BACKEND:-cpu}
      - ZION_GPU_WORK_SIZE=${ZION_GPU_WORK_SIZE:-4096}
    depends_on:
      - pool
    # AMD GPU passthrough (OpenCL via /dev/dri); ignored on NVIDIA systems
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    networks:
      - zion-v3

  # ZION OASIS Game Server (L4)
  oasis:
    build:
      context: ..
      dockerfile: docker/Dockerfile.oasis
    image: zion-v3-oasis:${TAG:-latest}
    container_name: zion-v3-oasis
    restart: unless-stopped
    profiles: ["mainnet", "dev"]
    ports:
      - "${OASIS_PORT:-8094}:8094"
    volumes:
      - zion-oasis-data:/data/oasis
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - OASIS_BIND=0.0.0.0
      - OASIS_PORT=8094
      - OASIS_DB=/data/oasis/oasis.db
      - OASIS_HIRAN_URL=http://hiran-inference:8002
      - OASIS_HIRAN_ENABLED=true
    depends_on:
      hiran-inference:
        condition: service_healthy
      node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - zion-v3

  # ZION Free World Humanitarian Layer (L5)
  free-world:
    build:
      context: ..
      dockerfile: docker/Dockerfile.free-world
    image: zion-v3-free-world:${TAG:-latest}
    container_name: zion-v3-free-world
    restart: unless-stopped
    profiles: ["mainnet", "dev"]
    ports:
      - "${FREE_WORLD_PORT:-8095}:8095"
    volumes:
      - zion-free-world-data:/data/free-world
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - FREE_WORLD_BIND=0.0.0.0
      - FREE_WORLD_PORT=8095
      - FREE_WORLD_DB=/data/free-world/free_world.db
      - FREE_WORLD_L1_RPC=node:8443
      - FREE_WORLD_API_KEY=${FREE_WORLD_API_KEY:-}
      - FREE_WORLD_HIRAN_URL=http://hiran-inference:8002
      - FREE_WORLD_HIRAN_ENABLED=true
    depends_on:
      hiran-inference:
        condition: service_healthy
      node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - zion-v3

  # ZION Issobella Space Layer (L6)
  issobella:
    build:
      context: ..
      dockerfile: docker/Dockerfile.issobella
    image: zion-v3-issobella:${TAG:-latest}
    container_name: zion-v3-issobella
    restart: unless-stopped
    profiles: ["mainnet", "dev"]
    ports:
      - "${ISSOBELLA_PORT:-8096}:8096"
    volumes:
      - zion-issobella-data:/data/issobella
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - ISSOBELLA_BIND=0.0.0.0
      - ISSOBELLA_PORT=8096
      - ISSOBELLA_DB=/data/issobella/issobella.db
      - ISSOBELLA_L1_RPC=node:8443
      - ISSOBELLA_API_KEY=${ISSOBELLA_API_KEY:-}
      - ISSOBELLA_HIRAN_URL=http://hiran-inference:8002
      - ISSOBELLA_HIRAN_ENABLED=true
    depends_on:
      hiran-inference:
        condition: service_healthy
      node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - zion-v3

  # Hiran v2.2 Inference Service
  hiran-inference:
    build:
      context: ./hiran-inference
      dockerfile: Dockerfile
    image: zion-hiran-inference:${HIRAN_TAG:-v2.2}
    container_name: zion-hiran-inference
    restart: unless-stopped
    profiles: ["hiran", "mainnet"]
    ports:
      - "${HIRAN_PORT:-8002}:8002"
    volumes:
      - hiran-models:/models
      - hiran-cache:/cache
      - hiran-logs:/logs
    environment:
      - HIRAN_MODEL=${HIRAN_MODEL:-/models/hiran-v2.2-q5_k_m.gguf}
      - HIRAN_BACKEND=${HIRAN_BACKEND:-llama_cpp}
      - HIRAN_DEVICE=${HIRAN_DEVICE:-cuda}
      - HIRAN_HOST=0.0.0.0
      - HIRAN_PORT=8002
      - HIRAN_CTX_SIZE=${HIRAN_CTX_SIZE:-4096}
      - HIRAN_N_GPU_LAYERS=${HIRAN_N_GPU_LAYERS:-99}
      - HIRAN_THREADS=${HIRAN_THREADS:-4}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - zion-v3

  # Monitoring stack (separate profile)
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: zion-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - zion-v3

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: zion-alertmanager
    profiles: ["monitoring"]
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus
    networks:
      - zion-v3

  grafana:
    image: grafana/grafana:11.1.0
    container_name: zion-grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - zion-v3

volumes:
  zion-node-data:
  zion-oasis-data:
  zion-free-world-data:
  zion-issobella-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  hiran-models:
  hiran-cache:
  hiran-logs:

networks:
  zion-v3:
    name: zion-v3
    driver: bridge
