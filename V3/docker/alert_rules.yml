groups:
  - name: zion-pool
    rules:
      - alert: PoolNoMiners
        expr: zion_pool_active_sessions == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No miners connected to pool"
          description: "Pool has had 0 active sessions for 5 minutes."

      - alert: HighShareRejectRate
        expr: >
          (zion_pool_total_submits - zion_pool_total_accepted)
          / zion_pool_total_submits > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Share reject rate above 20%"
          description: "More than 20% of submitted shares are being rejected."

      - alert: PoolDown
        expr: up{job="zion-pool"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pool metrics endpoint unreachable"
          description: "Prometheus cannot scrape the pool /metrics endpoint."

  - name: zion-hiran
    rules:
      - alert: HiranInferenceDown
        expr: up{job="zion-hiran-inference"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Hiran inference service unreachable"
          description: "Prometheus cannot scrape the Hiran inference /metrics endpoint."

      - alert: HiranHighLatency
        expr: >
          histogram_quantile(0.95, rate(hiran_inference_latency_seconds_bucket[5m])) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hiran inference P95 latency above 2s"
          description: "95th percentile inference latency is above 2 seconds."

      - alert: HiranHighErrorRate
        expr: >
          rate(hiran_inference_errors_total[5m]) / rate(hiran_inference_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hiran inference error rate above 5%"
          description: "More than 5% of inference requests are failing."

      - alert: HiranGpuMemoryHigh
        expr: >
          hiran_gpu_memory_used_bytes / hiran_gpu_memory_total_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hiran GPU memory usage above 90%"
          description: "GPU VRAM is nearly exhausted, may cause OOM errors."

      - alert: HiranGpuUtilizationLow
        expr: >
          hiran_gpu_utilization_percent < 10
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Hiran GPU utilization below 10%"
          description: "GPU is underutilized, consider scaling down or consolidating workloads."

  - name: zion-host
    rules:
      - alert: HighCpuUsage
        expr: >
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage above 90%"

      - alert: HighMemoryUsage
        expr: >
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage above 90%"

      - alert: DiskSpaceLow
        expr: >
          (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Root disk usage above 85%"
