# ZION V3 Alertmanager Configuration
# Copy to V3/docker/alertmanager/alertmanager.yml and mount into alertmanager container.
#
# Quick test:
#   curl -X POST http://localhost:9093/api/v1/alerts \
#     -H 'Content-Type: application/json' \
#     -d '[{"labels":{"alertname":"TestAlert","severity":"critical"},"annotations":{"summary":"Test from Alertmanager"}}]'

global:
  resolve_timeout: 5m
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'alerts@zionterranova.com'
  # smtp_auth_username: 'alerts@zionterranova.com'
  # smtp_auth_password: '${SMTP_PASSWORD}'  # Use env file or secret; AM does not expand $VAR in yml

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'default'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'
      continue: true

# ── Inhibition rules ──────────────────────────────────────────────────────
# If CoreNode1Down is critical, suppress warning-level peer alerts on the same instance.
inhibit_rules:
  - source_match:
      severity: 'critical'
      alertname: 'CoreNode1Down'
    target_match:
      severity: 'warning'
    equal: ['instance']

  - source_match:
      severity: 'critical'
      alertname: 'PoolDown'
    target_match:
      severity: 'warning'
      alertname: 'PoolNoConnections'
    equal: ['instance']

# ── Receivers ─────────────────────────────────────────────────────────────
receivers:
  # ═══ DEFAULT ═══
  # Out of the box: local webhook receiver for testing.
  # This logs every alert to a local file via scripts/alertmanager-webhook-receiver.py
  - name: 'default'
    webhook_configs:
      - url: 'http://host.docker.internal:9999/webhook'
        send_resolved: true

  # ═══ CRITICAL ═══
  # Route critical alerts to both the local log AND your real channel.
  # When ready, uncomment one block and replace the placeholder URL/key.
  - name: 'critical'
    webhook_configs:
      - url: 'http://host.docker.internal:9999/webhook'
        send_resolved: true

    # ── Discord (preferred — used in previous ZION ops) ──
    # To activate:
    #   1. Set DISCORD_WEBHOOK_URL in V3/docker/.env
    #   2. Run: docker compose -f V3/docker/docker-compose.yml restart alertmanager
    # discord_configs:
    #   - webhook_url: 'YOUR_DISCORD_WEBHOOK_URL'
    #     title: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    #     message: |
    #       {{ range .Alerts }}
    #       **{{ .Annotations.summary }}**
    #       {{ .Annotations.description }}
    #       {{ end }}
    #     send_resolved: true

    # ── Slack ──
    # slack_configs:
    #   - api_url: 'YOUR_SLACK_WEBHOOK_URL'
    #     channel: '#zion-alerts'
    #     send_resolved: true
    #     title: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'

    # ── Email ──
    # email_configs:
    #   - to: 'oncall@zionterranova.com'
    #     subject: '[ZION CRITICAL] {{ .GroupLabels.alertname }}'
    #     html: |
    #       <h3>{{ .GroupLabels.alertname }}</h3>
    #       <ul>{{ range .Alerts }}<li>{{ .Annotations.description }}</li>{{ end }}</ul>
    #     send_resolved: true

  # ═══ WARNING ═══
  # Warnings go to the local log by default. Uncomment a channel when ready.
  - name: 'warning'
    webhook_configs:
      - url: 'http://host.docker.internal:9999/webhook'
        send_resolved: true

    # ── Discord ──
    # See critical receiver for activation instructions.
    # discord_configs:
    #   - webhook_url: 'YOUR_DISCORD_WEBHOOK_URL'
    #     title: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    #     send_resolved: true

    # ── Slack ──
    # slack_configs:
    #   - api_url: 'YOUR_SLACK_WEBHOOK_URL'
    #     channel: '#zion-alerts'
    #     send_resolved: true

    # ── Email ──
