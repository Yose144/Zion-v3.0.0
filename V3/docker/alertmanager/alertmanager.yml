# ZION V3 Alertmanager Configuration
# Copy to V3/docker/alertmanager/alertmanager.yml and mount into alertmanager container.

global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'
      continue: true

receivers:
  - name: 'default'
    # Placeholder: replace with your actual notification channel (email, slack, webhook, etc.)
    # Example webhook:
    # webhook_configs:
    #   - url: 'http://your-webhook-endpoint/zion-alerts'
    #     send_resolved: true

  - name: 'critical'
    # Duplicate of default until a real channel is configured.
    # To activate: uncomment webhook_configs or add email_configs / slack_configs.

  - name: 'warning'
    # Duplicate of default until a real channel is configured.

