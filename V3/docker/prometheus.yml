global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: zion-pool
    metrics_path: /metrics
    static_configs:
      - targets:
          - pool:9550
        labels:
          instance: zion-v3-pool

  - job_name: zion-hiran-inference
    metrics_path: /metrics
    static_configs:
      - targets:
          - hiran-inference:8002
        labels:
          instance: zion-hiran-v2.2
    scrape_interval: 30s

  - job_name: zion-node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          instance: zion-v3-host
