global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # When running natively on the host (Windows / Linux), use host.docker.internal.
  # When running fully in Docker, replace host.docker.internal with service names (node, pool, etc.).

  - job_name: zion-core-node1
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9115
        labels:
          instance: core-node1
          role: core

  - job_name: zion-core-node2
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9116
        labels:
          instance: core-node2
          role: core

  - job_name: zion-pool
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8455
        labels:
          instance: core-pool
          role: pool

  # Hiran inference runs on LOCAL PC (Windows), not Edge server.
  # Uncomment and update IP if you want Edge Prometheus to scrape it.
  # - job_name: zion-hiran-inference
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets:
  #         - 127.0.0.1:8002
  #       labels:
  #         instance: zion-hiran-v2.2
  #   scrape_interval: 30s

  - job_name: zion-node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          instance: zion-v3-host
