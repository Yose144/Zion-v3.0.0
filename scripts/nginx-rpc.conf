# ZION V3 — Public Read-Only RPC via nginx
# Add this as a new server block or include in existing site.
# Proxies public port 8443 → localhost:8447 (Python read-only filter proxy)

server {
    listen 8443;
    listen [::]:8443;
    server_name _;

    # Rate limiting zone (requires nginx 'limit_req_zone' in http context)
    # limit_req_zone $binary_remote_addr zone=rpc:10m rate=10r/s;
    # limit_req zone=rpc burst=20 nodelay;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type";

    location /jsonrpc {
        proxy_pass http://127.0.0.1:8447/jsonrpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
