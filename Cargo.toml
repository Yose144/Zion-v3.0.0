# Root workspace manifest.
# V3 has been archived to archive/V3/ and AuXpow has been merged into V31.
# The active Mainnet Alpha workspace is in V31/Cargo.toml.
# Use `cd V31 && cargo ...` for all builds, tests, and releases.
[package]
name = "zion-root"
version = "3.1.0-alpha.2"
edition = "2021"
license = "MIT"
publish = false
description = "Repository root meta-package; active workspace is in V31/"

[workspace]
members = ["."]
resolver = "2"

[workspace.package]
version = "3.0.7"
edition = "2021"
license = "MIT"
authors = ["Yose144"]

[workspace.dependencies]
anyhow = "1"
bincode = "1"
cc = "1.0"
blake3 = "1"
blake2 = "0.10"
sha3 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
heed = "0.22"
rand = "0.8"
ripemd = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
hex = "0.4"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
ctrlc = { version = "3", features = ["termination"] }
thiserror = "2"
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }
bip39 = "2"
hmac = "0.12"
pbkdf2 = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
