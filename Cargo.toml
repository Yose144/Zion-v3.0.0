[workspace]
members = [
    # ═══════════════════════════════════════════════
    # L1 — BLOCKCHAIN CORE (🔒 LOCK pro MainNet)
    # ═══════════════════════════════════════════════
    "L1/core",
    "L1/pool",
    "L1/miner",
    "L1/cosmic-harmony",
    "L1/native-libs/verushash-native",

    # ═══════════════════════════════════════════════
    # L2 — DeFi & GOVERNANCE
    # ═══════════════════════════════════════════════
    "L2/bridge",        # wZION EVM bridge relay (Rust)
    "L2/dao",           # DAO governance + humanitarian fund
    "L2/atomic-swap",   # HTLC atomic-swap daemon (cross-chain trustless swaps)
    # L2/contracts/     # wZION Solidity (non-Cargo, Hardhat)

    # ═══════════════════════════════════════════════
    # L3 — WARP & AI
    # ═══════════════════════════════════════════════
    "L3/warp",          # multi-chain bridge (7 chains)
    "L3/ncl",           # Neural Compute Layer
    "L3/ai-native",     # AI agent orchestration

    # ═══════════════════════════════════════════════
    # L4 — OASIS GAME WORLD
    # ═══════════════════════════════════════════════
    "L4/oasis",         # consciousness mining game
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[workspace.package]
version = "2.9.6"
edition = "2021"
authors = ["ZION Core Team <contact@zionterranova.com>"]
license = "MIT"
repository = "https://github.com/Yose144/2.9.6"
