# Kingdom — jeden klient ekosystému.
#
# Produkční vhost (EDGE2). Port 80 → 301 na HTTPS, 443 terminuje TLS.
# Bloky `# managed by Certbot` generuje certbot — needituj je ručně,
# jen po renew znovu zkopíruj tento soubor ze serveru do repa:
#   ssh zion-edge2 'cat /etc/nginx/sites-enabled/kingdom.zionterranova.com.conf'
#
# Cert: kingdom.zionterranova.com, platí do 2027-01-30 (certbot.timer 2×/den).

server {
    server_name kingdom.zionterranova.com;

    access_log /var/log/nginx/kingdom.access.log;
    error_log  /var/log/nginx/kingdom.error.log;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kingdom.zionterranova.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kingdom.zionterranova.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = kingdom.zionterranova.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name kingdom.zionterranova.com;
    return 404; # managed by Certbot


}