# Kingdom — jeden klient ekosystému.
#
# Produkční vhost (EDGE2). Port 80 → 301 na HTTPS, 443 terminuje TLS.
# Bloky `# managed by Certbot` generuje certbot — needituj je ručně,
# jen po renew znovu zkopíruj tento soubor ze serveru do repa:
#   ssh zion-edge2 'cat /etc/nginx/sites-enabled/kingdom.zionterranova.com.conf'
#
# Cert: kingdom.zionterranova.com, platí do 2027-01-30 (certbot.timer 2×/den).

server {
    server_name kingdom.zionterranova.com;

    access_log /var/log/nginx/kingdom.access.log;
    error_log  /var/log/nginx/kingdom.error.log;

    # Vast-rigs dashboard — live status.json.
    #
    # Archivovaný dashboard fetchuje `/vast-rigs/status.json` (absolutní cesta
    # z éry apexu). Daemon na zion-v6 scp-pushuje živý soubor do
    # /var/www/zion-maintenance — servírujeme ho i na archivní cestě, jinak by
    # archiv navždy ukazoval zmrazený snapshot a /vast-rigs/status.json padalo
    # do Nextu jako 404.
    location = /vast-rigs/status.json {
        alias /var/www/zion-maintenance/vast-rigs/status.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
    location = /archive/v3/vast-rigs/status.json {
        alias /var/www/zion-maintenance/vast-rigs/status.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    # /vast-ops/ root = jen auth brána — po basic auth landing na archivovaný
    # React dashboard (jeho ops callům stačí cacheované credentials). Legacy
    # vastctl UI zůstává na /vast-ops/<libovolná-cesta>.
    # POZOR: `return` běží ve rewrite fázi PŘED auth_basic — proto auth nejdřív
    # projde try_files → named location, teprve tam je redirect.
    location = /vast-ops {
        return 301 /vast-ops/;
    }
    location = /vast-ops/ {
        auth_basic "zion ops";
        auth_basic_user_file /etc/nginx/.htpasswd-vast;
        try_files /vast-ops-never-exists @vast_ops_root;
    }
    location @vast_ops_root {
        return 302 /archive/v3/vast-rigs/;
    }
    # vastctl ops API — stejný backend jako na apexu (reverse-tunnel :8088).
    #
    # Archivovaný dashboard volá `/vast-ops/api/*` absolutně (cesty z éry apexu).
    # Bez tohoto bloku request spadne do `location /` → Next → 404 a market/AI
    # panely na /archive/v3/vast-rigs/ nefungují. Blok je záměrně stejný jako
    # v zionterranova.com.conf: auth_basic, proxy bez X-Real-IP (app bez něj
    # považuje volání za lokální) a X-Ops-Auth 1 nastavuje nginx až PO auth.
    # POZOR: blok žije na serveru od 2026-11-08 — drž ho i tady, jinak ho
    # deploy-kingdom.sh scp přepíše a ops API na kingdom doméně umře.
    location /vast-ops/ {
        auth_basic "zion ops";
        auth_basic_user_file /etc/nginx/.htpasswd-vast;
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Ops-Auth 1;
        proxy_read_timeout 120s;
    }

    # Archiv v3 — staticky, mimo Next.
    #
    # Archiv je export IntroPage s `trailingSlash: true` (stránky jsou
    # `blog/index.html`). Next adresářové URL neservíruje — `/archive/v3/blog/`
    # by vrátil 308 na `/blog` a to je 404. Starý apex to uměl přes
    # `try_files $uri $uri/`, a přesně to potřebujeme, jinak staré odkazy po
    # F6 redirectu skončí v 404. Celý archiv obsluhuje nginx, Next o něm neví.
    location ^~ /archive/v3/ {
        root /opt/zion/APP&WEB/kingdom/current/public;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kingdom.zionterranova.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kingdom.zionterranova.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = kingdom.zionterranova.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name kingdom.zionterranova.com;
    return 404; # managed by Certbot


}