# Archiv v3 — staticky, mimo Next.
#
# Proč: Archiv je statický export IntroPage s `trailingSlash: true`, takže
# stránky jsou `blog/index.html`, `amenti/index.html`, … Next (které servíruje
# zbytek Kingdomu) adresářové URL neservíruje: `/archive/v3/blog/` vrátí 308 na
# `/archive/v3/blog` a to je 404. Starý apex to uměl přes `try_files $uri $uri/`,
# a přesně to potřebujeme znovu — jinak staré odkazy po redirectu skončí v 404.
#
# Vkládá se do vhostu kingdom.zionterranova.com PŘED `location /`.
location ^~ /archive/v3/ {
    root /opt/zion/APP&WEB/kingdom/current/public;
    index index.html;
    try_files $uri $uri/ =404;

    # Archiv se nemění — ale není immutable (build může přinést novou verzi),
    # proto hodina, ne rok.
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
}
