# F6 — stáčené (STAGED, NEAKTIVNÍ) redirecty pro zhasnutí starých povrchů
#
# TENTO SOUBOR NENÍ ZAPNUTÝ. Je to návrh k review; aktivace = 👤.
# Cílem F6 je jeden vstup (Kingdom) a 301 ze starých hostname na portály,
# ale **jen tam, kde existuje náhrada** (§3 plánu: „všechny veřejné stránky
# mají náhradu v portálu").
#
# Zapnutí (až po schválení):
#   bash Kingdom/infra/deploy/enable-redirect.sh pool
# Vrácení:
#   bash Kingdom/infra/deploy/rollback-redirect.sh pool
#
# Každý blok je samostatný soubor v Kingdom/infra/nginx/redirects/:
#   pool.zionterranova.com.conf
#   freeworld.zionterranova.com.conf
#   apex.zionterranova.com.conf
#
# Co tu ZÁMĚRNĚ NENÍ: oasis., nirvana., explorer. — nemají v Kingdomu náhradu
# (viz tabulka v docs/3.2/F6-REDIRECT-MAP.md). Redirect by je rozbil.

# ---------------------------------------------------------------------------
# 1) pool.zionterranova.com → kingdom.zionterranova.com/portal/pool
#
# Čtecí parita je 100 % (Kovárna: mince, těžaři, historie, výplaty, detail
# těžaře, štěstí, bloky). Zůstává jediná výjimka: operátorské /ops/ (basic auth)
# — to se musí přesunout na dashboard., jinak operátor ztratí cestu.
server {
    listen 80;
    listen [::]:80;
    server_name pool.zionterranova.com;

    # Operátorský povrch zůstává (přesměrovat ho by uzamklo operátora ven).
    location /ops/ {
        # NOTE: při zapnutí zkopírovat sem původní blok z pool vhostu
        # (auth_basic + proxy na pool API). Do té doby redirect NENÍ připraven.
        return 503;
    }

    location /public/v1/ {
        # API potřebuje jakýkoli konzument (i po redirectu webu).
        # NOTE: zkopírovat původní proxy blok; 503 = záměrná pojistka.
        return 503;
    }

    location / {
        return 301 https://kingdom.zionterranova.com/portal/pool$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 2) freeworld.zionterranova.com → kingdom.zionterranova.com/portal/freeworld
#
# Povrch je jediná stránka (projekty/granty se na něm vykreslují klientsky).
# Přístav ukazuje fond, granty i projekty server-side → parita OK.
server {
    listen 80;
    listen [::]:80;
    server_name freeworld.zionterranova.com;

    location / {
        return 301 https://kingdom.zionterranova.com/portal/freeworld$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 3) apex zionterranova.com → kingdom.zionterranova.com (Brána)
#
# ⚠️ NENÍ PŘIPRAVENO: apex dnes servíruje IntroPage (48 statických stránek —
# blog, seeds, legal). Brána má obsah landingu, ale ne blog/články.
# Než se apex přepne, musí mít ty stránky domov (app. nebo /blog v Kingdomu).
server {
    listen 80;
    listen [::]:80;
    server_name zionterranova.com www.zionterranova.com;

    # Výjimky, které musí zůstat dostupné (certbot, health, soubory z apexu).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # NOTE: zapnout až po rozhodnutí o blog/seeds (viz F6 mapa, sekce apex).
        return 503;
    }
}
