# ╔══════════════════════════════════════════════════════════════╗
# ║  ZION V3 MainNet — Unified Production Stack                  ║
# ║  L1 (core, pool, miner, seed, redis)                         ║
# ║  L2 (bridge, swap, dao)                                      ║
# ║  L3 (ai-native, warp/ncl control plane)                      ║
# ║  Web (website, stability-collector)                           ║
# ║  Monitoring (prometheus, grafana, exporters, alertmanager)    ║
# ╚══════════════════════════════════════════════════════════════╝
#
# All V3 binaries use env-var config (from_env()), NOT CLI args.
# Usage: docker compose -f docker/docker-compose.v3-mainnet.yml --env-file .env up -d --build
#
# Requires .env with: REDIS_PASSWORD, MINER_WALLET, MINER_WORKER,
#   ZION_POOL_WALLET, ZION_POOL_PAYOUT_SK_HEX
# Optional .env: SEED_PEERS, MINER_CPUS, GRAFANA_ADMIN_PASSWORD
#
# Profiles:
#   default  — L1 core stack + L3 agent (core, pool, miner, redis, seed1, ai-native)
#   l2       — Bridge, Swap, DAO
#   web      — Website + stability collector
#   monitor  — Prometheus, Grafana, exporters, alertmanager

services:
  # ════════════════════════════════════════════════════════════
  # L1 — Core Node
  # ════════════════════════════════════════════════════════════
  core:
    build:
      context: ../V3
      dockerfile: ../docker/Dockerfile.v3.core
    image: zion-core:v3-mainnet
    container_name: zion-core
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: host
    volumes:
      - zion-data:/data/zion
    tmpfs:
      - /tmp
    environment:
      - RUST_LOG=info
      - ZION_NETWORK=mainnet
      - ZION_NODE_ID=${NODE_ID:-v3-mainnet-0}
      - ZION_NODE_STATE_PATH=/data/zion/chain_state.json
      - ZION_P2P_BIND=0.0.0.0:8333
      - ZION_RPC_BIND=0.0.0.0:8443
      - ZION_POOL_BIND=0.0.0.0:8444
      - ZION_METRICS_BIND=0.0.0.0:9115
      - ZION_SEED_PEERS=${SEED_PEERS:-91.98.122.165:8333}
      # Coinbase 89% goes to pool wallet; pool re-distributes via PPLNS.
      - ZION_MINER_ADDRESS=${ZION_POOL_WALLET}
      - ZION_HUMANITARIAN_WALLET=${HUMANITARIAN_WALLET:-zion1m4v5z8z850u480c5c208z274e334369275n5y20}
      - ZION_ISSOBELLA_WALLET=${ISSOBELLA_WALLET:-zion170a374s6h390k7w244m5c4f354v8n4678844655}
      - ZION_POOL_FEE_WALLET=${POOL_FEE_WALLET:-zion1y5u653y3w4z7p5r3l034y0q6u06542a426z77j7}
      # Bridge validator pubkeys (comma-separated, secp256k1 hex)
      - ZION_BRIDGE_VALIDATOR_PUBKEYS=${BRIDGE_VALIDATOR_PUBKEYS:-}
      - ZION_BRIDGE_VALIDATOR_THRESHOLD=${BRIDGE_VALIDATOR_THRESHOLD:-3}
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 8G
        reservations:
          cpus: '0.25'
          memory: 2G

  seed1:
    image: zion-core:v3-mainnet
    container_name: zion-seed-1
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      core:
        condition: service_healthy
    extra_hosts:
      - "core:host-gateway"
    volumes:
      - seed1-data:/data/zion
    tmpfs:
      - /tmp
    environment:
      - RUST_LOG=info
      - ZION_NETWORK=mainnet
      - ZION_NODE_ID=${SEED_NODE_ID:-v3-seed-1}
      - ZION_NODE_STATE_PATH=/data/zion/chain_state.json
      - ZION_P2P_BIND=0.0.0.0:8333
      - ZION_RPC_BIND=0.0.0.0:8443
      - ZION_SEED_PEERS=core:8333
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 4G
    networks:
      - zion-net

  pool:
    build:
      context: ../V3
      dockerfile: ../docker/Dockerfile.v3.pool
    image: zion-pool:v3-mainnet
    container_name: zion-pool
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "3333:3333"   # Stratum
      - "8080:8080"   # Pool API
    volumes:
      - pool-data:/data/zion-pool
    tmpfs:
      - /tmp
    depends_on:
      core:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "core:host-gateway"
    environment:
      - RUST_LOG=info
      - ZION_POOL_BIND=0.0.0.0:3333
      - ZION_NODE_RPC_ADDR=core:8443
      - ZION_ROUTING_METRICS_BIND=0.0.0.0:8080
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - ZION_REVENUE_SOURCE=zion
      - ZION_REVENUE_USD=1.25
      - ZION_POOL_LOOP_COUNT=4294967295
      - ZION_NONCE_COUNT=100000
      - ZION_NONCE_STRIDE=100000
      - ZION_START_NONCE=${ZION_START_NONCE:-0}
      - ZION_JOB_TTL_MS=1200000
      - ZION_SESSION_READ_TIMEOUT_SECS=1200
      - ZION_HAS_GPU=0
      # Protocol fees (5/5/1) are handled by core coinbase. Pool PPLNS
      # receives only the miner share (89%). Set ZION_POOL_FEE_PCT for
      # an optional extra pool-operator fee on top of protocol split.
      - ZION_HUMANITARIAN_TITHE_PCT=0
      - ZION_ISSOBELLA_FUND_PCT=0
      - ZION_POOL_FEE_PCT=${ZION_POOL_FEE_PCT:-0}
      - ZION_POOL_WALLET=${ZION_POOL_WALLET}
      - ZION_POOL_PAYOUT_SK_HEX=${ZION_POOL_PAYOUT_SK_HEX}
      - ZION_POOL_PAYOUT_FEE_FLOWERS=${ZION_POOL_PAYOUT_FEE_FLOWERS:-10000}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3333"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 4G
        reservations:
          cpus: '0.10'
          memory: 512M
    networks:
      - zion-net

  miner:
    build:
      context: ../V3
      dockerfile: ../docker/Dockerfile.v3.miner
    image: zion-miner:v3-mainnet
    container_name: zion-miner
    restart: unless-stopped
    expose:
      - "9116"
    environment:
      - RUST_LOG=info
      - ZION_POOL_ADDR=pool:3333
      - ZION_MINER_ID=${MINER_WALLET}
      - ZION_WORKER_NAME=${MINER_WORKER:-mainnet-miner}
      - ZION_MINER_METRICS_BIND=0.0.0.0:9116
      - ZION_NONCE_AUTOTUNE=true
      - ZION_LOOP_COUNT=4294967295
      - ZION_NONCE_COUNT=100000
      - ZION_JOB_TTL_MS=1200000
      - ZION_RECONNECT=true
      - ZION_MAX_RECONNECT=0
      - ZION_MINER_VERBOSE=1
      - ZION_READ_TIMEOUT_SECS=1200
    depends_on:
      pool:
        condition: service_started
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /dev/hugepages:/dev/hugepages
    cpus: ${MINER_CPUS:-0.25}
    networks:
      - zion-net

  redis:
    image: redis:7-alpine
    container_name: zion-redis
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 1G
    networks:
      - zion-net

  # ════════════════════════════════════════════════════════════
  # L2 — Bridge, Swap, DAO
  # ════════════════════════════════════════════════════════════
  bridge:
    build:
      context: ../V3
      dockerfile: docker/Dockerfile.bridge
    image: zion-v3-bridge:latest
    container_name: zion-v3-bridge
    restart: unless-stopped
    network_mode: host
    profiles: ["l2"]
    volumes:
      - bridge-data:/data/bridge
      - ../V3/L2/bridge/config:/etc/zion:ro
    environment:
      ZION_BRIDGE_CONFIG: "${ZION_BRIDGE_CONFIG:-/etc/zion/bridge-testnet.toml}"
      RUST_LOG: "zion_bridge=debug,info"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9101/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  swap:
    build:
      context: ../V3
      dockerfile: docker/Dockerfile.swap
    image: zion-v3-swap:latest
    container_name: zion-v3-swap
    restart: unless-stopped
    network_mode: host
    profiles: ["l2"]
    volumes:
      - swap-data:/data/atomic-swap
      - ../V3/L2/atomic-swap/config:/etc/zion:ro
    environment:
      RUST_LOG: "zion_atomic_swap=debug,info"
      ZION_SWAP_ESCROW_KEY: "${ZION_SWAP_ESCROW_KEY:-}"
    command: ["--config", "${ZION_SWAP_CONFIG:-/etc/zion/swap-testnet.toml}"]
    depends_on:
      bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8888/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  dao:
    build:
      context: ../V3
      dockerfile: docker/Dockerfile.dao
    image: zion-v3-dao:latest
    container_name: zion-v3-dao
    restart: unless-stopped
    network_mode: host
    profiles: ["l2"]
    volumes:
      - dao-data:/data/dao
      - ../V3/L2/dao/config:/etc/zion:ro
    environment:
      DAO_CONFIG: "${ZION_DAO_CONFIG:-/etc/zion/dao-testnet.toml}"
      RUST_LOG: "zion_dao=debug,info"
    depends_on:
      bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/api/dao/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ════════════════════════════════════════════════════════════
  # L3 — AI Native
  # ════════════════════════════════════════════════════════════
  ai-native:
    build:
      context: ../V3
      dockerfile: ../docker/Dockerfile.v3.ai-native
    image: zion-ai-native:v3-mainnet
    container_name: zion-ai-native
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp
    depends_on:
      core:
        condition: service_healthy
      pool:
        condition: service_started
    environment:
      - RUST_LOG=info
      - HIRANYAGARBHA_BIND=0.0.0.0:8001
      - HIRANYAGARBHA_BACKEND=${HIRANYAGARBHA_BACKEND:-auto}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-zion-expert}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - ZION_NODE_RPC_ADDR=host.docker.internal:8443
      - ZION_POOL_API_URL=http://host.docker.internal:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8001/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 768M
        reservations:
          cpus: '0.10'
          memory: 128M
    networks:
      - zion-net

  # ════════════════════════════════════════════════════════════
  # Web — Website + Stability Collector
  # ════════════════════════════════════════════════════════════
  website:
    build:
      context: ../APP&WEB/website-v2.9
      dockerfile: Dockerfile.production
    image: zion-website:2.9.9
    container_name: zion-website
    restart: unless-stopped
    profiles: ["web"]
    ports:
      - "3000:3000"
    volumes:
      - ../ops/mainnet-stability-run:/data/mainnet-stability-run:ro
      - /opt/zion/downloads:/opt/zion/downloads:ro
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - ZION_DOWNLOADS_DIR=/opt/zion/downloads
      - BRIDGE_METRICS_URL=http://host.docker.internal:9101/metrics
      - PROMETHEUS_URL=http://zion-prometheus:9090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      - "com.zion.service=website"
      - "com.zion.version=2.9.9"
    networks:
      - zion-net

  stability-collector:
    image: node:22-alpine
    container_name: zion-mainnet-stability-collector
    restart: unless-stopped
    profiles: ["web"]
    working_dir: /workspace
    command: >
      sh -lc "mkdir -p /workspace/ops/mainnet-stability-run
      && node scripts/mainnet_stability_collector.mjs --interval-sec 60 >> /workspace/ops/mainnet-stability-run/collector.log 2>&1"
    volumes:
      - ../scripts:/workspace/scripts:ro
      - ../ops:/workspace/ops
    labels:
      - "com.zion.service=mainnet-stability-collector"
    networks:
      - zion-net

  # ════════════════════════════════════════════════════════════
  # Monitoring — Prometheus, Grafana, Exporters, Alertmanager
  # ════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: zion-prometheus
    restart: unless-stopped
    profiles: ["monitor"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.enable-lifecycle"
      - "--web.external-url=http://localhost:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    networks:
      - zion-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "com.zion.service=prometheus"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: zion-grafana
    restart: unless-stopped
    profiles: ["monitor"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://zionterranova.com/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_DOMAIN=zionterranova.com
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/zion-pool-overview.json
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - zion-net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "com.zion.service=grafana"

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: zion-node-exporter
    restart: unless-stopped
    profiles: ["monitor"]
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.netclass.ignored-devices=^(veth|docker|br-).*$$"
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks:
      - zion-net
    labels:
      - "com.zion.service=node-exporter"

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: zion-redis-exporter
    restart: unless-stopped
    profiles: ["monitor"]
    environment:
      - REDIS_ADDR=redis://zion-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    networks:
      - zion-net
    depends_on:
      - prometheus
    labels:
      - "com.zion.service=redis-exporter"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: zion-alertmanager
    restart: unless-stopped
    profiles: ["monitor"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://localhost:9093"
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - zion-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "com.zion.service=alertmanager"

volumes:
  zion-data:
  seed1-data:
  pool-data:
  redis-data:
  bridge-data:
  swap-data:
  dao-data:
  prometheus-data:
    name: zion-prometheus-data
  grafana-data:
    name: zion-grafana-data
  alertmanager-data:
    name: zion-alertmanager-data

networks:
  zion-net:
    name: zion-net
    driver: bridge
