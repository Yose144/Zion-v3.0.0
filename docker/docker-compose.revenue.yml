# ═══════════════════════════════════════════════════════════════
# ZION Revenue Stack — Fáze 1 (v5 final — MoneroOcean ARM64)
# CPU mining na MoneroOcean (auto profit-switch: XMR/ZEPH/DERO/...)
# Bandwidth nody: Mysterium + NKN
#
# Payout: MoneroOcean auto-switch XMR wallet
#   Dashboard: https://moneroocean.stream/#/dashboard?addr=42m86RBWf4PeuRf8P5...
#
# Deploy:
#   Helsinki: COMPOSE_PROFILES=helsinki docker compose -p zion-revenue \
#             -f docker/docker-compose.revenue.yml up -d --force-recreate
#   Germany:  COMPOSE_PROFILES=germany  docker compose -p zion-revenue \
#             -f docker/docker-compose.revenue.yml up -d --force-recreate
#
# POZOR: xmrig se kompiluje z source (~10-15 min prvni spusteni).
# Binarka se ulozi do volume zion-xmrig-cache a znovu se nebuiluje.
# ═══════════════════════════════════════════════════════════════

version: '3.8'

services:

  # ─── DERO-MINER ─────────────────────────────────────────────
  # 2T, oba servery, MoneroOcean autoswitch XMR/DERO/ZEPH/...
  # Buduje xmrig binárku a ukládá do sdíleného volume
  # ─────────────────────────────────────────────────────────────
  dero-miner:
    image: ubuntu:22.04
    container_name: zion-dero-miner
    restart: unless-stopped
    entrypoint: /bin/bash
    volumes:
      - zion-xmrig-cache:/opt/xmrig-bin
    command:
      - -c
      - |
        if [ ! -f /opt/xmrig-bin/xmrig ]; then
          echo "[ZION] Building xmrig (ARM64 first run ~10-15 min)..."
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates libssl-dev libhwloc-dev libuv1-dev
          update-ca-certificates
          git clone --depth=1 --branch=v6.21.3 https://github.com/xmrig/xmrig.git /opt/xmrig-src
          cmake -S /opt/xmrig-src -B /opt/xmrig-src/build \
            -DCMAKE_BUILD_TYPE=Release -DWITH_OPENCL=OFF -DWITH_CUDA=OFF
          cmake --build /opt/xmrig-src/build --parallel $$(nproc) 2>&1 | grep -c '\[' | xargs -I{} echo "[ZION] Build {} steps done"
          cp /opt/xmrig-src/build/xmrig /opt/xmrig-bin/xmrig
          chmod +x /opt/xmrig-bin/xmrig
          rm -rf /opt/xmrig-src
          /opt/xmrig-bin/xmrig --version
        fi
        echo "[ZION] Installing runtime deps (libuv1 libssl3 libhwloc15)..."
        apt-get update -qq 2>/dev/null
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          libuv1 libssl3 libhwloc15 2>&1 | tail -1
        echo "[ZION] Starting MoneroOcean (worker=zion_dero threads=2)"
        exec /opt/xmrig-bin/xmrig \
          --url gulf.moneroocean.stream:10001 \
          --user 42m86RBWf4PeuRf8P5rwA96XvmCKAfF77doWYJRv3KKAKrT8GTb5b3pbHTtaZsbJ4BERW1NHgh8WQgpAxAoEiXF82skcKsK \
          --pass zion_dero \
          --threads 2 \
          --no-color \
          --donate-level 0 \
          --print-time 120
    cpus: "${DERO_CPUS:-2.0}"
    mem_limit: 4g
    security_opt:
      - no-new-privileges:true
    networks:
      - revenue-net
    labels:
      - "zion.service=revenue"
      - "zion.pool=moneroocean"

  # ─── ZEPH-MINER ─────────────────────────────────────────────
  # 1T, Helsinki only, ceka na binary z dero-miner volume
  # ─────────────────────────────────────────────────────────────
  zeph-miner:
    image: ubuntu:22.04
    container_name: zion-zeph-miner
    restart: unless-stopped
    profiles: ["helsinki"]
    entrypoint: /bin/bash
    volumes:
      - zion-xmrig-cache:/opt/xmrig-bin
    command:
      - -c
      - |
        echo "[ZION] zeph-miner waiting for xmrig binary..."
        n=0
        while [ ! -f /opt/xmrig-bin/xmrig ] && [ $$n -lt 90 ]; do
          n=$$((n+1))
          echo "[ZION] Waiting $${n}/90..."
          sleep 10
        done
        if [ ! -f /opt/xmrig-bin/xmrig ]; then echo "[ZION] Timeout waiting for xmrig"; exit 1; fi
        echo "[ZION] Installing runtime deps..."
        apt-get update -qq 2>/dev/null
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          libuv1 libssl3 libhwloc15 2>&1 | tail -1
        echo "[ZION] Starting MoneroOcean (worker=zion_zeph_helsinki threads=1)"
        exec /opt/xmrig-bin/xmrig \
          --url gulf.moneroocean.stream:10001 \
          --user 42m86RBWf4PeuRf8P5rwA96XvmCKAfF77doWYJRv3KKAKrT8GTb5b3pbHTtaZsbJ4BERW1NHgh8WQgpAxAoEiXF82skcKsK \
          --pass zion_zeph_helsinki \
          --threads 1 \
          --randomx-mode=light \
          --no-color \
          --donate-level 0 \
          --print-time 120
    cpus: "${ZEPH_CPUS:-1.0}"
    mem_limit: 3g
    security_opt:
      - no-new-privileges:true
    networks:
      - revenue-net
    labels:
      - "zion.service=revenue"
      - "zion.pool=moneroocean"

  # ─── EPIC-MINER ─────────────────────────────────────────────
  # 1T, Germany only, nahrazuje mrtvy fastepic.eu:3416
  # ─────────────────────────────────────────────────────────────
  epic-miner:
    image: ubuntu:22.04
    container_name: zion-epic-miner
    restart: unless-stopped
    profiles: ["germany"]
    entrypoint: /bin/bash
    volumes:
      - zion-xmrig-cache:/opt/xmrig-bin
    command:
      - -c
      - |
        echo "[ZION] epic-miner waiting for xmrig binary..."
        n=0
        while [ ! -f /opt/xmrig-bin/xmrig ] && [ $$n -lt 90 ]; do
          n=$$((n+1))
          echo "[ZION] Waiting $${n}/90..."
          sleep 10
        done
        if [ ! -f /opt/xmrig-bin/xmrig ]; then echo "[ZION] Timeout waiting for xmrig"; exit 1; fi
        echo "[ZION] Installing runtime deps..."
        apt-get update -qq 2>/dev/null
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          libuv1 libssl3 libhwloc15 2>&1 | tail -1
        echo "[ZION] Starting MoneroOcean (worker=zion_epic_germany threads=1)"
        exec /opt/xmrig-bin/xmrig \
          --url gulf.moneroocean.stream:10001 \
          --user 42m86RBWf4PeuRf8P5rwA96XvmCKAfF77doWYJRv3KKAKrT8GTb5b3pbHTtaZsbJ4BERW1NHgh8WQgpAxAoEiXF82skcKsK \
          --pass zion_epic_germany \
          --threads 1 \
          --randomx-mode=light \
          --no-color \
          --donate-level 0 \
          --print-time 120
    cpus: "${EPIC_CPUS:-1.0}"
    mem_limit: 3g
    security_opt:
      - no-new-privileges:true
    networks:
      - revenue-net
    labels:
      - "zion.service=revenue"
      - "zion.pool=moneroocean"

  # ─── XMR-X86-MINER ──────────────────────────────────────────
  # Pre-built xmrig static binary pro x86_64 (Usa1/Usa2/Asia3)
  # Stahuje hotovy binary z GitHub (~30s) misto compilace
  # Profily: x86
  # ─────────────────────────────────────────────────────────────
  xmr-x86-miner:
    image: ubuntu:22.04
    container_name: zion-xmr-x86
    restart: unless-stopped
    profiles: ["x86"]
    entrypoint: /bin/bash
    volumes:
      - zion-xmrig-x86:/opt/xmrig-bin
    command:
      - -c
      - |
        DEBIAN_FRONTEND=noninteractive apt-get update -qq 2>/dev/null
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          curl ca-certificates libuv1 libssl3 libhwloc15 2>&1 | tail -1
        if [ ! -f /opt/xmrig-bin/xmrig ]; then
          echo "[ZION] Downloading xmrig static x64 binary..."
          mkdir -p /opt/xmrig-bin
          curl -fsSL "https://github.com/xmrig/xmrig/releases/download/v6.21.3/xmrig-6.21.3-linux-static-x64.tar.gz" \
            | tar xz -C /opt/xmrig-bin --strip-components=1
          chmod +x /opt/xmrig-bin/xmrig
          /opt/xmrig-bin/xmrig --version
        fi
        WORKER="zion_x86_$$(hostname | tr -cd '[:alnum:]' | head -c8)"
        echo "[ZION] Starting MoneroOcean x86 (worker=$$WORKER threads=1)"
        exec /opt/xmrig-bin/xmrig \
          --url gulf.moneroocean.stream:10001 \
          --user 42m86RBWf4PeuRf8P5rwA96XvmCKAfF77doWYJRv3KKAKrT8GTb5b3pbHTtaZsbJ4BERW1NHgh8WQgpAxAoEiXF82skcKsK \
          --pass $$WORKER \
          --threads 1 \
          --no-color \
          --donate-level 0 \
          --print-time 120
    cpus: "1.0"
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    networks:
      - revenue-net
    labels:
      - "zion.service=revenue"
      - "zion.pool=moneroocean"
      - "zion.arch=x86"

  # ─── VRSC-MINER (VerusHash) ───────────────────────────────
  # CPU: VerusHash — best CPU efficiency coin
  # x86_64 only (ccminer-verus Docker = x86)
  # Pool: luckpool.net:3956 | payout: VRSC → convert manually
  # Profily: vrsc (opt-in)
  # ─────────────────────────────────────────────────────────────
  vrsc-miner:
    image: oink70/ccminer-verus:latest
    container_name: zion-vrsc-miner
    restart: unless-stopped
    profiles: ["vrsc"]
    command:
      - "-a"
      - "verushash"
      - "-o"
      - "stratum+tcp://eu.luckpool.net:3956"
      - "-u"
      - "RWrHVj8e7fkvfUw4Jf6qJNUHdr6baAsoF5"   # VRSC wallet
      - "-p"
      - "zion_vrsc"
      - "-t"
      - "1"
    cpus: "1.0"
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    networks:
      - revenue-net
    labels:
      - "zion.service=revenue"
      - "zion.pool=luckpool"
      - "zion.arch=x86"
      - "zion.algo=verushash"

  # ─── NCL GATEWAY (Stream 5: AI Compute) ──────────────────
  # Neural Compute Layer — 25% compute alokace pro AI tasky
  # Přijímá inference tasky z poolu, vrací result hashe
  # Port 8002 — referenced in ch3_revenue_settings.json
  # Aktivace: profil ncl nebo ZION_NCL_ENABLED=1
  # ─────────────────────────────────────────────────────────────
  ncl-gateway:
    image: python:3.12-slim
    container_name: zion-ncl-gateway
    restart: unless-stopped
    profiles: ["ncl"]
    environment:
      - NCL_POOL_URL=http://77.42.31.72:8444
      - NCL_WALLET=42m86RBWf4PeuRf8P5rwA96XvmCKAfF77doWYJRv3KKAKrT8GTb5b3pbHTtaZsbJ4BERW1NHgh8WQgpAxAoEiXF82skcKsK
      - NCL_PORT=8002
      - NCL_GPU_ENABLED=0
    ports:
      - "8002:8002"
    volumes:
      - /opt/zion/scripts/ncl_gateway.py:/app/ncl_gateway.py:ro
      - zion-ncl-state:/app/state
    command: python /app/ncl_gateway.py
    networks:
      - revenue-net
    labels:
      - "zion.service=ncl"
      - "zion.stream=5"

  # ─── MYSTERIUM ──────────────────────────────────────────────
  # VPN bandwidth node, oba servery, $0 kapital
  # Registrace: http://SERVER:4449 nebo MMN_API_KEY env
  # ─────────────────────────────────────────────────────────────
  mysterium:
    image: mysteriumnetwork/myst:latest
    container_name: zion-mysterium
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "4449:4449"
      - "41920-41925:41920-41925/udp"
    volumes:
      - zion-mysterium-data:/var/lib/mysterium-node
    environment:
      - MMN_API_KEY=8JCWSBmBlkYE9gsUq4qQPN3dOj25tctxtj18RSob
    command: --mmn.api-key=8JCWSBmBlkYE9gsUq4qQPN3dOj25tctxtj18RSob service --agreed-terms-and-conditions
    networks:
      - revenue-net
    labels:
      - "zion.service=revenue"
      - "zion.type=bandwidth"

  # ─── NKN ────────────────────────────────────────────────────
  nkn:
    image: nknorg/nkn:latest
    container_name: zion-nkn
    restart: unless-stopped
    ports:
      - "30001-30005:30001-30005"
    volumes:
      - zion-nkn-data:/nkn/data
    command: nknd --password-file /nkn/data/wallet.pswd --no-nat
    networks:
      - revenue-net
    labels:
      - "zion.service=revenue"
      - "zion.type=relay"

volumes:
  zion-xmrig-cache:
    name: zion-xmrig-cache
  zion-xmrig-x86:
    name: zion-xmrig-x86
  zion-mysterium-data:
    name: zion-mysterium-data
  zion-nkn-data:
    name: zion-nkn-data
  zion-ncl-state:
    name: zion-ncl-state

networks:
  revenue-net:
    name: zion-revenue-net
    external: true
