# ZION TerraNova — Website v2.9.9 Ekam Deeksha
# Next.js production build behind nginx reverse proxy

services:
  website:
    build:
      context: ../APP&WEB/website-v2.9
      dockerfile: Dockerfile.production
    image: zion-website:2.9.9
    container_name: zion-website
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Bridge metrics endpoint — same zion-net Docker network
      - BRIDGE_METRICS_URL=http://zion-bridge:9101/metrics
      # Prometheus for /api/metrics proxy (monitoring page)
      - PROMETHEUS_URL=http://zion-prometheus:9090
    healthcheck:
      # AUDIT-FIX: localhost can resolve to ::1 in some environments while the
      # Next.js server listens on IPv4 (0.0.0.0). Use explicit 127.0.0.1.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      - "com.zion.service=website"
      - "com.zion.version=2.9.9"
    networks:
      - zion-net

networks:
  zion-net:
    name: zion-net
    external: true
