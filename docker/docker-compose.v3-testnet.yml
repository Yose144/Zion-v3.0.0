# ZION V3 TestNet Stack — builds from V3/ workspace
# All V3 binaries use env-var config (from_env()), NOT CLI args.
# Usage: docker compose -f docker/docker-compose.v3-testnet.yml --env-file .env up -d --build

services:
  core:
    build:
      context: ../V3
      dockerfile: ../docker/Dockerfile.v3.core
      args:
        FEATURES: testnet
    image: zion-core:2.9.8-testnet
    container_name: zion-core
    restart: unless-stopped
    ports:
      - "8334:8334"   # P2P
      - "8332:8332"   # RPC (raw TCP JSON-RPC)
      - "8444:8444"   # Pool bind (stratum listener inside node)
      - "9115:9115"   # Metrics HTTP (Prometheus scrape)
    volumes:
      - zion-testnet-data:/data/zion
    environment:
      - RUST_LOG=info
      - ZION_NETWORK=testnet
      - ZION_NODE_STATE_PATH=/data/zion/chain_state.json
      - ZION_P2P_BIND=0.0.0.0:8334
      - ZION_RPC_BIND=0.0.0.0:8332
      - ZION_POOL_BIND=0.0.0.0:8444
      - ZION_METRICS_BIND=0.0.0.0:9115
      - ZION_SEED_PEERS=${SEED_PEERS:-172.29.0.11:8334,172.29.0.12:8334}
      - ZION_MINER_ADDRESS=${MINER_WALLET:-zion1q893q6c5j7y0e3r062g4m7c240t5g294k7z6729}
    healthcheck:
      test: ["CMD-SHELL", "echo '{\"jsonrpc\":\"2.0\",\"method\":\"getChainInfo\",\"id\":1}' | nc -w2 127.0.0.1 8332 | grep -q chain_height"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      zion-net:
        ipv4_address: 172.29.0.10

  seed1:
    image: zion-core:2.9.8-testnet
    container_name: zion-seed-1
    restart: unless-stopped
    depends_on:
      - core
    volumes:
      - seed1-testnet-data:/data/zion
    environment:
      - RUST_LOG=info
      - ZION_NETWORK=testnet
      - ZION_NODE_STATE_PATH=/data/zion/chain_state.json
      - ZION_P2P_BIND=0.0.0.0:8334
      - ZION_RPC_BIND=0.0.0.0:8332
      - ZION_POOL_BIND=0.0.0.0:8444
      - ZION_SEED_PEERS=172.29.0.10:8334
    networks:
      zion-net:
        ipv4_address: 172.29.0.11

  seed2:
    image: zion-core:2.9.8-testnet
    container_name: zion-seed-2
    restart: unless-stopped
    depends_on:
      - core
    volumes:
      - seed2-testnet-data:/data/zion
    environment:
      - RUST_LOG=info
      - ZION_NETWORK=testnet
      - ZION_NODE_STATE_PATH=/data/zion/chain_state.json
      - ZION_P2P_BIND=0.0.0.0:8334
      - ZION_RPC_BIND=0.0.0.0:8332
      - ZION_POOL_BIND=0.0.0.0:8444
      - ZION_SEED_PEERS=172.29.0.10:8334
    networks:
      zion-net:
        ipv4_address: 172.29.0.12

  pool:
    build:
      context: ../V3
      dockerfile: ../docker/Dockerfile.v3.pool
      args:
        FEATURES: "testnet"
    image: zion-pool:2.9.8-testnet
    container_name: zion-pool
    restart: unless-stopped
    ports:
      - "3333:3333"
      - "8080:8080"
    volumes:
      - pool-testnet-data:/data/zion-pool
    depends_on:
      core:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - RUST_LOG=info
      - ZION_POOL_BIND=0.0.0.0:3333
      - ZION_NODE_RPC_ADDR=172.29.0.10:8332
      - ZION_ROUTING_METRICS_BIND=0.0.0.0:8080
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - ZION_REVENUE_SOURCE=zion
      - ZION_REVENUE_USD=1.25
      - ZION_POOL_LOOP_COUNT=4294967295
      - ZION_NONCE_COUNT=500000
      - ZION_NONCE_STRIDE=65536
      - ZION_JOB_TTL_MS=180000
      - ZION_HAS_GPU=0
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3333"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - zion-net

  miner:
    build:
      context: ../V3
      dockerfile: ../docker/Dockerfile.v3.miner
      args:
        FEATURES: ""
    image: zion-miner:2.9.8-testnet
    container_name: zion-miner
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - ZION_POOL_ADDR=pool:3333
      - ZION_MINER_ID=${MINER_WALLET:-zion1q893q6c5j7y0e3r062g4m7c240t5g294k7z6729}
      - ZION_WORKER_NAME=${MINER_WORKER:-testnet-miner}
      - ZION_NONCE_AUTOTUNE=true
      - ZION_LOOP_COUNT=4294967295
      - ZION_NONCE_COUNT=500000
      - ZION_JOB_TTL_MS=180000
      - ZION_RECONNECT=true
      - ZION_MAX_RECONNECT=0
    depends_on:
      pool:
        condition: service_started
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /dev/hugepages:/dev/hugepages
    cpus: ${MINER_CPUS:-3.5}
    networks:
      - zion-net

  redis:
    image: redis:7-alpine
    container_name: zion-redis
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: redis-server --requirepass ${REDIS_PASSWORD}
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - zion-net

volumes:
  zion-testnet-data:
    external: true
  seed1-testnet-data:
  seed2-testnet-data:
  pool-testnet-data:
    external: true

networks:
  zion-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
