# ZION V3 TestNet Stack — builds from V3/ workspace
# Usage: docker compose -f docker/docker-compose.v3-testnet.yml --env-file .env up -d --build

services:
  core:
    build:
      context: ../V3
      dockerfile: ../docker/Dockerfile.v3.core
      args:
        FEATURES: testnet
    image: zion-core:2.9.8-testnet
    container_name: zion-core
    restart: unless-stopped
    ports:
      - "8334:8334"
      - "8444:8444"
    volumes:
      - zion-testnet-data:/data/zion
    command:
      - "--data-dir"
      - "/data/zion"
      - "--rpc-port"
      - "8444"
      - "--p2p-port"
      - "8334"
      - "--network"
      - "testnet"
      - "--peers"
      - "${SEED_PEERS:-172.29.0.11:8334,172.29.0.12:8334}"
    environment:
      - RUST_LOG=info
      - ZION_NETWORK=testnet
      - ZION_DATA_DIR=/data/zion
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8444/stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      zion-net:
        ipv4_address: 172.29.0.10

  seed1:
    image: zion-core:2.9.8-testnet
    container_name: zion-seed-1
    restart: unless-stopped
    depends_on:
      - core
    volumes:
      - seed1-testnet-data:/data/zion
    command:
      - "--data-dir"
      - "/data/zion"
      - "--rpc-port"
      - "8444"
      - "--p2p-port"
      - "8334"
      - "--network"
      - "testnet"
      - "--peers"
      - "172.29.0.10:8334"
    environment:
      - RUST_LOG=info
      - ZION_NETWORK=testnet
      - ZION_DATA_DIR=/data/zion
    networks:
      zion-net:
        ipv4_address: 172.29.0.11

  seed2:
    image: zion-core:2.9.8-testnet
    container_name: zion-seed-2
    restart: unless-stopped
    depends_on:
      - core
    volumes:
      - seed2-testnet-data:/data/zion
    command:
      - "--data-dir"
      - "/data/zion"
      - "--rpc-port"
      - "8444"
      - "--p2p-port"
      - "8334"
      - "--network"
      - "testnet"
      - "--peers"
      - "172.29.0.10:8334"
    environment:
      - RUST_LOG=info
      - ZION_NETWORK=testnet
      - ZION_DATA_DIR=/data/zion
    networks:
      zion-net:
        ipv4_address: 172.29.0.12

  pool:
    build:
      context: ../V3
      dockerfile: ../docker/Dockerfile.v3.pool
      args:
        FEATURES: "testnet"
    image: zion-pool:2.9.8-testnet
    container_name: zion-pool
    restart: unless-stopped
    ports:
      - "3333:3333"
      - "8080:8080"
    volumes:
      - pool-testnet-data:/data/zion-pool
      - ../config/ch3_zion_only_settings.json:/config/ch3_zion_only_settings.json:ro
    depends_on:
      core:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - RUST_LOG=info
      - ZION_CORE_RPC=http://core:8444/jsonrpc
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - ZION_REVENUE_CONFIG=/config/ch3_zion_only_settings.json
      - ZION_HAS_GPU=0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - zion-net

  miner:
    build:
      context: ../V3
      dockerfile: ../docker/Dockerfile.v3.miner
      args:
        FEATURES: ""
    image: zion-miner:2.9.8-testnet
    container_name: zion-miner
    restart: unless-stopped
    command:
      - "--pool"
      - "${MINER_POOL_URL:-pool:3333}"
      - "--wallet"
      - "${MINER_WALLET:-zion1q893q6c5j7y0e3r062g4m7c240t5g294k7z6729}"
      - "--worker"
      - "${MINER_WORKER:-testnet-miner}"
      - "--algorithm"
      - "cosmic_harmony"
      - "--threads"
      - "3"
    environment:
      - ZION_ENABLE_STREAM_SWITCH=0
      - ZION_NONCE_BASE=${ZION_NONCE_BASE:-0}
      - ZION_RANDOMX_FULL=${ZION_RANDOMX_FULL:-1}
      - RUST_LOG=info
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /dev/hugepages:/dev/hugepages
    cpus: ${MINER_CPUS:-3.5}
    networks:
      - zion-net

  redis:
    image: redis:7-alpine
    container_name: zion-redis
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: redis-server --requirepass ${REDIS_PASSWORD}
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - zion-net

volumes:
  zion-testnet-data:
    external: true
  seed1-testnet-data:
  seed2-testnet-data:
  pool-testnet-data:
    external: true

networks:
  zion-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
