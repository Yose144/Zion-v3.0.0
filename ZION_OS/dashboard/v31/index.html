<!DOCTYPE html>
<html lang="en" data-theme="zion">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>V31 Mainnet Alpha — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
<script>
tailwind.config={theme:{extend:{colors:{
  'zion-gold':'rgb(255 215 0)',
  'zion-purple':'rgb(147 51 234)',
  'zion-cyan':'rgb(6 182 212)',
}}}};
</script>
<style>
:root{--gold:255 215 0;--purple:147 51 234;--cyan:6 182 212;}
body{font-family:'Inter',system-ui,sans-serif;background:
  radial-gradient(circle at 18% -8%,rgba(147,51,234,0.22),transparent 34rem),
  radial-gradient(circle at 86% 8%,rgba(6,182,212,0.16),transparent 30rem),
  radial-gradient(circle at 50% 110%,rgba(255,215,0,0.12),transparent 40rem),
  linear-gradient(180deg,rgba(2,4,12,0.92),rgba(0,0,0,0.95));color:#fff;min-height:100vh;}
.card{background:linear-gradient(145deg,rgba(15,20,35,0.9),rgba(10,14,26,0.95));border:1px solid rgba(255,255,255,0.1);border-radius:1.25rem;box-shadow:0 16px 50px rgba(0,0,0,0.35);}
.log-box{font-family:'JetBrains Mono',monospace;max-height:22rem;overflow-y:auto;font-size:0.78rem;line-height:1.35;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.08);border-radius:0.75rem;padding:0.75rem;}
.status-dot{width:0.65rem;height:0.65rem;border-radius:999px;display:inline-block;margin-right:0.5rem;}
.status-up{background:#22c55e;box-shadow:0 0 8px #22c55e;}
.status-down{background:#ef4444;box-shadow:0 0 8px #ef4444;}
.status-warn{background:#eab308;box-shadow:0 0 8px #eab308;}
.btn{border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:#fff;border-radius:0.6rem;padding:0.5rem 1rem;font-weight:600;transition:all .15s;}
.btn:hover{background:rgba(255,255,255,0.1);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-gold{background:rgba(255,215,0,0.12);border-color:rgba(255,215,0,0.35);color:rgb(255 215 0);}
.btn-gold:hover{background:rgba(255,215,0,0.2);}
.btn-red{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.35);color:rgb(252 165 165);}
.btn-red:hover{background:rgba(239,68,68,0.2);}
</style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-6xl mx-auto">
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight"><span class="text-zion-gold">V31</span> Mainnet Alpha</h1>
      <p class="text-sm text-gray-400 mt-1">Runs on isolated ports <span class="text-zion-cyan font-mono">9445 / 8446 / 8335</span> — no conflict with V3.</p>
    </div>
    <a href="/" class="btn"><i class="fas fa-arrow-left mr-2"></i>Back to Command Center</a>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6" id="kpi">
    <div class="card p-4">
      <div class="text-xs text-gray-400 uppercase tracking-wider mb-1">Node</div>
      <div class="text-lg font-bold" id="kpi-node">…</div>
    </div>
    <div class="card p-4">
      <div class="text-xs text-gray-400 uppercase tracking-wider mb-1">Canonical Height</div>
      <div class="text-2xl font-extrabold text-zion-cyan" id="kpi-height">…</div>
    </div>
    <div class="card p-4">
      <div class="text-xs text-gray-400 uppercase tracking-wider mb-1">V3 Checkpoint Height</div>
      <div class="text-2xl font-extrabold text-zion-purple" id="kpi-v3-height">…</div>
    </div>
    <div class="card p-4">
      <div class="text-xs text-gray-400 uppercase tracking-wider mb-1">Pool</div>
      <div class="text-lg font-bold" id="kpi-pool">…</div>
    </div>
  </div>

  <div class="card p-5 mb-6">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
      <h2 class="text-lg font-bold"><i class="fas fa-server mr-2 text-zion-gold"></i>Control</h2>
      <div class="flex gap-2" id="controls">
        <button id="btn-start" class="btn btn-gold"><i class="fas fa-play mr-2"></i>Start V31</button>
        <button id="btn-stop" class="btn btn-red"><i class="fas fa-stop mr-2"></i>Stop V31</button>
      </div>
    </div>
    <div class="text-sm text-gray-400" id="last-update">Last update: —</div>
    <div class="text-sm text-red-300 mt-2 hidden" id="error-box"></div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="card p-5">
      <h2 class="text-lg font-bold mb-3"><i class="fas fa-cube mr-2 text-zion-cyan"></i>Node Log</h2>
      <pre class="log-box" id="node-log">Loading…</pre>
    </div>
    <div class="card p-5">
      <h2 class="text-lg font-bold mb-3"><i class="fas fa-users mr-2 text-zion-purple"></i>Pool Log</h2>
      <pre class="log-box" id="pool-log">Loading…</pre>
    </div>
  </div>
</div>

<script src="/v31/v31.js"></script>
</body>
</html>
