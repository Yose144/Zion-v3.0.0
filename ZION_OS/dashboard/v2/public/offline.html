<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZION Dashboard — Offline</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: #0A0B0F;
    color: #CBD5E1;
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100svh;
    margin: 0;
  }
  .box { text-align: center; max-width: 360px; padding: 2rem; }
  h1 { color: #FFD700; font-size: 2rem; margin: 0 0 0.5rem; letter-spacing: -1px; }
  .sub { color: #9333EA; font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 2rem; }
  p { color: #64748B; font-size: 0.875rem; line-height: 1.6; }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #EF4444; margin-right: 6px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  .retry {
    margin-top: 1.5rem;
    padding: 0.5rem 1.25rem;
    border-radius: 6px;
    background: #9333EA;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .retry:hover { background: #6B21A8; }
</style>
</head>
<body>
<div class="box">
  <h1>ZION</h1>
  <div class="sub">Dashboard v2</div>
  <p><span class="dot"></span>You are offline.</p>
  <p>The dashboard will reconnect automatically when your connection is restored.</p>
  <button class="retry" onclick="window.location.reload()">Try again</button>
</div>
</body>
</html>
