# ZION Agent Watchdog Rules — Edge CPU-only
# Monitors: miner health, disk, internet

rules:
  - name: miner_down
    condition: "miner_running == false"
    severity: critical
    action: restart_miner
    cooldown_sec: 300

  - name: low_hashrate
    condition: "miner_running == true AND hashrate < 1.0"
    severity: warning
    action: restart_miner
    cooldown_sec: 600

  - name: no_shares_5min
    condition: "miner_running == true AND shares_5min == 0"
    severity: warning
    action: restart_miner
    cooldown_sec: 300

  - name: no_internet
    condition: "internet_ok == false"
    severity: critical
    action: stop_miner
    cooldown_sec: 60

  - name: disk_full
    condition: "disk_used_percent > 90"
    severity: critical
    action: stop_miner
    cooldown_sec: 3600
