[workspace]
members = ["."]
resolver = "2"

[package]
name = "zion-agent"
version = "1.0.0"
edition = "2021"
description = "ZION OS Agent — rig lifecycle manager, telemetry, watchdog"
authors = ["ZION Team <dev@zionterranova.com>"]
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full", "process", "signal", "rt-multi-thread"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
config = "0.14"
sysinfo = "0.30"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"

# Unix-only process signal handling
[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["signal", "process"] }

# Platform-specific GPU libraries
# NVIDIA NVML (optional)
nvml-wrapper = { version = "0.10", optional = true }

[features]
default = []
nvidia = ["nvml-wrapper"]

[profile.release]
opt-level = 3
lto = true
strip = true
