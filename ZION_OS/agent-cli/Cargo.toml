[workspace]

[package]
name = "zion-agent-cli"
version = "0.1.0"
edition = "2021"
authors = ["ZION Project <dev@zion.network>"]
description = "ZION Agent CLI — Autonomous AI operator for the ZION ecosystem"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
tokio-stream = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
regex = "1"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
indicatif = "0.17"
colored = "2"
crossterm = "0.28"
ratatui = "0.29"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
shellexpand = "3"

[dev-dependencies]
tokio-test = "0.4"
