# Zion OS Orchestrator - Docker Compose
# Kompletni orchestrace celeho Zion Mainnet ekosystemu pres Docker

version: "3.8"

services:
  # ==========================================================================
  # L1 - Core Layer
  # ==========================================================================

  zion-node:
    build:
      context: ../..
      dockerfile: V3/docker/Dockerfile.node
    container_name: zion-node
    hostname: zion-node
    restart: unless-stopped
    ports:
      - "8333:8333"
      - "8443:8443"
      - "8445:8445"
      - "9115:9115"
    environment:
      - ZION_NODE_ID=local-node
      - ZION_P2P_BIND=0.0.0.0:8333
      - ZION_RPC_BIND=0.0.0.0:8443
      - ZION_NODE_STATE_PATH=/data/zion-node-state.db
      - ZION_MINER_ADDRESS=zion1w523a76830x2t5m7f3j023w265e8g5c400a4790
      - ZION_HUMANITARIAN_WALLET=zion1s29403j538w6p6n0p783l6w5v6t254c0380c2d4
      - ZION_ISSOBELLA_WALLET=zion140n8a8t6f3083232r0g6c498r6c0d423f4h9702
      - ZION_SEED_PEERS=77.42.71.94:8333
    volumes:
      - zion-node-data:/data
      - ../../logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/jsonrpc"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - zion-network

  zion-pool:
    build:
      context: ../..
      dockerfile: V3/docker/Dockerfile.pool
    container_name: zion-pool
    hostname: zion-pool
    restart: unless-stopped
    ports:
      - "8444:8444"
      - "8455:8455"
      - "8080:8080"
    environment:
      - ZION_POOL_BIND=0.0.0.0:8444
      - ZION_NODE_RPC_ADDR=zion-node:8443
      - ZION_POOL_LOOP_COUNT=1000000
      - ZION_NONCE_COUNT=4096
    depends_on:
      zion-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8444"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - zion-network

  # ==========================================================================
  # L2 - Service Layer
  # ==========================================================================

  zion-bridge:
    build:
      context: ../..
      dockerfile: V3/docker/Dockerfile.bridge
    container_name: zion-bridge
    restart: unless-stopped
    ports:
      - "9102:9102"
    environment:
      - ZION_BRIDGE_CONFIG=/config/bridge.toml
    volumes:
      - ../../V3/L2/bridge/config.toml:/config/bridge.toml:ro
    depends_on:
      zion-node:
        condition: service_healthy
    networks:
      - zion-network

  zion-dao:
    build:
      context: ../..
      dockerfile: V3/docker/Dockerfile.dao
    container_name: zion-dao
    restart: unless-stopped
    ports:
      - "8450:8450"
    environment:
      - ZION_DAO_CONFIG=/config/dao.toml
    volumes:
      - ../../V3/L2/dao/config.toml:/config/dao.toml:ro
    depends_on:
      zion-node:
        condition: service_healthy
    networks:
      - zion-network

  zion-atomic-swap:
    build:
      context: ../..
      dockerfile: V3/docker/Dockerfile.atomic-swap
    container_name: zion-atomic-swap
    restart: unless-stopped
    ports:
      - "8452:8452"
    environment:
      - ZION_ATOMIC_SWAP_CONFIG=/config/atomic-swap.toml
    volumes:
      - ../../V3/L2/atomic-swap/config.toml:/config/atomic-swap.toml:ro
    depends_on:
      zion-node:
        condition: service_healthy
    networks:
      - zion-network

  # ==========================================================================
  # L3 - WARP Layer
  # ==========================================================================

  zion-warp:
    build:
      context: ../..
      dockerfile: V3/docker/Dockerfile.warp
    container_name: zion-warp
    restart: unless-stopped
    ports:
      - "8453:8453"
    environment:
      - ZION_WARP_CONFIG=/config/warp.toml
    volumes:
      - ../../V3/L3/warp/config.toml:/config/warp.toml:ro
    depends_on:
      zion-node:
        condition: service_healthy
      zion-bridge:
        condition: service_started
    networks:
      - zion-network

  # ==========================================================================
  # L4 - AI Layer
  # ==========================================================================

  zion-hiranyagarbha:
    build:
      context: ../..
      dockerfile: V3/docker/Dockerfile.hiranyagarbha
    container_name: zion-hiranyagarbha
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - ZION_HIRANYAGARBHA_CONFIG=/config/hiranyagarbha.toml
    volumes:
      - ../../V3/L4/hiranyagarbha/config.toml:/config/hiranyagarbha.toml:ro
    depends_on:
      zion-node:
        condition: service_healthy
    networks:
      - zion-network

  # ==========================================================================
  # L6 - Application Layer
  # ==========================================================================

  zion-dashboard-web:
    build:
      context: ../..
      dockerfile: ZION_OS/dashboard/Dockerfile
    container_name: zion-dashboard-web
    restart: unless-stopped
    ports:
      - "8766:8766"
    environment:
      - ZION_NODE_RPC=http://zion-node:8443
      - ZION_POOL_ADDR=zion-pool:8444
      - ZION_DASHBOARD_PORT=8766
    depends_on:
      zion-node:
        condition: service_healthy
      zion-pool:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8766/api/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - zion-network

  # ==========================================================================
  # Monitoring Stack
  # ==========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: zion-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - zion-network

  grafana:
    image: grafana/grafana:latest
    container_name: zion-grafana
    restart: unless-stopped
    ports:
      - "3100:3000"
    volumes:
      - ./monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./monitoring/grafana/dashboards/:/var/lib/grafana/dashboards/:ro
      - ./monitoring/grafana/provisioning/:/etc/grafana/provisioning/:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=zion-admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - zion-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: zion-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus
    networks:
      - zion-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: zion-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - zion-network

# ==========================================================================
# Networks
# ==========================================================================
networks:
  zion-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  zion-node-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
