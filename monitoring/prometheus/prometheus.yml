# ╔══════════════════════════════════════════════════════════════╗
# ║  ZION TerraNova — Prometheus Configuration                   ║
# ║  Scrapes: Pool (Helsinki+Germany), Core node /stats          ║
# ╚══════════════════════════════════════════════════════════════╝

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: "zion-testnet"
    environment: "testnet"

# Alert rules
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Alertmanager routing
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ── Prometheus self-monitoring ──
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          instance: "prometheus"

  # ══════════════════════════════════════════════════
  # LOCAL targets — use Docker container names or
  # host gateway (172.18.0.1) for host-mapped ports
  # ══════════════════════════════════════════════════

  # ── ZION Pool — Helsinki (local) ──
  - job_name: "zion-pool-prague"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["zion-pool:8080"]
        labels:
          server: "prague"
          region: "eu-north"
          service: "pool"

  # ── ZION Core Node — Helsinki (local) ──
  - job_name: "zion-core-prague"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets: ["zion-core:9115"]
        labels:
          server: "prague"
          region: "eu-north"
          service: "core"

  # ── ZION Miner — Prague (local) ──
  - job_name: "zion-miner-prague"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["zion-miner:9116"]
        labels:
          server: "prague"
          region: "eu-north"
          service: "miner"

  # ── Node Exporter — Helsinki (local, host-mapped port) ──
  - job_name: "node-prague"
    scrape_interval: 30s
    static_configs:
      - targets: ["zion-node-exporter:9100"]
        labels:
          server: "prague"
          service: "node-exporter"

  # ── Redis Exporter — Helsinki (local) ──
  - job_name: "redis-prague"
    scrape_interval: 30s
    static_configs:
      - targets: ["zion-redis-exporter:9121"]
        labels:
          server: "prague"
          service: "redis"

  # ══════════════════════════════════════════════════
  # REMOTE targets — Germany (public IP, port-forwarded)
  # ══════════════════════════════════════════════════

  # ── ZION Pool — Germany ──
  - job_name: "zion-pool-germany"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["46.225.126.243:8080"]
        labels:
          server: "germany"
          region: "eu-central"
          service: "pool"

  # ── ZION Core Node — Germany ──
  - job_name: "zion-core-germany"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets: ["46.225.126.243:9115"]
        labels:
          server: "germany"
          region: "eu-central"
          service: "core"

  # NOTE: node-exporter (9100) and redis-exporter (9121) on Germany
  # are NOT exposed publicly — scraped by Germany's own Prometheus
