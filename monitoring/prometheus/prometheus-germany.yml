# ╔══════════════════════════════════════════════════════════════╗
# ║  ZION TerraNova — Prometheus Configuration (GERMANY)         ║
# ║  Local: Germany containers, Remote: Helsinki public IP       ║
# ╚══════════════════════════════════════════════════════════════╝

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: "zion-testnet"
    environment: "testnet"
    site: "germany"

# Alert rules
rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # ── Prometheus self-monitoring ──
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          instance: "prometheus"

  # ══════════════════════════════════════════════════
  # LOCAL targets — Germany Docker container names
  # ══════════════════════════════════════════════════

  # ── ZION Pool — Germany (local) ──
  - job_name: "zion-pool-germany"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["zion-pool:8080"]
        labels:
          server: "germany"
          region: "eu-central"
          service: "pool"

  # ── ZION Core Node — Germany (local) ──
  - job_name: "zion-core-germany"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets: ["zion-core:8444"]
        labels:
          server: "germany"
          region: "eu-central"
          service: "core"

  # ── Node Exporter — Germany (local) ──
  - job_name: "node-germany"
    scrape_interval: 30s
    static_configs:
      - targets: ["zion-node-exporter:9100"]
        labels:
          server: "germany"
          service: "node-exporter"

  # ── Redis Exporter — Germany (local) ──
  - job_name: "redis-germany"
    scrape_interval: 30s
    static_configs:
      - targets: ["zion-redis-exporter:9121"]
        labels:
          server: "germany"
          service: "redis"

  # ══════════════════════════════════════════════════
  # REMOTE targets — Helsinki (public IP)
  # ══════════════════════════════════════════════════

  # ── ZION Pool — Helsinki ──
  - job_name: "zion-pool-helsinki"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["77.42.31.72:8080"]
        labels:
          server: "helsinki"
          region: "eu-north"
          service: "pool"

  # ── ZION Core Node — Helsinki ──
  - job_name: "zion-core-helsinki"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets: ["77.42.31.72:8444"]
        labels:
          server: "helsinki"
          region: "eu-north"
          service: "core"

  # NOTE: node-exporter (9100) and redis-exporter (9121) on Helsinki
  # are NOT exposed publicly — scraped by Helsinki's own Prometheus
