# ╔══════════════════════════════════════════════════════════════╗
# ║  ZION TerraNova — Alertmanager Configuration                 ║
# ║  Routing: critical → Discord #critical, warning → #ops-alerts║
# ╚══════════════════════════════════════════════════════════════╝
#
# Potřebné ENV proměnné (nastavit v .env nebo přímo na serveru):
#   DISCORD_WEBHOOK_OPS      — webhook URL #ops-alerts kanálu
#   DISCORD_WEBHOOK_CRITICAL — webhook URL #critical kanálu (může být shodný)
#
# Jak vytvořit webhook:
#   Discord server → kanál → Nastavení → Integrace → Webhooky → Nový webhook
#   URL formát: https://discord.com/api/webhooks/<id>/<token>
#
# Deploy:
#   docker compose -f docker/docker-compose.monitoring.yml up -d alertmanager
#
# Test alertu:
#   curl -X POST http://localhost:9093/api/v1/alerts \
#     -H 'Content-Type: application/json' \
#     -d '[{"labels":{"alertname":"TestAlert","severity":"critical"},"annotations":{"summary":"Test z Alertmanager"}}]'

global:
  resolve_timeout: 5m
  smtp_require_tls: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

# ── Routing ──────────────────────────────────────────────────────────────
route:
  receiver: "discord-ops"
  group_by: ["alertname", "server", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - match:
        severity: critical
      receiver: "discord-critical"
      group_wait: 10s
      repeat_interval: 1h
      continue: false

    - match:
        severity: warning
      receiver: "discord-ops"
      group_wait: 1m
      repeat_interval: 6h
      continue: false

    - match:
        team: infra
      receiver: "discord-ops"
      group_wait: 30s
      repeat_interval: 2h

# ── Inhibition ───────────────────────────────────────────────────────────
inhibit_rules:
  - source_match:
      severity: "critical"
      alertname: "CoreNodeDown"
    target_match:
      severity: "warning"
    equal:
      - server

  - source_match:
      severity: "critical"
      alertname: "PoolDown"
    target_match:
      severity: "warning"
      alertname: "PoolNoShares"
    equal:
      - server

# ── Receivers ────────────────────────────────────────────────────────────
receivers:
  - name: "discord-ops"
    discord_configs:
      - webhook_url: "${DISCORD_WEBHOOK_OPS}"
        title: '{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} ZION Alert — {{ .GroupLabels.alertname }}'
        message: |
          **Server:** `{{ .CommonLabels.server }}`
          **Severity:** {{ .CommonLabels.severity }}
          **Alerts:** {{ len .Alerts }}

          {{ range .Alerts -}}
          › **{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          _Started: {{ .StartsAt.Format "2006-01-02 15:04 UTC" }}_

          {{ end -}}
          [Alertmanager](http://77.42.31.72:9093) · [Grafana](http://77.42.31.72:3001)
        send_resolved: true

  - name: "discord-critical"
    discord_configs:
      - webhook_url: "${DISCORD_WEBHOOK_CRITICAL}"
        title: '🚨 CRITICAL — {{ .GroupLabels.alertname }}'
        message: |
          **Server:** `{{ .CommonLabels.server }}`
          **Alerts:** {{ len .Alerts }}

          {{ range .Alerts -}}
          › **{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          _Started: {{ .StartsAt.Format "2006-01-02 15:04 UTC" }}_

          {{ end -}}
          **@here** — akce vyžadována
          [Alertmanager](http://77.42.31.72:9093) · [Grafana](http://77.42.31.72:3001)
        send_resolved: true
