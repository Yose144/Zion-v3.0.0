[package]
name = "btcunlock"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Recovery toolkit for YOUR OWN lost/inaccessible BTC wallets (BIP39 mnemonic repair, derivation path scan, balance lookup)"

# Standalone crate — deliberately not a member of the root meta-workspace.
[workspace]

[dependencies]
bip39 = "2"
bitcoin = { version = "0.31", default-features = false, features = ["std", "rand"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
