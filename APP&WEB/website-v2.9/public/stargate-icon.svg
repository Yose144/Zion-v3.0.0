<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Metallic ring gradient -->
    <radialGradient id="metalRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="54%" stop-color="#000000"/>
      <stop offset="54%" stop-color="#7e7f81"/>
      <stop offset="56%" stop-color="#7e7f81"/>
      <stop offset="56%" stop-color="#8c8d8f"/>
      <stop offset="63%" stop-color="#8c8d8f"/>
      <stop offset="63%" stop-color="#727374"/>
      <stop offset="65%" stop-color="#727374"/>
      <stop offset="65%" stop-color="#7e7f81"/>
      <stop offset="75%" stop-color="#656667"/>
      <stop offset="100%" stop-color="#454647"/>
    </radialGradient>
    <!-- Event horizon -->
    <radialGradient id="eventHorizon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a15" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#050510" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Chevron glow -->
    <radialGradient id="chevGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ffff0" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#6ffff0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6ffff0" stop-opacity="0"/>
    </radialGradient>
    <!-- Background space -->
    <radialGradient id="space" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#020208"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#space)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="48" cy="72" r="0.8" opacity="0.6"/>
    <circle cx="112" cy="40" r="1.2" opacity="0.8"/>
    <circle cx="420" cy="88" r="0.7" opacity="0.5"/>
    <circle cx="468" cy="44" r="1.3" opacity="0.9"/>
    <circle cx="72" cy="140" r="0.9" opacity="0.6"/>
    <circle cx="460" cy="160" r="0.8" opacity="0.6"/>
    <circle cx="40" cy="300" r="0.7" opacity="0.5"/>
    <circle cx="472" cy="300" r="0.6" opacity="0.4"/>
    <circle cx="60" cy="440" r="1.0" opacity="0.7"/>
    <circle cx="440" cy="400" r="0.8" opacity="0.6"/>
  </g>

  <!-- Outer metallic ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#metalRing)" stroke-width="44" opacity="0.5"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(100,116,139,0.3)" stroke-width="2"/>
  <circle cx="256" cy="256" r="182" fill="none" stroke="rgba(71,85,105,0.2)" stroke-width="1"/>

  <!-- Inner rotating rings (simplified) -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="rgba(139,92,246,0.2)" stroke-width="1.5" stroke-dasharray="80 20"/>
  <circle cx="256" cy="256" r="155" fill="none" stroke="rgba(111,255,240,0.4)" stroke-width="2" stroke-dasharray="40 12"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="1.5" stroke-dasharray="26 10"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(245,215,142,0.25)" stroke-width="1" stroke-dasharray="20 8"/>
  <circle cx="256" cy="256" r="134" fill="none" stroke="rgba(111,255,240,0.2)" stroke-width="2.5" stroke-dasharray="48 16"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="rgba(147,51,234,0.18)" stroke-width="1" stroke-dasharray="30 10"/>
  <circle cx="256" cy="256" r="122" fill="none" stroke="rgba(6,182,212,0.15)" stroke-width="1.5" stroke-dasharray="50 14"/>

  <!-- Event horizon glow -->
  <circle cx="256" cy="256" r="115" fill="url(#eventHorizon)" opacity="0.5"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="rgba(6,182,212,0.18)" stroke-width="1" opacity="0.5"/>
  <circle cx="256" cy="256" r="55" fill="rgba(6,182,212,0.06)" opacity="0.4"/>
  <circle cx="256" cy="256" r="35" fill="rgba(111,255,240,0.04)" opacity="0.3"/>

  <!-- 9 Chevrons (V shapes around the ring) -->
  <g transform="translate(256 256)">
    <!-- Chevron 0 (top) -->
    <g transform="rotate(0)">
      <path d="M -10 -190 L 0 -214 L 10 -190" fill="none" stroke="#909192" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.7" transform="skewX(-30) translate(2 0)"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.7" transform="skewX(30) translate(-2 0)"/>
    </g>
    <!-- Chevron 1 -->
    <g transform="rotate(40)">
      <path d="M -10 -190 L 0 -214 L 10 -190" fill="none" stroke="#909192" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.5" transform="skewX(-30) translate(2 0)"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.5" transform="skewX(30) translate(-2 0)"/>
    </g>
    <!-- Chevron 2 -->
    <g transform="rotate(80)">
      <path d="M -10 -190 L 0 -214 L 10 -190" fill="none" stroke="#909192" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.5" transform="skewX(-30) translate(2 0)"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.5" transform="skewX(30) translate(-2 0)"/>
    </g>
    <!-- Chevron 3 -->
    <g transform="rotate(120)">
      <path d="M -10 -190 L 0 -214 L 10 -190" fill="none" stroke="#909192" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.5" transform="skewX(-30) translate(2 0)"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.5" transform="skewX(30) translate(-2 0)"/>
    </g>
    <!-- Chevron 4 -->
    <g transform="rotate(160)">
      <path d="M -10 -190 L 0 -214 L 10 -190" fill="none" stroke="#909192" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.5" transform="skewX(-30) translate(2 0)"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.5" transform="skewX(30) translate(-2 0)"/>
    </g>
    <!-- Chevron 5 -->
    <g transform="rotate(200)">
      <path d="M -10 -190 L 0 -214 L 10 -190" fill="none" stroke="#909192" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.5" transform="skewX(-30) translate(2 0)"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.5" transform="skewX(30) translate(-2 0)"/>
    </g>
    <!-- Chevron 6 -->
    <g transform="rotate(240)">
      <path d="M -10 -190 L 0 -214 L 10 -190" fill="none" stroke="#909192" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.5" transform="skewX(-30) translate(2 0)"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.5" transform="skewX(30) translate(-2 0)"/>
    </g>
    <!-- Chevron 7 -->
    <g transform="rotate(280)">
      <path d="M -10 -190 L 0 -214 L 10 -190" fill="none" stroke="#909192" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.5" transform="skewX(-30) translate(2 0)"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.5" transform="skewX(30) translate(-2 0)"/>
    </g>
    <!-- Chevron 8 -->
    <g transform="rotate(320)">
      <path d="M -10 -190 L 0 -214 L 10 -190" fill="none" stroke="#909192" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.5" transform="skewX(-30) translate(2 0)"/>
      <rect x="-5" y="-195" width="10" height="4" rx="1" fill="#6ffff0" opacity="0.5" transform="skewX(30) translate(-2 0)"/>
    </g>
  </g>

  <!-- Central Z (simplified from Z.gif) -->
  <g transform="translate(256 256)" opacity="0.7">
    <circle r="38" fill="#0a0a0a" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <!-- Stylized Z -->
    <path d="M -18 -16 L 18 -16 L -14 16 L 18 16" fill="none" stroke="#cccccc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="grayscale(100%) contrast(180%)"/>
  </g>

  <!-- Central glow -->
  <circle cx="256" cy="256" r="8" fill="#6ffff0" opacity="0.3"/>
</svg>
