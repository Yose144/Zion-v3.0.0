[package]
name = "zion-dashboard-tauri"
version = "3.0.0"
description = "ZION V3 Dashboard — Edge-Primary Command Center"
authors = ["ZION Team"]
edition = "2021"

[workspace]
# Explicit standalone workspace — do NOT inherit from parent Zion monorepo
members = ["."]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
