<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiran v2.3 Chat</title>
  <style>
    :root {
      --gold: #ffd700;
      --purple: #9333ea;
      --cyan: #06b6d4;
      --bg: #050510;
      --card: rgba(12,14,30,0.92);
      --border: rgba(255,255,255,0.1);
      --text: #e0e0e0;
      --text-dim: rgba(255,255,255,0.55);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 20%, rgba(10,12,28,0.6), #000),
                  radial-gradient(ellipse at 20% 30%, rgba(147,51,234,0.15), transparent 50%),
                  #000;
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 14px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 { font-size: 15px; font-weight: 600; color: var(--gold); }
    .status { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: rgba(255,255,255,0.08); }
    .status.ok { background: rgba(6,182,212,0.15); color: var(--cyan); }
    .status.err { background: rgba(239,68,68,0.15); color: #ef4444; }
    .chat { flex:1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; line-height: 1.6; font-size: 13.5px; }
    .msg.user { align-self: flex-end; background: rgba(147,51,234,0.2); border: 1px solid rgba(147,51,234,0.25); }
    .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--border); }
    .msg .role { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; opacity: 0.6; }
    .msg .role.user { color: var(--purple); }
    .msg .role.bot { color: var(--cyan); }
    .input-area {
      padding: 14px 20px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }
    .input-area input {
      flex: 1;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .input-area input:focus { border-color: var(--purple); }
    .input-area button {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
    .typing { display: none; align-self: flex-start; font-size: 12px; color: var(--text-dim); padding: 8px 16px; }
    .typing.active { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Hiran v2.3</h1>
    <span class="status" id="status">Checking...</span>
  </div>
  <div class="chat" id="chat"></div>
  <div class="typing" id="typing">Thinking...</div>
  <div class="input-area">
    <input type="text" id="input" placeholder="Ask Hiran v2.3..." onkeydown="if(event.key==='Enter')send()">
    <button id="sendBtn" onclick="send()">Send</button>
  </div>

<script>
const API_URL = 'http://localhost:8080/v1/chat/completions';
const MODEL = 'hiran-v2.3';
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const typing = document.getElementById('typing');
const status = document.getElementById('status');
const btn = document.getElementById('sendBtn');

// Health check
async function checkHealth() {
  try {
    const r = await fetch('http://localhost:8080/health', {method:'GET'});
    if (r.ok) { status.textContent = 'Connected (localhost:8080)'; status.className = 'status ok'; }
    else throw new Error('not ok');
  } catch(e) {
    status.textContent = 'Offline — start tunnel: ssh -L 8080:localhost:8080 ...';
    status.className = 'status err';
  }
}
checkHealth();
setInterval(checkHealth, 10000);

function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.innerHTML = `<div class="role ${who}">${who}</div>` + escapeHtml(text);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function send() {
  const q = input.value.trim();
  if (!q) return;
  addMsg(q, 'user');
  input.value = '';
  btn.disabled = true;
  typing.classList.add('active');

  try {
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: MODEL,
        messages: [{role:'user', content: q}],
        temperature: 0.7,
        max_tokens: 512
      })
    });
    const data = await r.json();
    const reply = data.choices?.[0]?.message?.content || 'No response';
    addMsg(reply, 'bot');
  } catch(e) {
    addMsg('Error: ' + e.message, 'bot');
  }
  typing.classList.remove('active');
  btn.disabled = false;
}
</script>
</body>
</html>
