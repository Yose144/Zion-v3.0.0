# newearth.cz / www.newearth.cz — legacy V2 archive + root redirect
#
# - Root / and /index.html redirect to the new intro at https://zionterranova.com/
# - /V2/ and all other static files are served from /var/www/newearth
# - Certbot can renew via /.well-known/acme-challenge/

# HTTP — ACME-friendly; after cert is issued, all other traffic goes to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name newearth.cz www.newearth.cz;

    root /var/www/newearth;

    # Let Certbot prove ownership without being redirected
    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    # Everything except ACME → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — root redirects to zionterranova.com, V2 archive stays here
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name newearth.cz www.newearth.cz;

    ssl_certificate /etc/letsencrypt/live/newearth.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newearth.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/newearth;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Root → new intro
    location = / {
        return 301 https://zionterranova.com/;
    }

    location = /index.html {
        return 301 https://zionterranova.com/;
    }

    # Legacy V2 archive and any remaining static files
    location / {
        try_files $uri $uri/ =404;
    }
}
