<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZION Native Pool Dashboard</title>
    <style>
        :root {
            --primary: #9b4dca;
            --bg: #111;
            --card-bg: #222;
            --text: #eee;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { margin-bottom: 2rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .label { font-size: 0.9em; color: #888; }
        .value { font-size: 2em; font-weight: bold; margin-top: 10px; color: var(--primary); }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #333;
        }
        th { background-color: #333; }
        tr:hover { background-color: #2a2a2a; }
        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #555;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .active { background-color: #2ecc71; }
        .error { background-color: #e74c3c; }
        
        #console {
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 15px;
            border-radius: 4px;
            height: 200px;
            overflow-y: auto;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ ZION Native Pool v3.1.0</h1>
        
        <div class="grid">
            <div class="card">
                <div class="label">Miners Connected</div>
                <div class="value" id="miners">-</div>
            </div>
            <div class="card">
                <div class="label">Hashrate (Est)</div>
                <div class="value" id="hashrate">- H/s</div>
            </div>
            <div class="card">
                <div class="label">Broadcasts Sent</div>
                <div class="value" id="broadcasts">-</div>
            </div>
            <div class="card">
                <div class="label">Shares Accepted</div>
                <div class="value" id="shares">-</div>
            </div>
        </div>

        <h2>Recent Blocks</h2>
        <table id="blocks-table">
            <thead>
                <tr>
                    <th>Height</th>
                    <th>Hash</th>
                    <th>Miner</th>
                    <th>Reward</th>
                    <th>Age</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="5">Loading...</td></tr>
            </tbody>
        </table>

        <h2>System Log</h2>
        <div id="console"></div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8181'; // Adjust if proxied
        
        function log(msg) {
            const c = document.getElementById('console');
            c.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            c.scrollTop = c.scrollHeight;
        }

        async function fetchMetrics() {
            try {
                const res = await fetch(`${API_BASE}/metrics`);
                if (!res.ok) throw new Error('Network response was not ok');
                const text = await res.text();
                
                // Parse Prometheus text format
                const getVal = (key) => {
                    const match = text.match(new RegExp(`^${key} ([0-9.]+)`, 'm'));
                    return match ? match[1] : '0';
                };

                document.getElementById('miners').innerText = getVal('stratum_active_connections');
                document.getElementById('shares').innerText = getVal('shares_accepted_total');
                document.getElementById('broadcasts').innerText = getVal('job_broadcasts_total');
                
                // Hashrate estimate (simple count of shares recently?)
                // Prometheus doesn't give rate directly unless configured
                // We show N/A or derive from window??
                // For now, raw shares
                
                return true;
            } catch (e) {
                log(`Metrics error: ${e.message}. Is CORS enabled or Proxy set up?`);
                return false;
            }
        }

        async function fetchBlocks() {
            try {
                const res = await fetch(`${API_BASE}/api/recent_blocks/10`);
                const data = await res.json();
                
                if (data.ok && data.blocks) {
                    const tbody = document.querySelector('#blocks-table tbody');
                    if (data.blocks.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5">No blocks found yet</td></tr>';
                        return;
                    }
                    
                    tbody.innerHTML = data.blocks.map(b => `
                        <tr>
                            <td>${b.height}</td>
                            <td><a href="#">${b.hash.substring(0,10)}...</a></td>
                            <td>${b.finder.substring(0,10)}...</td>
                            <td>${b.reward}</td>
                            <td>${new Date(b.timestamp * 1000).toLocaleTimeString()}</td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                log(`Blocks API error: ${e.message}`);
            }
        }

        async function update() {
            await fetchMetrics();
            await fetchBlocks();
        }

        // Init
        log("Dashboard initialized. Connecting to " + API_BASE);
        update();
        setInterval(update, 5000);
    </script>
</body>
</html>
