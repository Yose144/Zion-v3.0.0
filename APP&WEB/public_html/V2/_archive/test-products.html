<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Products Test</title>
    <script src="./products.js?v=20251205"></script>
</head>
<body>
    <h1>Products Loading Test</h1>
    <div id="output"></div>
    <script>
        const output = document.getElementById('output');
        if (typeof PRODUCTS !== 'undefined') {
            output.innerHTML = `
                <p style="color: green;">✓ PRODUCTS loaded successfully!</p>
                <p>Total products: ${PRODUCTS.length}</p>
                <p>First product: ${PRODUCTS[0] ? PRODUCTS[0].name : 'none'}</p>
                <p>Categories found: ${[...new Set(PRODUCTS.map(p => p.category))].join(', ')}</p>
                <pre>${JSON.stringify(PRODUCTS[0], null, 2)}</pre>
            `;
        } else {
            output.innerHTML = '<p style="color: red;">✗ PRODUCTS not loaded!</p>';
        }
        
        if (typeof CATEGORY_NAMES !== 'undefined') {
            output.innerHTML += '<p style="color: green;">✓ CATEGORY_NAMES loaded</p>';
        } else {
            output.innerHTML += '<p style="color: red;">✗ CATEGORY_NAMES not loaded</p>';
        }
    </script>
</body>
</html>
