<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZION Presale Debug Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-test {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-test:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-clear:hover {
            background: #e0e0e0;
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }
        
        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }
        
        .result h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .result pre {
            background: rgba(0,0,0,0.05);
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 ZION Presale Debug Tool</h1>
        <p class="subtitle">Test presale orders bez platební brány</p>
        
        <div class="info-box">
            ℹ️ Tento nástroj vytvoří testovací objednávku a odešle potvrzovací emaily přes SMTP bez nutnosti platby.
        </div>
        
        <form id="testForm">
            <div class="form-group">
                <label for="email">Email zákazníka *</label>
                <input type="email" id="email" name="email" required placeholder="test@example.com">
            </div>
            
            <div class="form-group">
                <label for="amount">Částka v CZK *</label>
                <input type="number" id="amount" name="amount" required placeholder="1000" min="100" step="100" value="1000">
            </div>
            
            <div class="form-group">
                <label for="currency">Měna *</label>
                <select id="currency" name="currency" required>
                    <option value="CZK">CZK - Česká koruna</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="USD">USD - Americký dolar</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="name">Jméno (volitelné)</label>
                <input type="text" id="name" name="name" placeholder="Jan Novák">
            </div>
            
            <div class="form-group">
                <label for="testMode">Test režim *</label>
                <select id="testMode" name="testMode" required>
                    <option value="full">Full test - vytvoří objednávku + odešle emaily</option>
                    <option value="email_only">Pouze emaily - neukládá do DB</option>
                    <option value="db_only">Pouze DB - neposílá emaily</option>
                </select>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-test">🚀 Spustit test</button>
                <button type="button" class="btn-clear" onclick="clearForm()">🗑️ Vymazat</button>
            </div>
        </form>
        
        <div class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #667eea;">Zpracovávám test...</p>
        </div>
        
        <div id="result" class="result"></div>
    </div>
    
    <script>
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                email: document.getElementById('email').value,
                amount: parseFloat(document.getElementById('amount').value),
                currency: document.getElementById('currency').value,
                name: document.getElementById('name').value || 'Test User',
                testMode: document.getElementById('testMode').value
            };
            
            const resultDiv = document.getElementById('result');
            const loading = document.querySelector('.loading');
            
            // Show loading
            resultDiv.style.display = 'none';
            loading.style.display = 'block';
            
            try {
                const response = await fetch('api/test-presale-debug.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                loading.style.display = 'none';
                resultDiv.style.display = 'block';
                
                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Test úspěšný!</h3>
                        <p><strong>Order ID:</strong> ${data.orderId || 'N/A'}</p>
                        <p><strong>ZION Address:</strong> <code>${data.zionAddress || 'N/A'}</code></p>
                        <p><strong>ZION Amount:</strong> ${data.zionAmount || 'N/A'} ZION</p>
                        <p><strong>Timestamp:</strong> ${data.timestamp || 'N/A'}</p>
                        ${data.emailsSent ? '<p><strong>📧 Emaily odeslány:</strong> Ano</p>' : ''}
                        ${data.savedToDb ? '<p><strong>💾 Uloženo do DB:</strong> Ano</p>' : ''}
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ Chyba při testu</h3>
                        <p><strong>Chyba:</strong> ${data.error || 'Neznámá chyba'}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                loading.style.display = 'none';
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Chyba spojení</h3>
                    <p><strong>Chyba:</strong> ${error.message}</p>
                `;
            }
        });
        
        function clearForm() {
            document.getElementById('testForm').reset();
            document.getElementById('result').style.display = 'none';
            document.getElementById('amount').value = '1000';
        }
    </script>
</body>
</html>
