<!DOCTYPE html>
<html>
<head>
    <title>Simple Test</title>
</head>
<body>
    <h1>Direct Test</h1>
    <button onclick="testDirect()">Test API</button>
    <pre id="result"></pre>
    
    <script>
    function testDirect() {
        const resultEl = document.getElementById('result');
        resultEl.textContent = 'Loading...';
        
        const xhr = new XMLHttpRequest();
        xhr.open('POST', './api/email-test-v2.php', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        
        xhr.onload = function() {
            resultEl.textContent = 'Status: ' + xhr.status + '\n';
            resultEl.textContent += 'Response:\n' + xhr.responseText;
        };
        
        xhr.onerror = function() {
            resultEl.textContent = 'Error: ' + xhr.statusText;
        };
        
        xhr.send('{}');
    }
    </script>
</body>
</html>
