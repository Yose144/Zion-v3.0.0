  <rect x="80" y="90" width="1040" height="620" rx="34" fill="rgba(8,12,30,0.78)" stroke="rgba(255,255,255,0.10)"/>

  <rect x="110" y="125" width="340" height="46" rx="23" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
  <circle cx="142" cy="148" r="7" fill="url(#glow)"/>
  <text x="160" y="156" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="16" letter-spacing="6" fill="#ffd700">TESTNET LIVE · QUANTUM LEAP</text>

  <text x="110" y="275" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="86" font-weight="900" fill="#ffffff" letter-spacing="-1">ZION 2.9</text>
  <text x="110" y="332" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="28" fill="rgba(255,255,255,0.78)" letter-spacing="6">Responsive HTML Banner</text>

