# ZIS — auth.zionterranova.com
# nginx reverse proxy for ZION Identity Service

upstream zion_zis {
    server 127.0.0.1:8096;
    keepalive 32;
}

server {
    listen 80;
    server_name auth.zionterranova.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name auth.zionterranova.com;

    # SSL (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/zionterranova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zionterranova.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy to ZIS Fastify server
    location / {
        proxy_pass http://zion_zis;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cookie pass-through for SSO
        proxy_pass_request_headers on;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health check endpoint — no logging
    location = /health {
        proxy_pass http://zion_zis/health;
        access_log off;
    }
}
