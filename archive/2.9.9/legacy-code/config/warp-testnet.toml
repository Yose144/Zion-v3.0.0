# ═══════════════════════════════════════════════════════════════════════════
# VALIDATORS — 3 of 5 multisig
# ═══════════════════════════════════════════════════════════════════════════
[validators]
# Testnet: 1-of-1 (deployer). Mainnet: change to 3-of-5.
threshold = 1
private_key_file = "keys/warp-validator.key"

[[validators.validators]]
name = "WARP Validator 1 (Testnet / Deployer)"
