# Wormhole Architecture for Rainbow Protocol
# Universal cross-chain interoperability for ZION TerraNova
# ═══════════════════════════════════════════════════════════════════════════

[warp]
name = "ZION WARP TestNet Node"
version = "0.1.0"
network = "testnet"

# ── ZION L1 Connection ────────────────────────────────────────────────────
[l1]
rpc_url = "http://91.98.122.165:8444"
rpc_url_backup = "http://127.0.0.1:8444"
vault_address = "zion1warp0000000000000000000000000000vault"
finality_blocks = 60
poll_interval_secs = 15

