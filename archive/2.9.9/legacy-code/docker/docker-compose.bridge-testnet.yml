version: "3.9"

# ──────────────────────────────────────────────────────────────
#  ZION Bridge Relay — TestNet
#
#  Usage:
#    docker compose -f docker/docker-compose.bridge-testnet.yml up -d
#
#  Requires:
#    - zion-bridge:2.9.6-testnet image built (Dockerfile.bridge)
#    - /root/zion-bridge-data/ with bridge.toml + keys/validator.key
#    - zion-net Docker network
# ──────────────────────────────────────────────────────────────

networks:
  zion-net:
    external: true

services:
  zion-bridge:
    image: zion-bridge:2.9.6-testnet
    container_name: zion-bridge
    restart: unless-stopped
    networks:
      - zion-net
    ports:
      - "9101:9101"   # Prometheus metrics (9100 reserved for node-exporter)
    volumes:
      - /root/zion-bridge-data:/data/bridge:rw
    environment:
      # Validator private key for signing EVM transactions (podepisuje EVM TX)
      # Loaded from /data/bridge/keys/validator.key OR from this env var
      ZION_VALIDATOR_PRIVATE_KEY: "${ZION_VALIDATOR_PRIVATE_KEY}"
      # Ankr API key — premium RPC tier (higher rate limits)
      # Set in docker/.env or export ANKR_API_KEY=...
      ANKR_API_KEY: "${ANKR_API_KEY}"
      # Log level (trace, debug, info, warn, error)
      RUST_LOG: "info,zion_bridge=debug"
    command:
      - "--config"
      - "/data/bridge/bridge.toml"
    # Health check via Prometheus metrics endpoint
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9101/metrics"]  # 9101 = bridge metrics
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
