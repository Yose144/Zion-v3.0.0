[package]
name = "verushash-native"
version = "0.1.0"
edition = "2021"
authors = ["Zion Team"]
description = "Rust FFI wrapper for VerusHash v2.2 (VerusCoin) — supports x86_64 and ARM64 (aarch64)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/veruscoin/VerusCoin"
keywords = ["verushash", "crypto", "mining", "hash", "verus"]

[lib]
name = "verushash_native"
path = "src/lib.rs"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
hex = "0.4"
