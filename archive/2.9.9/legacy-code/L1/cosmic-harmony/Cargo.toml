[package]
name = "zion-cosmic-harmony-v3"
version = "3.0.0"
edition = "2021"
authors = ["ZION Core Team <contact@zionterranova.com>"]
description = "Cosmic Harmony v3 - Multi-Algorithm Mining Engine"
license = "MIT"
repository = "https://github.com/Yose144/Zion-2.9.6"
build = "build.rs"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["profit-router"]
gpu = ["dep:opencl3"]
profit-router = ["dep:reqwest"]
metal = ["dep:metal"]
cpu = ["dep:randomx-rs"]
parallel = ["dep:rayon", "dep:num_cpus"]
simd = []

# CHv4 NPU Mixing backend
native-npu = ["dep:ort"]  # ONNX Runtime (CoreML/TensorRT), fallback CPU INT8
npu-fallback-cpu = []     # Vynutit CPU cestu i na NPU hardware (testování deterministnosti)

# Testnet: shortened epoch length (100 blocks) for rapid NPU rotation testing
testnet = []

# Native library features
native-randomx = []
native-yescrypt = []
native-cosmic-harmony = []
native-autolykos = []
native-kawpow = []
native-kawpow-gpu = []
native-ethash = []
native-kheavyhash = []
native-equihash = []
native-progpow = []
native-argon2d = []
native-blake3 = []
native-octopus = []           # Conflux CFX Octopus (cache-based DAG, ~16 MB)
native-cosmic-harmony-v3 = []
native-all = [
    "native-randomx", "native-yescrypt", "native-cosmic-harmony",
    "native-autolykos", "native-kawpow", "native-kawpow-gpu",
    "native-ethash", "native-kheavyhash", "native-equihash",
    "native-progpow", "native-argon2d", "native-blake3", "native-octopus",
    "native-cosmic-harmony-v3"
]

# Rust crate-based algorithms
algo-ethash = ["dep:ethash"]
algo-equihash = ["dep:equihash"]
algo-argon2 = ["dep:argon2"]
algo-kheavyhash = []
algo-all = ["algo-ethash", "algo-equihash", "algo-argon2", "algo-kheavyhash"]

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
keccak = "0.1"
aes = "0.8"
blake3 = "1.5"
blake2 = "0.10"
typenum = "1.17"
digest = "0.10"
tiny-keccak = { version = "2.0", features = ["keccak"] }
rand = "0.8"
log = "0.4"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"

# Optional
ethash = { version = "0.4", optional = true }
equihash = { version = "0.2", optional = true }
argon2 = { version = "0.5", optional = true }
rayon = { version = "1.10", optional = true }
num_cpus = { version = "1.16", optional = true }
opencl3 = { version = "0.9", optional = true }
metal = { version = "0.27", optional = true }
randomx-rs = { version = "1.2", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
ort = { version = "2.0.0-rc.9", default-features = false, features = ["std", "coreml"], optional = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }
rayon = "1.10"

[[bench]]
name = "algorithm_bench"
harness = false

[[bench]]
name = "deeksha_bench"
harness = false

