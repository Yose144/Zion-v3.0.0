# ╔══════════════════════════════════════════════════════════════╗
# ║  ZION TerraNova — Alertmanager Configuration                 ║
# ║  Routing: critical → Discord #critical, warning → #ops-alerts║
# ╚══════════════════════════════════════════════════════════════╝
#
# Potřebné ENV proměnné (nastavit v .env nebo přímo na serveru):
#   DISCORD_WEBHOOK_OPS      — webhook URL #ops-alerts kanálu
#   DISCORD_WEBHOOK_CRITICAL — webhook URL #critical kanálu (může být shodný)
#
# Jak vytvořit webhook:
#   Discord server → kanál → Nastavení → Integrace → Webhooky → Nový webhook
#   URL formát: https://discord.com/api/webhooks/<id>/<token>
#
# Deploy:
#   docker compose -f docker/docker-compose.monitoring.yml up -d alertmanager
#
# Test alertu:
#   curl -X POST http://localhost:9093/api/v1/alerts \
#     -H 'Content-Type: application/json' \
#     -d '[{"labels":{"alertname":"TestAlert","severity":"critical"},"annotations":{"summary":"Test z Alertmanager"}}]'

global:
  resolve_timeout: 5m
  smtp_require_tls: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

# ── Routing ──────────────────────────────────────────────────────────────
route:
  receiver: "discord-ops"
  group_by: ["alertname", "server", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - match:
        severity: critical
      receiver: "discord-critical"
      group_wait: 10s
      repeat_interval: 1h
      continue: false

    - match:
        severity: warning
      receiver: "discord-ops"
      group_wait: 1m
      repeat_interval: 6h
      continue: false

    - match:
        team: infra
      receiver: "discord-ops"
      group_wait: 30s
      repeat_interval: 2h

# ── Inhibition ───────────────────────────────────────────────────────────
inhibit_rules:
  - source_match:
      severity: "critical"
      alertname: "CoreNodeDown"
    target_match:
      severity: "warning"
    equal:
      - server

  - source_match:
      severity: "critical"
      alertname: "PoolDown"
    target_match:
      severity: "warning"
      alertname: "PoolNoShares"
    equal:
      - server

# ── Receivers ────────────────────────────────────────────────────────────
# NOTE: discord_configs requires Alertmanager ≥0.28 and real webhook URLs.
# Env var substitution (${VAR}) is NOT supported by Alertmanager.
# When Discord webhooks are ready, replace the placeholder URLs below
# with actual webhook URLs and switch to discord_configs.
#
# To enable Discord alerts:
# 1. Create webhooks in Discord (Server → Channel → Settings → Integrations)
# 2. Replace webhook_url values with real URLs
# 3. Switch from webhook_configs: [] to discord_configs blocks

receivers:
  - name: "discord-ops"
    # Null receiver — alerts are collected but not forwarded.
    # Replace with discord_configs when webhook URLs are available.
    webhook_configs: []

  - name: "discord-critical"
    # Null receiver — alerts are collected but not forwarded.
    # Replace with discord_configs when webhook URLs are available.
    webhook_configs: []
