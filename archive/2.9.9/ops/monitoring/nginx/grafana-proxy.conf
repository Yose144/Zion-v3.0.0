# ╔══════════════════════════════════════════════════════════════╗
# ║  ZION TerraNova — Nginx Grafana Proxy                        ║
# ║  Add this block to your existing nginx server config         ║
# ╚══════════════════════════════════════════════════════════════╝
#
# This snippet should be included in the main nginx server block
# for zionterranova.com (typically /etc/nginx/sites-enabled/zion)
#
# Usage: include /opt/zion/monitoring/nginx/grafana-proxy.conf;

# ── Grafana reverse proxy at /grafana/ ──
location /grafana/ {
    proxy_pass http://127.0.0.1:3001/grafana/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (for Grafana Live)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# ── Grafana API (for embeds, iframes) ──
location /grafana/api/ {
    proxy_pass http://127.0.0.1:3001/grafana/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

