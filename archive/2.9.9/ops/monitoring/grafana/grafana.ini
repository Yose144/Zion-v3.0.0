# ╔══════════════════════════════════════════════════════════════╗
# ║  ZION TerraNova — Grafana Configuration                      ║
# ╚══════════════════════════════════════════════════════════════╝

[server]
protocol = http
http_port = 3000
domain = zionterranova.com
root_url = https://zionterranova.com/grafana/
serve_from_sub_path = true

[security]
admin_user = admin
; admin_password is set via GF_SECURITY_ADMIN_PASSWORD env var in docker-compose
disable_gravatar = true

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
; AUDIT-FIX I-02: Anonymous access disabled — users must authenticate
enabled = false
org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/zion-pool-overview.json
