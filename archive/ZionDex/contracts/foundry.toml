[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 15

# Base mainnet
[profile.base]
eth_rpc_url = "https://mainnet.base.org"
chain_id = 8453

# Base Sepolia (testnet)
[profile.sepolia]
eth_rpc_url = "https://sepolia.base.org"
chain_id = 84532

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
