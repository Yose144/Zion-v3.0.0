[package]
name = "zion-mining-agent"
version = "1.0.0"
edition = "2021"

[workspace]

[dependencies]
# GPU backends
metal = { version = "0.29", optional = true }

# Async runtime
tokio = { version = "1.50", features = ["full"] }
tokio-tungstenite = "0.20"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }

[features]
default = []
gpu-metal = ["metal"]
gpu-cuda = []  # Placeholder for CUDA support
gpu-amd = []   # Placeholder for AMD support
gpu-all = ["gpu-metal", "gpu-cuda", "gpu-amd"]

[[bin]]
name = "mining-agent"
path = "src/main.rs"
