# ZION V3 L2 Services Stack
#
# Bridge relay, atomic swap, and DAO — runs alongside the L1 stack.
# Shares the zion-v3 Docker network so services can reach the L1 node at "zion-v3-node:8443".
#
# Usage:
#   # Start L1 first (if not already running):
#   docker compose -f V3/docker/docker-compose.v3-mainnet.yml up -d
#
#   # Then start L2 services:
#   docker compose -f V3/docker/docker-compose.v3-l2.yml up -d
#
#   # Logs:
#   docker compose -f V3/docker/docker-compose.v3-l2.yml logs -f bridge
#
#   # Stop L2 only:
#   docker compose -f V3/docker/docker-compose.v3-l2.yml down

services:
  # ── Bridge Relay ───────────────────────────────────────────────────────────
  bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bridge
    image: zion-v3-bridge:latest
    container_name: zion-v3-bridge
    restart: unless-stopped
    network_mode: host
    volumes:
      - bridge-data:/data/bridge
      - ../L2/bridge/config:/etc/zion:ro
    environment:
      ZION_BRIDGE_CONFIG: "${ZION_BRIDGE_CONFIG:-/etc/zion/bridge-testnet.toml}"
      RUST_LOG: "zion_bridge=debug,info"
      # ZION_VALIDATOR_PRIVATE_KEY: ""   # set in .env or secrets manager
      # ZION_VALIDATOR_EXTRA_KEYS: ""    # comma-separated extra validator private keys
      # ZION_VALIDATOR_EXTRA_IDS: ""     # optional comma-separated IDs for extra keys
      ANKR_API_KEY: "${ANKR_API_KEY}"  # Ankr free tier — set in .env (higher rate limits than no key)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9100/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Atomic Swap ────────────────────────────────────────────────────────────
  swap:
    build:
      context: ..
      dockerfile: docker/Dockerfile.swap
    image: zion-v3-swap:latest
    container_name: zion-v3-swap
    restart: unless-stopped
    network_mode: host
    volumes:
      - swap-data:/data/atomic-swap
      - ../L2/atomic-swap/config:/etc/zion:ro
    environment:
      RUST_LOG: "zion_atomic_swap=debug,info"
      # SECURITY: never commit real escrow keys to git.
      # Provide via .env / secrets manager before startup.
      ZION_SWAP_ESCROW_KEY: "${ZION_SWAP_ESCROW_KEY:?set-in-env}"
    command: ["--config", "${ZION_SWAP_CONFIG:-/etc/zion/swap-testnet.toml}"]
    depends_on:
      bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8888/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
      # ZION_SWAP_ESCROW_KEY: ""         # set in .env or secrets manager
      # ZION_RPC_TOKEN: ""

  # ── DAO Governance ─────────────────────────────────────────────────────────
  dao:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dao
    image: zion-v3-dao:latest
    container_name: zion-v3-dao
    restart: unless-stopped
    network_mode: host
    volumes:
      - dao-data:/data/dao
      - ../L2/dao/config:/etc/zion:ro
    environment:
      DAO_CONFIG: "${ZION_DAO_CONFIG:-/etc/zion/dao-testnet.toml}"
      RUST_LOG: "zion_dao=debug,info"
      # ZION_DAO_API_KEY: ""             # set in .env or secrets manager
    depends_on:
      bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8450/api/dao/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  bridge-data:
    driver: local
  swap-data:
    driver: local
  dao-data:
    driver: local
